card("f1", 1, "Fachgespräch: Erklären Sie das Ohmsche Gesetz an einem Beispiel aus der Veranstaltungstechnik.", "U = R × I. Strom steigt mit der Spannung und sinkt mit dem Widerstand.\nBeispiel: Heizlüfter R = 26,5 Ω an 230 V → I = 230 / 26,5 ≈ 8,7 A → P = 230 V × 8,7 A ≈ 2000 W.", "Tipp: Definition in einem Satz, dann Beispiel aus der Praxis, dann ggf. Norm.");
card("f2", 3, "Fachgespräch: Warum wird hinter dem Speisepunkt ein TN-S-System aufgebaut? Was ist das Problem beim TN-C-System?", "TN-S: N und PE getrennt → PE führt keinen Betriebsstrom, RCDs sind einsetzbar, Schutzfunktion bleibt bei N-Unterbrechung erhalten.\nTN-C: Bei Unterbrechung des PEN können alle Gehäuse 230 V führen; RCD nicht möglich.", "");
card("f3", 5, "Fachgespräch: Nennen Sie die fünf Sicherheitsregeln. Warum ist die Reihenfolge wichtig?", "1. Freischalten 2. Gegen Wiedereinschalten sichern 3. Spannungsfreiheit feststellen 4. Erden und kurzschließen 5. Benachbarte, unter Spannung stehende Teile abdecken.\nReihenfolge: Jeder Schritt baut auf dem vorigen auf (erst messen, wenn gesichert; erst erden, wenn spannungsfrei). Aufheben in umgekehrter Reihenfolge.", "Eselsbrücke: Freie Geister Sprechen Ernst Ab.");
card("f4", 5, "Fachgespräch: Was darf eine elektrotechnisch unterwiesene Person (EuP), was nicht?", "Darf: einfache, übertragene Arbeiten unter Leitung und Aufsicht einer EFK, z. B. Leitungen verlegen, Geräte mit automatischem Prüfgerät prüfen.\nDarf nicht: selbstständig Anlagen errichten/ändern, Verantwortung übernehmen oder Prüfungen allein freigeben.", "");
card("f5", 6, "Fachgespräch: Unterschied zwischen Basisschutz und Fehlerschutz?", "Basisschutz: Schutz gegen direktes Berühren – aktive Teile sind nicht berührbar (Isolierung, Gehäuse, Abdeckung).\nFehlerschutz: Schutz bei indirektem Berühren – ein Körperschluss führt zur automatischen Abschaltung (PE + LS/RCD, ≤ 0,4 s).\nZusatzschutz: RCD 30 mA, falls beides versagt.", "");
card("f6", 6, "Fachgespräch: Was besagt die Nennstromregel, und warum schützt der LS die Leitung und nicht das Gerät?", "Ib ≤ In ≤ Iz.\nDer LS ist nach der Strombelastbarkeit der Leitung ausgewählt: Er schaltet ab, bevor die Leitung zu warm wird. Das Gerät hat ggf. eigene Sicherungen.\nBeispiel: 12 A Betriebsstrom, LS 16 A, Leitung Iz = 20 A.", "");
card("f7", 6, "Fachgespräch: Was versteht man unter Selektivität? Beispiel?", "Im Fehlerfall löst nur die Schutzeinrichtung aus, die dem Fehler am nächsten liegt – der Rest der Anlage läuft weiter.\nBeispiel: Kurzschluss in einem Moving Head → nur dessen RCBO C10 löst aus, nicht der C32 der Unterverteilung. Bei RCDs: vorgeschaltet 300 mA Typ S, nachgeschaltet 30 mA.", "");
card("f8", 7, "Fachgespräch: Was ist die Schleifenimpedanz, und warum muss sie gemessen werden?", "Zs = Gesamtwiderstand der Fehlerschleife (Trafo/Generator → L → Körperschluss → PE → Sternpunkt).\nSie muss klein genug sein, damit bei Körperschluss ein ausreichend großer Kurzschlussstrom fließt und der LS rechtzeitig (0,4 s) abschaltet: Zs ≤ U0 / Ia. Messwert max. ca. ⅔ des Rechenwerts.", "");
card("f9", 8, "Fachgespräch: Welche Prüfungen führen Sie nach DIN VDE 0100-600 vor der Inbetriebnahme einer mobilen Anlage durch?", "Besichtigen (Schäden, Schutzorgane, IP, Kennzeichnung, PA) → Erproben (RCD-Prüftaste, NOT-AUS, Drehfeld) → Messen (Durchgängigkeit PE/PA, Isolationswiderstand ≥ 1 MΩ bei 500 V DC, Schleifenimpedanz/Ik, RCD-Auslösestrom und -zeit ≤ 300 ms, Drehfeld) → Dokumentieren (Prüfprotokoll, Errichterbescheinigung).", "");
card("f10", 9, "Fachgespräch: Welche Faktoren beeinflussen die Strombelastbarkeit einer Leitung?", "Querschnitt und Leitermaterial · Verlegeart · Umgebungstemperatur · Häufung/Bündelung · Anzahl belasteter Adern · Aufwicklung auf der Kabeltrommel (z. B. 5 Lagen ≈ 0,38).\nIz = Iz(Tabelle) × f1 × f2 × f3.", "");
card("f11", 10, "Fachgespräch: Wie gehen Sie bei der Strombedarfsermittlung für eine Veranstaltung vor?", "1. Verbraucherliste mit Leistungen 2. Nach Gewerken summieren 3. Gleichzeitigkeitsfaktor 4. cos φ und Einschaltströme beachten 5. ca. 20 % Reserve 6. Strom pro Außenleiter berechnen (P / 230 V bzw. P / (√3 × 400 V)) und Anschluss wählen (CEE 16/32/63/125 A, Powerlock).", "");
card("f12", 10, "Fachgespräch: Warum verteilt man Lasten symmetrisch? Was passiert bei LED-Lasten im Neutralleiter?", "Kein Außenleiter wird überlastet, volle Anschlussleistung nutzbar, N wird entlastet (Ströme heben sich auf), Stromerzeuger vertragen keine Schieflast.\nLED/Schaltnetzteile erzeugen Oberschwingungen 3. Ordnung, die sich im N addieren → N kann stärker belastet sein als die Außenleiter; Querschnitt nie reduzieren.", "");

// ---------- Aus den Übungsaufgaben der Lernunterlage ----------
mc("l20", 6, "Betriebsstrom 18 A, Leitung mit Iz = 25 A. Welchen LS wählen Sie?", ["16 A", "20 A", "32 A", "40 A"], 1, "Ib ≤ In ≤ Iz → 18 ≤ <b>20</b> ≤ 25. 16 A würde auslösen, 32 A würde die Leitung nicht schützen.");
mc("l21", 7, "LS C16, gemessene Schleifenimpedanz 0,8 Ω. Ist die Abschaltbedingung erfüllt?", ["Nein, Ik zu klein", "Ja: Ik ≈ 287 A ≥ 160 A und 0,8 Ω ≤ 0,96 Ω", "Nur mit RCD", "Nicht bestimmbar"], 1, "<span class='formula'>Ik = 230 / 0,8 ≈ 287 A ≥ 10 × 16 = 160 A</span>, und 0,8 Ω liegt unter 0,96 Ω (⅔-Regel).");
mc("l22", 7, "LS C16, gemessen Zs = 1,2 Ω. Was ist richtig?", ["Alles in Ordnung", "Rechnerisch knapp ausreichend, aber über 0,96 Ω (⅔-Regel) → nicht sicher; B16 oder RCD einsetzen", "C32 einsetzen", "Leitung verlängern"], 1, "Ik = 230 / 1,2 ≈ 192 A ≥ 160 A, aber 1,2 Ω > 0,96 Ω → nicht sicher erfüllt. Lösung: B16 (max. 1,92 Ω) oder RCD.");
mc("l23", 10, "24 Scheinwerfer à 575 W werden symmetrisch verteilt. Reicht ein CEE 16 A?", ["Ja, 12 A je Phase", "Nein: 4600 W je Phase → 20 A → CEE 32 A nötig", "Ja, 16 A genau", "Nein, CEE 63 A nötig"], 1, "13 800 W / 3 = 4600 W → 4600 / 230 = <b>20 A</b> > 16 A.");
mc("l24", 9, "Ab wann gilt eine Spannungsfall-Empfehlung als überschritten?", ["Ab 1 %", "Über 3 % vom Speisepunkt bis zum Verbraucher (max. 5 %)", "Ab 10 %", "Es gibt keine Grenze"], 1, "Empfohlen <b>3 %</b>, höchstens 5 %.");
mc("l25", 6, "Welche Kleinspannungsgrenzen gelten in feuchten Bereichen?", ["50 V AC / 120 V DC", "25 V AC / 60 V DC", "12 V AC / 30 V DC", "230 V AC"], 1, "Normal 50 V AC / 120 V DC, in feuchten Bereichen <b>25 V AC / 60 V DC</b>.");
mc("l26", 8, "Wann wird eine nichtstationäre Anlage laut DGUV V3 (Richtwert) wiederkehrend geprüft?", ["Monatlich", "Jährlich – in der VT zusätzlich nach jedem Aufbau", "Alle 4 Jahre", "Nie"], 1, "Richtwert <b>1 Jahr</b>, stationäre Anlagen 4 Jahre.");
CALC.push({ id: "c_mixed", t: 4, gen() { const R1 = pick([5, 10, 15]); const [R2, R3] = pick([[20, 30], [30, 60], [12, 24], [40, 40]]); const R23 = R2 * R3 / (R2 + R3); const R = R1 + R23; return { q: `R1 = ${R1} Ω in Reihe mit der Parallelschaltung aus R2 = ${R2} Ω und R3 = ${R3} Ω, an 230 V. Wie groß ist der Gesamtstrom?`, a: 230 / R, unit: "A", ex: `<span class='formula'>R23 = (${R2} × ${R3}) / (${R2} + ${R3}) = ${de(R23)} Ω → R = ${R1} + ${de(R23)} = ${de(R)} Ω → I = 230 / ${de(R)} = ${de(230 / R)} A</span>` }; } });
CALC_NAME.c_mixed = "Gemischte Schaltung: Gesamtstrom";
CALC.push({ id: "c_genres", t: 2, gen() { const P = pick([30, 40, 45, 60, 80]); const c = pick([0.8, 0.9]); const S = P / c * 1.2; return { q: `Gesamtwirkleistung ${P} kW, cos φ = ${de(c)}, 20 % Reserve. Welche Scheinleistung muss der Stromerzeuger haben?`, a: S, unit: "kVA", ex: `<span class='formula'>S = ${P} / ${de(c)} = ${de(P / c, 1)} kVA → × 1,2 = ${de(S, 1)} kVA</span>` }; } });
CALC_NAME.c_genres = "Stromerzeuger mit Reserve (kVA)";
CALC.push({ id: "c_halo", t: 4, gen() { const n = pick([2, 3, 4, 6]); const P = pick([500, 650, 1000, 1200]); const R = 230 * 230 / P; return { q: `${n} Halogenscheinwerfer mit je ${P} W hängen parallel an 230 V. Wie groß ist der Ersatzwiderstand?`, a: R / n, unit: "Ω", ex: `<span class='formula'>R je Scheinwerfer = 230² / ${P} = ${de(R, 1)} Ω → Rges = ${de(R, 1)} / ${n} = ${de(R / n)} Ω</span>` }; } });
CALC_NAME.c_halo = "Ersatzwiderstand paralleler Scheinwerfer";

// ---------- IHK-Prüfungen „Sicherstellen der Energieversorgung“ (AbEV) ----------
// lv: "offiziell" = Lösungsvorschlag der IHK liegt vor · "eigen" = Lösung selbst erarbeitet (bitte prüfen)
// own:true an einer Aufgabe = eigene Lösung · rec:true = Aufgabentext aus der Lösung rekonstruiert
const EXAMS = [
{
  id: "W2018", term: "Winter 2018/19", title: "Band-Festival „Turn Around“ im Kulturzentrum", lv: "eigen", max: 50,
  scen: `Ein Kulturzentrum beauftragt Sie mit Planung und Durchführung eines Band-Festivals. Hauptsaal 23 m × 12 m mit Bühne 1 (55 m², Traverse 8 m), Bühne 2 (24 m²) und FOH.<br>Einspeisungen laut Plan: Bühne 1: 2 × CEE 63A/400V · Bühne 2: 1 × CEE 32A/400V + 1 × CEE 16A/400V · FOH: 1 × CEE 16A/400V.`,
  tasks: [
    { u: "U1", p: 10, own: true, q: `1. Ermitteln Sie den Leistungsbedarf der Lichttechnik (in VA):<br>10 × Fresnel 1000 W · 4 × Fresnel 2000 W · 8 × Profil 1000 W · 6 × 6er-Bar 3000 W · 3 × ACL-Set 2000 W · 20 × LED-RGB-Par 70 W (kompensiert) · 10 × LED-Wash-ML 350 VA · 6 × LED-Spot-ML 380 VA · 6 × Dimmer 12 × 10 A · 1 × Lichtpult 350 VA<br>2. Ermitteln Sie den Gesamtstrombedarf I (in A).<br>3. Legen Sie zwei Schutzmaßnahmen gegen elektrische Gefährdungen fest.`,
      sol: `<b>1.</b> 10 000 + 8 000 + 8 000 + 18 000 + 6 000 + 1 400 + 3 500 + 2 280 + 350 = <b>57 530 VA</b><br>(Die Dimmer haben keine eigene Leistung – ihre Last sind die Scheinwerfer, sonst würde doppelt gezählt. „Kompensiert“ → cos φ ≈ 1, also W ≈ VA.)<br><b>2.</b> I = S / (√3 × 400 V) = 57 530 VA / 692,8 V ≈ <b>83 A je Außenleiter</b> (bei symmetrischer Verteilung). Einphasig gerechnet: 57 530 / 230 = 250 A gesamt → ÷ 3 ≈ 83 A.<br>→ Die 2 × CEE 63A an Bühne 1 reichen (126 A), ein CEE 125A wäre ebenfalls passend.<br><b>3.</b> z. B. Zusatzschutz durch RCD ≤ 30 mA · Schutzpotenzialausgleich der Traversen (16 mm² Cu) · Schutz durch automatische Abschaltung (passende LS) · nur geprüfte Betriebsmittel einsetzen.` },
    { u: "U2", p: 10, own: true, q: `Verstärker-Datenblatt (alle Kanäle): max. Ausgangsleistung 4 × 1400 W an 8 Ω · 4 × 2600 W an 4 Ω · 4 × 3300 W an 2,7 Ω.<br>Stromaufnahme 1/3 Leistung (−5 dB, „worst case“): 10,5 A/2300 W (8 Ω) · 19 A/4200 W (4 Ω) · 26 A/5500 W (2,7 Ω).<br>1/8 Leistung (−9 dB, Normalbetrieb): 4,8 A/1050 W · 8,1 A/1850 W · 11,5 A/2400 W. Idle 1 A/160 W.<br>Beispiel im Datenblatt: 4 Ω, 1/8 → 4 × 325 W = 1300 W Ausgang, 1850 W Aufnahme → Wärme 550 W.<br>1. Bestimmen Sie die maximale Stromaufnahme (worst case). Jeder der vier Kanäle treibt zwei parallel geschaltete 8-Ω-Lautsprecher.<br>2. Berechnen Sie die zu erwartende Verlustleistung P<sub>verl</sub>.<br>3. Worauf achten Sie beim Einsatz wegen der Verlustleistung?`,
      sol: `<b>1.</b> 2 × 8 Ω parallel = 4 Ω je Kanal. Worst case = 1/3 Ausgangsleistung → Spalte 4 Ω: <b>I = 19 A</b>.<br><b>2.</b> Normalbetrieb (1/8, 4 Ω): P<sub>verl</sub> = 1850 W − 4 × 325 W = <b>550 W</b>. (Im worst case: 4200 W − 4 × 2600 W / 3 ≈ 733 W.)<br><b>3.</b> Wärme muss abgeführt werden: Rack-Belüftung/Lüfter frei, Abstand zu Wänden, Racks nicht abdecken, ausreichend Raumlüftung/Klimatisierung, Umgebungstemperatur beachten, nicht in engen geschlossenen Räumen.` },
    { u: "U3", p: 10, own: true, q: `Bühne 2 wird nur mit konventionellem Licht beleuchtet. Übergabepunkt CEE 32A/400V 3L+N+PE.<br>Material: 1 UV (IN CEE32, OUT 2 × CEE32 + 3 × Schuko) · 2 Dimmer (IN CEE32, OUT 12 × 10 A auf 2 × HAN16) · 4 Last-Multicore 20 m · 2 Plugboxen (HAN16 → 6 × Schuko) · 2 × 6er-Bar 6 × 0,5 kW (HAN16) · 4 × Stufenlinse 1 kW · 2 × Stufenlinse 2 kW · 4 × Profil 1 kW · 2 × ACL-Set 2 kW.<br>1. Erstellen Sie ein Blockschaltbild vom Übergabepunkt bis zu den Plugboxen/6er-Bars.<br>2. Beurteilen Sie, ob am Übergabepunkt eine Überlast entsteht.`,
      sol: `<b>1.</b> ÜP CEE32 → UV (IN CEE32) → 2 × CEE32-Abgang → Dimmer 1 und Dimmer 2 → je 2 × HAN16-Ausgang → Last-Multicore 20 m → Plugbox 1, Plugbox 2, 6er-Bar 1, 6er-Bar 2 (je ein Multicore).<br><b>2.</b> Last: 6er-Bars 2 × 3 kW = 6 kW · Stufen 4 kW + 4 kW · Profile 4 kW · ACL 4 kW → <b>22 kW</b>.<br>Ideal symmetrisch: 22 000 W / 3 / 230 V ≈ <b>31,9 A je Außenleiter</b> → knapp unter 32 A, <b>keine Reserve</b>. Jede ungleiche Kanalverteilung führt zur Überlast einer Phase → Überlast praktisch zu erwarten; größeren Anschluss (CEE 63A) oder weniger Last.` },
    { u: "U4", p: 10, own: true, q: `Messprotokoll Übergabepunkt Bühne 1 (CEE 63A/400V/5P, Schutzorgan MCB B63A 3P):<br>Schutzleiter spannungsfrei · L1-N 238 V, L2-N 235 V, L3-N 230 V · L1-L2 406 V, L1-L3 404 V, L2-L3 407 V · Rechtsdrehfeld · keine RCD am Übergabepunkt · Netzimpedanz L1-PE 0,5 Ω/460 A · L2-PE 0,45 Ω/511 A · L3-PE 0,55 Ω/418 A.<br>Richtwerte: 230 V (207…244 V), 400 V (360…424 V), B-LS: I<sub>a</sub> > 5 × I<sub>N</sub>, C-LS: I<sub>a</sub> > 10 × I<sub>N</sub>.<br>1. Beurteilen Sie die Messergebnisse.<br>2. Nennen Sie fünf Punkte der Sichtprüfung (SQP4 / DIN VDE 0100-600).<br>3. Es ist keine RCD vorhanden. Worauf achten Sie in der nachfolgenden mobilen Anlage?`,
      sol: `<b>1.</b> Spannungen alle im Toleranzband → i. O. · Drehfeld rechts → i. O. · B63: I<sub>a</sub> > 5 × 63 A = 315 A; gemessen 460/511/418 A → alle > 315 A → <b>Abschaltung gewährleistet</b>. Ergebnis: Anschlusspunkt betriebssicher (RCD muss in der eigenen Anlage folgen).<br><b>2.</b> z. B. Gehäuse/Steckverbindungen/Leitungen unbeschädigt · Typenschilder/Prüfplaketten vorhanden · Leitungen kreuzen keine Rettungswege, keine Stolpergefahr · IP-Schutzart passend · Lüftungsöffnungen frei · Potenzialausgleich angeschlossen (≥ 16 mm²) · Stromkreise gekennzeichnet · Schutzorgane richtig bemessen.<br><b>3.</b> Zusatzschutz durch eigene RCD ≤ 30 mA für alle Endstromkreise (z. B. UV mit RCD/RCBO), Selektivität beachten, nach Aufbau RCD prüfen (Auslösestrom/-zeit).` },
    { u: "U5", p: 10, own: true, q: `Zwölf Kunstlichtscheinwerfer der Bühne 1 hängen an einem Dimmer 12 × 10 A. Jeder Kanal: MCB C10. Dimmereingang: RCD 40 A/30 mA/4p.<br>1. Ein Scheinwerfer leuchtet nicht – drei mögliche Ursachen?<br>2. Drei Schritte zur Fehlersuche?<br>3. Bei Inbetriebnahme löst die RCD aus – drei mögliche Ursachen?<br>4. Erläutern Sie Ihre Vorgehensweise zur Fehlersuche.`,
      sol: `<b>1.</b> Leuchtmittel defekt · Kanal-MCB ausgelöst · Leitung/Stecker defekt · falsch gepatcht bzw. Kanal nicht hochgezogen · Dimmerkanal defekt.<br><b>2.</b> Kanal am Pult prüfen (Patch, Level) · Kontrolle MCB/Anzeige am Dimmer · Scheinwerfer an anderen Kanal stecken bzw. Leitung tauschen · Leuchtmittel im freigeschalteten Zustand prüfen.<br><b>3.</b> Isolationsfehler/Körperschluss in einem Scheinwerfer · Feuchtigkeit in Stecker/Leitung · beschädigte Leitung · Summe der Ableitströme zu hoch · N und PE verbunden/vertauscht.<br><b>4.</b> Alle Verbraucher trennen, RCD wieder einschalten, Verbraucher einzeln zuschalten bis zur Auslösung → fehlerhaftes Gerät/Leitung gefunden; aussondern, kennzeichnen, Isolationsmessung, Reparatur durch EFK.` }
  ]
},
{
  id: "S2019", term: "Sommer 2019", title: "Schwimmbadparty im Freibad", lv: "eigen", max: 50,
  scen: `Freibad-Party mit Liveband auf Open-Air-Bühne (12 m × 9 m) und DJ-Platz über dem Schwimmbecken. Becken nutzbar, max. 2400 Besucher, 18–24 Uhr, keine Spezialeffekte.<br>Material Bühne: 4 × Stufenlinse 230 V/2 kW · 10 × Stufenlinse 1 kW · 2 × 6er-Bar PAR64 6 × 1 kW · 4 × MH-Wash 580 W/2,6 A/cos φ 0,981 · 4 × MH-Profile 565 W/2,5 A/cos φ 0,988 · 1 × Amp-Rack CEE 32A/400V.`,
  tasks: [
    { u: "U1", p: 10, own: true, q: `Laut DGUV I 215-314 / DIN VDE 0100-702: Bereich 0 = Inneres des Beckens · Bereich 1 = Volumen über dem Becken bis 2,5 m Höhe und bis 2,0 m Abstand vom Beckenrand. In Bereich 0 und 1 nur Schutzkleinspannung oder Schutztrennung, keine Verteiler/Dimmer/Vorschaltgeräte.<br>Plan: UV 1 steht neben der Bühne auf der Liegewiese, UV 2 direkt am Beckenrand neben dem DJ-Platz.<br>Dürfen UV 1 und UV 2 so platziert werden? Begründen Sie.`,
      sol: `<b>UV 1</b>: weit außerhalb von Bereich 0/1 → <b>zulässig</b>.<br><b>UV 2</b>: steht am Beckenrand, also innerhalb von 2 m → <b>Bereich 1</b> → Verteiler dort <b>nicht zulässig</b>. UV 2 muss mehr als 2 m vom Beckenrand entfernt aufgestellt werden (DJ-Technik im Bereich 1 nur mit SELV oder Schutztrennung).` },
    { u: "U2", p: 10, own: true, q: `Die Betriebsmittel der Open-Air-Bühne werden über UV 1 versorgt. Berechnen Sie den Strombedarf I (in A) und bestimmen Sie den benötigten Anschluss.`,
      sol: `Konventionell: 4 × 2 kW + 10 × 1 kW + 2 × 6 kW = 30 kW → 30 000 W / 230 V = 130,4 A<br>Moving Heads: 4 × 2,6 A + 4 × 2,5 A = 20,4 A<br>Summe einphasig 150,8 A → symmetrisch ÷ 3 = <b>50,3 A je Außenleiter</b><br>Amp-Rack CEE 32A (keine Angabe → volle 32 A je Außenleiter)<br>Gesamt ≈ <b>82,3 A je Außenleiter → CEE 125A/400V</b>` },
    { u: "U3", p: 10, own: true, q: `1. Alle konventionellen Scheinwerfer (Pos. 1–3) werden <b>einzeln</b> gedimmt. Bestimmen Sie Anzahl und Ausgangsleistungen der Dimmerpacks.<br>2. Bestimmen Sie Eingang, Ausgänge und Schutzorgane der UV 1. Die Dimmerpacks haben keine RCD.`,
      sol: `<b>1.</b> 4 + 10 + 12 (2 Bars × 6 PAR) = <b>26 Dimmerkanäle</b>. z. B. 5 × 6-Kanal-Dimmerpack mit je 6 × 2,3 kW (10 A) = 30 Kanäle (4 Reserve); 2 kW / 230 V = 8,7 A ≤ 10 A. Eingang je Pack CEE 32A/400V.<br><b>2.</b> IN: CEE 125A/400V 5P.<br>OUT: 5 × CEE 32A/400V (Dimmer) – je RCD 40 A/30 mA/4P + MCB C32 3P · 1 × CEE 32A/400V (Amp-Rack) – RCD 40 A/30 mA/4P (Typ B empfehlenswert) + MCB C32 3P · Abgänge für Moving Heads, z. B. 3 × CEE16 230 V oder Schuko – je RCD 25 A/30 mA/2P + MCB C16 1P (oder RCBO).<br>Weil die Dimmer keine RCD haben, muss der Zusatzschutz in der UV 1 sitzen.` },
    { u: "U4", p: 10, own: true, q: `Prüfung nach DIN VDE 0100-600 (Besichtigen, Erproben und Messen). Geben Sie je ein Beispiel für das Besichtigen und für das Erproben/Messen an: Traversenkonstruktion · Zuleitung Baustromverteiler UV 1 · Scheinwerfer · Unterverteilung 1 · Plugboxen.`,
      sol: `<b>Traverse</b>: PA angeschlossen, 16 mm², feste Verbindung · Niederohmigkeit des PA messen.<br><b>Zuleitung UV 1</b>: unbeschädigt, H07RN-F, passender Querschnitt, keine Stolperstelle/Rettungsweg · Spannung/Drehfeld, Schleifenimpedanz/I<sub>k</sub>, Isolationswiderstand.<br><b>Scheinwerfer</b>: Gehäuse/Linse unbeschädigt, Sekundärsicherung, Prüfplakette, IP für außen · Funktion erproben, Schutzleiterdurchgang.<br><b>UV 1</b>: Schutzorgane richtig bemessen, Stromkreise gekennzeichnet, IP/verschlossen · RCD-Prüftaste, Auslösestrom und -zeit messen.<br><b>Plugboxen</b>: Gehäuse und Steckdosen unbeschädigt, Plakette · Schutzleiterwiderstand, Spannung an den Steckdosen, RCD-Auslösung über die Steckdose.` },
    { u: "U5", p: 10, own: true, q: `Bei Inbetriebnahme löst nur ein MCB im Stromkreis eines Stufenlinsenscheinwerfers sofort aus.<br>1. Welche Fehlerart liegt vor?<br>2. In welchem Anlagenteil muss sich der ausgelöste MCB befinden (Selektivität vorausgesetzt)?<br>3. Nennen Sie vier mögliche Anlagenteile, in denen der Fehler liegen kann.`,
      sol: `<b>1.</b> Sofortige Auslösung (magnetischer Auslöser) → <b>Kurzschluss</b>.<br><b>2.</b> Im <b>Dimmerpack</b> (Kanal-MCB des betroffenen Kanals) – der dem Fehler am nächsten liegende Schutz.<br><b>3.</b> Leuchtmittel · Fassung/interne Verdrahtung des Scheinwerfers · Anschlussleitung/Stecker · Verlängerung · Multicore bzw. Breakout/Spider · Dimmerausgang.` }
  ]
},
{
  id: "W2020", term: "Winter 2020/21", title: "Hochzeit im Straßenbahnmuseum – Catering", lv: "offiziell", max: 60,
  scen: `Hochzeit in einem Straßenbahnmuseum, Übergabepunkt CEE 125A/400V/5P mit PE-Schiene. Catering-Geräte: Fritteuse 14 kW (CEE32 400V) · Pizzaofen 10 kW (CEE16 400V) · 2 × Salamander-Grill 3 kW (CEE16 230V) · 4 × Induktionsplatte 3,5 kW (CEE16 230V) · 2 × Heißluftofen 2,67 kW (CEE16 230V) · 2 × Wärmeschrank 1,2 kW · 4 × Bain-Marie 1,2 kW · 3 × Kühlschrank 350 W · 3 × Weinschrank 100 W (Schuko).`,
  tasks: [
    { u: "U1", p: 10, q: `Überprüfen Sie, ob der Übergabepunkt CEE 125A für das Catering richtig dimensioniert ist.`,
      sol: `P<sub>ges</sub> = 14 + 10 + 2·3 + 4·3,5 + 2·2,67 + 6·1,2 + 3·0,35 + 3·0,1 = <b>57,89 kW</b><br>I = P / (√3 × 400 V) = 57,89 kW / 692,8 V = <b>83,56 A</b> &lt; 125 A → ausreichend dimensioniert.` },
    { u: "U2", p: 10, q: `Lagerbestand: UV1 Modell A (IN CEE125, OUT 2 × CEE63 mit MCB 63A C 3P, <b>ohne RCD</b>) oder Modell B (zusätzlich 2 × RCD 63A/30mA/4P). UV2 Modell A (3 × CEE32 mit RCD 40A/30mA + MCB; 12 × CEE16 230V über 3 × RCD 63A/30mA 2P + 12 × MCB) oder Modell B (18 × CEE16 230V mit je RCBO 16A 1P+N C 30mA).<br>Treffen Sie eine begründete Auswahl unter Berücksichtigung der RCD-Selektivität bzw. Betriebssicherheit.`,
      sol: `<b>UV1 → Modell A</b>: Hier auf eine RCD verzichten, um Selektivität bei Körperschluss zu erreichen. Mit Modell B könnte ein Körperschluss an einem Endverbraucher sämtliche Verbraucher der UV 2 bzw. 3 abschalten.<br><b>UV2 → Modell B</b>: Jeder CEE16-Abgang hat eine eigene RCBO → bei Körperschluss schaltet nur der betroffene Stromkreis ab. Heizgeräte (Öfen, Fritteusen) haben hohe Schutzleiterströme, die sich an einer gemeinsamen RCD summieren und sie auslösen könnten. → Hohe Selektivität und Betriebssicherheit.` },
    { u: "U3", p: 10, q: `Berechnen Sie den maximalen Außenleiterstrom am Eingang der UV 2 (Induktionsplatten 4 × 3,5 kW, Salamander 2 × 3 kW, Heißluftofen 2 × 2,67 kW), symmetrische Verteilung anstreben.`,
      sol: `Verteilung: L1 = 3,5 + 3 + 2,67 kW · L2 = 3,5 + 3 + 2,67 kW · L3 = 3,5 + 3,5 kW = 7 kW<br>Höchstbelasteter Außenleiter: P = <b>9,17 kW</b><br>I = P / U = 9 170 W / 230 V = <b>39,87 A</b>` },
    { u: "U4", p: 10, q: `Der Cateringbereich wird mit LED-Scheinwerfern am Traversenkreis beleuchtet. Nennen Sie neben der RCD zwei weitere elektrische Schutzmaßnahmen.`,
      sol: `– Traverse mittels Potenzialausgleich an die PA-Schiene anschließen<br>– Nur geprüfte Betriebsmittel einsetzen<br>– IP-Schutzart der Geräte muss den Einsatzbedingungen entsprechen<br>– Mobile Anlage absperren, Unbefugten unzugänglich machen` },
    { u: "U5", p: 10, q: `Vor dem Anschluss an den Übergabepunkt CEE 125A ist dieser zu überprüfen.<br>1. Nennen Sie die durchzuführenden Messungen.<br>2. Nennen Sie zwei Voraussetzungen für den Anschluss.`,
      sol: `<b>1.</b> Spannungen L1, L2, L3 gegen N · L1, L2, L3 gegen PE · zwischen den Außenleitern · Durchgang bzw. Spannungsfreiheit N–PE · (Drehfeld)<br><b>2.</b> Die Person muss elektrotechnisch unterwiesen sein · Die Steckverbindung ist im lastfreien Zustand herzustellen.` },
    { u: "U6", p: 10, q: `Nach dem Aufbau führen Sie eine Errichterprüfung durch.<br>1. Nennen Sie fünf Punkte der Besichtigung.<br>2. Nennen Sie zwei Messungen.`,
      sol: `<b>1.</b> Keine Beschädigungen an Gehäusen, Steckverbindungen, Leitungen · Typenschilder vorhanden · Leitungswege kreuzen keine Rettungswege · keine Stolpergefahr · Geräte geprüft · IP-Schutzcode passend · Lüftungsöffnungen frei · Wärme erzeugende Geräte mit Abstand · richtige Leitungsauswahl · PA korrekt angeschlossen (≥ 16 mm²) · Stromkreise gekennzeichnet · Schutzorgane richtig bemessen.<br><b>2.</b> RCD: Auslösestrom und Auslösezeit · Potenzialausgleich: Niederohmigkeit.` }
  ]
},
{
  id: "S2021", term: "Sommer 2021", title: "Bühne mit Drehscheibe und Wasservorhang", lv: "offiziell", max: 70, rec: true,
  scen: `<b>Hinweis:</b> Für Sommer 2021 liegt nur das Lösungsheft vor. Die Aufgabentexte sind aus den Lösungen rekonstruiert – Daten können fehlen.`,
  tasks: [
    { u: "U1", p: 10, rec: true, q: `1. Welche Spannungen erwarten Sie bei der Messung am Übergabepunkt (L–N, L–L, L–PE, N–PE)?<br>2. Die Messwerte sind auffällig. Welcher Fehler könnte vorliegen und wie gehen Sie weiter vor?`,
      sol: `<b>1.</b> L–N: 230 V · L–L: 400 V · L–PE: 230 V · N–PE: 0 V bzw. Durchgang.<br><b>2.</b> Der N-Leiter könnte nicht angeschlossen sein. Vorgehen: zuständige Elektrofachkraft/Auftraggeber/Betreiber informieren – der Anschluss darf so nicht in Betrieb genommen werden.` },
    { u: "U2", p: 10, rec: true, q: `1. Berechnen Sie den Strombedarf der Gewerke Ton (4 × 5 A, 4 × 3 A, 1 × 3 A, 2 × 1 A, 1 × 1 A), Licht (24 × 220 W, 10 × 150 W) und Effekte (1,8 kW + 1,5 kW + 1,8 kW).<br>2. Es gibt drei Übergabepunkte CEE 16A/400V. Reicht das?`,
      sol: `<b>1.</b> Ton: 5·4 + 3·4 + 3 + 1·2 + 1 = <b>38 A</b> · Licht: 220·24 + 150·10 = 6780 W → 6780/230 = <b>29,5 A</b> · Effekte: 5,1 kW → 5100/230 = <b>22,17 A</b><br><b>2.</b> Pro Anschluss 3 × 16 A = 48 A, insgesamt 3 × 48 A. Jedes Gewerk kann über einen eigenen Übergabepunkt versorgt werden – der Bedarf ist gedeckt.` },
    { u: "U3", p: 10, rec: true, q: `Erstellen Sie das Blockschaltbild: ÜP1–ÜP3 je CEE16A, UV2 für Ton, UV2 für Video/Effekte, UV1 (Eingang CEE32) für Licht mit Plugboxen über HAN16.`,
      sol: `ÜP1 CEE16 → Drehstromleitung CEE16/5P → UV 2 → Ton<br>ÜP2 CEE16 → Drehstromleitung CEE16/5P → UV 2 → Video und Effekte<br>ÜP3 CEE16 → <b>Drehstromadapter CEE16/5P auf CEE32/5P</b> → UV 1 → Licht → Multicore HAN16 → Plugbox (In HAN16, Out HAN16 + 12 × Schuko) → Plugbox (12 × Schuko) · zweiter HAN16 → Plugbox (6 × Schuko)` },
    { u: "U4", p: 10, rec: true, q: `Verteilen Sie die Tontechnik symmetrisch auf L1–L3: 4 × Aktiv-Bass 5 A · 4 × Aktiv-Topteil 3 A · 1 × DJ-Monitor 3 A · 2 × CD/USB-Player 1 A · 1 × Mischpult 1 A. Begründen Sie.`,
      sol: `z. B. Bass: L1 10 A, L2 5 A, L3 5 A · Topteile: L1 3, L2 6, L3 3 · Monitor: L3 3 · Player: L2 2 · Pult: L3 1 → <b>L1 13 A · L2 13 A · L3 12 A</b> (weitere Verteilungen möglich).<br>Begründung: möglichst symmetrische Phasenauslastung.` },
    { u: "U5", p: 10, rec: true, q: `1. Darf eine CEE16-Einspeisung auf einen CEE32-Eingang adaptiert werden?<br>2. Begründen Sie, ob eine zusätzliche Absicherung nötig ist.`,
      sol: `<b>1.</b> Ja.<br><b>2.</b> Eine <b>Aufwärtsadaptierung</b> bewirkt eine Erhöhung des Aderquerschnitts; der vorgeschaltete Schutz (16 A) schützt auch die dickere Leitung → keine zusätzliche Absicherung nötig. (Abwärts wäre eine Absicherung nötig!)` },
    { u: "U6", p: 10, rec: true, q: `Nennen Sie die Anforderungen an den Schutzpotenzialausgleich.`,
      sol: `– Alle leitenden Bühnenaufbauten, die eine Spannung annehmen können, anschließen<br>– Leitungen H07RN-F oder gleichwertig<br>– Steckverbindungen einpolig<br>– Grün-gelbe Kennzeichnung (nicht zwingend durchgängig)<br>– Steckverbinder mit Haltevorrichtung (Verriegelung), gegen Öffnen ohne Werkzeug gesichert<br>– Querschnitt mind. 16 mm², Material Kupfer<br>– Errichterprüfung für das PA-System durchführen` },
    { u: "U7", p: 10, rec: true, q: `Nennen Sie je drei Prüfungen/Messungen der Errichterprüfung (1. Teil und 2. Teil laut Lösung).`,
      sol: `<b>1.</b> Auslösestrom der RCD · Durchgängigkeit des Schutzleitersystems · Isolationswiderstand<br><b>2.</b> Schleifenimpedanz · Auslösezeit der RCD · Spannung` }
  ]
},
{
  id: "W2021", term: "Winter 2021/22", title: "Weihnachtsmarkt mit Eisfläche und Generator", lv: "eigen", max: 50,
  scen: `Eislauffläche 13 m × 8 m auf einem Weihnachtsmarkt, umrahmt von Ground-Support mit Licht, Ton und vier LED-Wänden. Showbühne 6 m × 3 m. Versorgung über einen Generator (nur Übergabepunkt: geerdet, PA-Schiene, nur Überstromschutz).`,
  tasks: [
    { u: "U1", p: 10, own: true, q: `1. Strombedarf (Licht/Ton Ground-Support über Racks A–D, für Kettenzüge und Racks volle Anschlussleistung):<br>Ton Showbühne: 4 × Fullrange 2,5 A · 4 × Monitor 2 A · 4 × Sub 9,5 A · FOH 5 A · Band 12 A<br>Licht Showbühne: 4 × Stufen 4,4 A · 4 × Stagebar 0,2 A · Pult 5 A · 60 × Pixelarray 2,5 A<br>Kettenzugsteuerung 1 × CEE32A/400V · Racks A–D 4 × CEE32A/400V<br>2. Kettenzüge sind nur für die Montage. Generator-Angebote: Modell 1: 300 kVA/240 kW (68 dB(A)/7 m) · Modell 2: 175 kVA/140 kW (70 dB(A)/7 m). Bestimmen Sie den Gesamtstrom und wählen Sie ein Modell.`,
      sol: `<b>1.</b> Ton Showbühne: 10 + 8 + 38 + 5 + 12 = <b>73 A</b> · Licht Showbühne: 17,6 + 0,8 + 5 + 150 = <b>173,4 A</b> · Kettenzugsteuerung: <b>32 A</b> je Außenleiter · Racks A–D: 4 × 32 A = <b>128 A</b> je Außenleiter.<br><b>2.</b> Showbühne symmetrisch: (73 + 173,4) / 3 ≈ 82,1 A je Außenleiter + Racks 128 A ≈ <b>210 A je Außenleiter</b> (Kettenzüge während der Show spannungsfrei; mit Kettenzügen ≈ 242 A).<br>Modell 2: I = 175 000 VA / (√3 × 400 V) ≈ 252,6 A → reicht (ca. 17 % Reserve). Modell 1: ≈ 433 A → viel Reserve, aber teurer/schwerer.<br>→ <b>Modell 2 (175 kVA)</b>: deckt 210 A je Außenleiter mit ca. 17 % Reserve, ist leichter, braucht weniger Kraftstoff und ist günstiger. (Modell 1 wäre stark überdimensioniert und liefe im ungünstigen Teillastbereich.)` },
    { u: "U2", p: 10, own: true, q: `Der Generator dient nur als Übergabepunkt (nur Überstromschutz, geerdet, PA-Schiene). Nennen Sie fünf elektrotechnische Schutzmaßnahmen (Personenschutz) mit konkreten Angaben.`,
      sol: `– Zusatzschutz: RCD I<sub>ΔN</sub> ≤ 30 mA für alle Endstromkreise (in der eigenen UV)<br>– Schutz durch automatische Abschaltung: passende MCB, Schleifenimpedanz/I<sub>k</sub> prüfen<br>– Schutzpotenzialausgleich: Ground-Support, Bühne, LED-Wände mit 16 mm² Cu an die PA-Schiene des Generators<br>– Betriebsmittel für außen geeignet (mind. IP44), Leitungen H07RN-F<br>– Nur geprüfte Betriebsmittel; Errichterprüfung vor Inbetriebnahme<br>– Verteiler gegen Unbefugte sichern (abschließen, absperren)` },
    { u: "U3", p: 10, own: true, q: `1. Nennen Sie zwei Kriterien für eine Strom-/Leistungsverteilung.<br>2. Verteilen Sie die Lichttechnik der Showbühne (4 × Stufen 4,4 A, 4 × Stagebar 0,2 A, Pult 5 A, 60 × Pixelarray 2,5 A) auf L1–L3 und bestimmen Sie den Anschluss.`,
      sol: `<b>1.</b> Möglichst symmetrische Verteilung · Strombelastbarkeit von Leitungen/Steckern/Schutzorganen · Gewerke trennen (Ton eigene Phase) · Reserve · Gleichzeitigkeit.<br><b>2.</b> z. B. L1: 20 Pixel (50 A) + 2 Stufen (8,8 A) = 58,8 A · L2: 20 Pixel + 1 Stufe + Pult = 59,4 A · L3: 20 Pixel + 1 Stufe + 4 Stagebars = 55,2 A (Summe 173,4 A).<br>→ max. ≈ 59,4 A je Außenleiter → <b>CEE 63A/400V</b>.` },
    { u: "U4", p: 10, own: true, q: `Der Ground-Support ist mit einer 40 m langen Potenzialausgleichsleitung an die PA-Schiene des Generators angeschlossen.<br>1. Benötigter Querschnitt?<br>2. Berechnen Sie den Leiterwiderstand.<br>3. Gemessen: R = 0,08 Ω. Beurteilen Sie.`,
      sol: `<b>1.</b> A = <b>16 mm²</b> Cu.<br><b>2.</b> R = l / (κ × A) = 40 m / (56 m/(Ω·mm²) × 16 mm²) = <b>0,045 Ω</b><br><b>3.</b> Messwert größer als berechnet → Übergangswiderstände der Verbindungsstellen und Messleitungen. Er liegt unter dem Richtwert (z. B. 0,1 Ω; nach DGUV-I 203-072 bis 1 Ω) → <b>zulässig</b>.` },
    { u: "U5", p: 10, own: true, q: `Errichterprüfung nach SQP4.<br>1. Fünf Kriterien der Besichtigung.<br>2. Beurteilen Sie das Protokoll (Plugbox 1, 6 Stromkreise, Multicore 12 × 2,5 mm², RCBO C10, I<sub>ΔN</sub> 30 mA):<br>SK1: I<sub>k</sub> 400 A, R<sub>iso</sub> > 1 GΩ, I<sub>mess</sub> 24 mA · SK2: 390 A, > 1 GΩ, 22 mA · SK3: 410 A, > 1 GΩ, 11 mA · SK4: 90 A, > 1 GΩ, 26 mA · SK5: 405 A, > 1 GΩ, 45 mA · SK6: 120 A, 10 MΩ, 25 mA`,
      sol: `<b>1.</b> siehe Besichtigungspunkte (Beschädigungen, Plaketten, IP, Rettungswege, Stolpergefahr, Kennzeichnung, PA, Schutzorgane …).<br><b>2.</b> Grenzwerte: C10 → I<sub>k</sub> ≥ 10 × 10 A = <b>100 A</b> · R<sub>iso</sub> ≥ <b>1 MΩ</b> · Auslösestrom zwischen <b>15 und 30 mA</b> (0,5…1 × I<sub>ΔN</sub>).<br>– SK4: I<sub>k</sub> = 90 A &lt; 100 A → <b>Mangel</b> (Abschaltung nicht sicher)<br>– SK3: 11 mA &lt; 15 mA → RCBO löst zu früh aus → <b>Mangel</b><br>– SK5: 45 mA &gt; 30 mA → <b>Mangel</b> (kein ausreichender Personenschutz)<br>– SK6: 10 MΩ ≥ 1 MΩ → i. O. (auffällig niedriger als die anderen, beobachten)<br>– SK1, SK2 i. O.` }
  ]
},
{
  id: "S2022", term: "Sommer 2022", title: "Baumaschinenmesse mit LED-Wand im Außenbereich", lv: "eigen", max: 60,
  scen: `Messestand mit Gesprächsrunden; Übertragung von Bild und Ton ins Außengelände. Außen: LED-Wand 19 × 10 = 190 Panels. Anschlüsse der Messe: CEE 16/32/63/125A jeweils 400V/3L+N+PE oder 230V/L+N+PE.<br>Panel-Datenblatt: 500 × 500 mm · Leistung avg. 60 W / max. 180 W · 9 kg · True1 PowerCon · Ethercon · IP65 front / IP54 rear.`,
  tasks: [
    { u: "U1", p: 10, own: true, q: `1. Berechnen Sie den Strombedarf I der Videowand.<br>2. Ermitteln Sie den benötigten Anschluss.`,
      sol: `<b>1.</b> P = 190 × 180 W = 34 200 W (Maximalwert – immer mit max. rechnen!)<br>I = P / (√3 × 400 V) = 34 200 / 692,8 = <b>49,4 A je Außenleiter</b> (cos φ ≈ 1 angenommen)<br><b>2.</b> → <b>CEE 63A/400V/3L+N+PE</b>` },
    { u: "U2", p: 10, own: true, q: `1. Erläutern Sie die IP-Schutzcodes aus dem Datenblatt.<br>2. Sind die Panels für den Außeneinsatz geeignet?`,
      sol: `<b>1.</b> IP65 (Front): 6 = staubdicht, 5 = Schutz gegen Strahlwasser aus beliebigem Winkel · IP54 (Rückseite): 5 = staubgeschützt, 4 = Schutz gegen Spritzwasser von allen Seiten.<br><b>2.</b> Ja – beide ≥ IP44, also für Regen geeignet. Die Rückseite verträgt aber kein Strahlwasser.` },
    { u: "U3", p: 10, own: true, q: `Die Übergabepunkte (CEE und Einzeladeranschlüsse/Powerlock) werden von Ihnen in Betrieb genommen.<br>1. Zwei Punkte, die Sie bei der Inbetriebnahme beachten.<br>2. Zwei Tätigkeiten zur Prüfung/Inbetriebnahme der Drehstrom-ÜP, die ohne RCD bestellt wurden.`,
      sol: `<b>1.</b> Stecken nur im lastfreien Zustand · bei Einzeladern Reihenfolge: zuerst PE, dann N, dann L1–L3 (Trennen umgekehrt) · nur durch EFK/EuP · Freigabe/Übergabe durch Betreiber.<br><b>2.</b> Messungen am ÜP: Spannungen L–N, L–L, L–PE, N–PE, Drehfeld · Netzimpedanz/I<sub>k</sub> bezogen auf das Schutzorgan · Zusatzschutz durch eigene RCD 30 mA in der UV sicherstellen und deren Auslösung prüfen.` },
    { u: "U4", p: 10, own: true, q: `Die 190 Panels werden über vier Multicores mit je sechs Stromkreisen versorgt. Prüfprotokoll eines Panels (SK I): Schutzleiterwiderstand 0,12 Ω (≤ 0,3 Ω) · Differenzstrom 1,2 mA (≤ 3,5 mA).<br>Modell 1: IN CEE63, 4 × 19-Pin, 24 × RCBO 16A C 2P 30mA · Modell 2: IN CEE63, 24 × MCB 16A C 1P, 4 × RCD 40A 30mA 4P.<br>1. Wählen Sie das geeignete Modell. 2. Begründen Sie.`,
      sol: `<b>1.</b> <b>Modell 1</b>.<br><b>2.</b> 190 Panels / 24 Kreise ≈ 8 Panels je Kreis → 8 × 1,2 mA ≈ 9,6 mA je RCBO (&lt; 15 mA) → sicher.<br>Modell 2: eine RCD je Multicore (6 Kreise ≈ 48 Panels) → ≈ 57 mA Ableitstrom &gt; 30 mA → RCD löst aus. Außerdem: RCBO = Selektivität, ein Fehler schaltet nur einen Kreis ab.<br>(Die Panels selbst sind i. O.: 0,12 Ω ≤ 0,3 Ω; 1,2 mA ≤ 3,5 mA.)` },
    { u: "U5", p: 10, own: true, q: `Potenzialausgleich im Außenbereich Videowand.<br>1. Wo können Sie an die Haupterdungsschiene anschließen (zwei Möglichkeiten)?<br>2. Leiterquerschnitt?<br>3. Vier Anforderungen.<br>4. Vorgehen bei der Messung der Durchgängigkeit/Niederohmigkeit.`,
      sol: `<b>1.</b> An der Haupterdungs-/Potenzialausgleichsschiene des Gebäudes bzw. am Erdungsanschluss des Übergabepunkts · an der PE-Schiene/Erdungsschraube der eigenen Unterverteilung.<br><b>2.</b> <b>16 mm²</b> Cu.<br><b>3.</b> H07RN-F · grün-gelb · einpolige Steckverbinder mit Verriegelung gegen Öffnen ohne Werkzeug · Kupfer · alle leitfähigen Teile (sternförmig) anschließen.<br><b>4.</b> Messgerät nach DIN VDE 0413, Messleitungen kompensieren (Nullabgleich), Prüfstrom ≥ 200 mA, zwischen PA-Schiene und jedem angeschlossenen Teil messen, Werte mit Richtwert vergleichen und dokumentieren.` },
    { u: "U6", p: 10, own: true, q: `An einer Plugbox sollen die Schutzmaßnahmen (Personenschutz) überprüft werden. Nennen Sie vier mögliche Messungen.`,
      sol: `Isolationswiderstand · Durchgängigkeit/Widerstand des Schutzleiters · Schleifenimpedanz bzw. Kurzschlussstrom I<sub>k</sub> · RCD-Auslösestrom · RCD-Auslösezeit · Spannung/Drehfeld (vgl. IHK-Lösung Sommer 2021 U7).` }
  ]
},
{
  id: "W2022", term: "Winter 2022/23", title: "Gemeinderatssitzung in der Mehrzweckhalle", lv: "eigen", max: 50,
  scen: `Mehrzweckhalle 45 m × 27 m, Konferenztechnik, Präsentation eines Feuerwehrfahrzeugs. Catering vor der Halle über einen <b>ungeerdeten Stromerzeuger</b>: Doppelfritteuse 2 × 1,6 kW (2 × Schuko) · Kombidämpfer 3,4 kW (CEE16 400V) · 6 × RGB-LED-Fluter 150 W (Schuko, SK I, IP65).<br>Stromerzeuger Typ I: max. 6,6 kVA/5,3 kW, Dauer 6,0 kVA/4,8 kW, IP54, 2 × Schuko, 1 × CEE16, 3 × C16A · Typ II: max. 11 kVA/8,8 kW, Dauer 10 kVA/8,0 kW, IP54, 2 × Schuko, 2 × CEE16, 3 × C16A.`,
  tasks: [
    { u: "U1", p: 10, own: true, q: `Ermitteln Sie den Leistungsbedarf und wählen Sie den geeigneten Stromerzeuger.`,
      sol: `P = 2 × 1,6 kW + 3,4 kW + 6 × 0,15 kW = <b>7,5 kW</b><br>Typ I: Dauerleistung 4,8 kW &lt; 7,5 kW → zu klein · Typ II: Dauerleistung 8,0 kW ≥ 7,5 kW → <b>Typ II</b> (bei Dauerbetrieb immer die Dauerleistung ansetzen, nicht die Maximalleistung).` },
    { u: "U2", p: 10, own: true, q: `Der Stromerzeuger wird im Freien aufgestellt. Ist der Einsatz ohne weitere Maßnahmen möglich?`,
      sol: `IP54 = staubgeschützt + Spritzwasser → für den Außeneinsatz grundsätzlich geeignet.<br>Aber: Der Erzeuger ist ungeerdet und hat <b>keine RCD</b>. Nach DGUV-I 203-032 braucht bei mehreren Verbrauchsmitteln jedes Verbrauchsmittel bis auf eines eine RCD ≤ 30 mA → <b>nicht ohne weitere Maßnahmen</b>. Außerdem: standsicher, Abgase/Abstand, Absperrung gegen Unbefugte.` },
    { u: "U3", p: 10, own: true, q: `Laut DGUV-I 203-032 (Blatt 3): RCD 30 mA für das zweite und jedes weitere Verbrauchsmittel – im Erzeuger oder in Verteilern mit je einer RCD pro Steckdose.<br>UV1: 6 × Schuko, 1 × RCD 40A/30mA/4P, 6 × MCB C16 · UV2: 6 × Schuko, 6 × RCBO C16/30mA · UV3: 6 × Schuko ohne Schutz · UV4: 1 × CEE16 mit RCD 40A/30mA, 3 × Schuko mit je RCD 25A/30mA.<br>1. Welche UV sind geeignet (Begründung)?<br>2. Ergänzen Sie das Blockschaltbild.`,
      sol: `<b>1.</b> UV1: <b>nein</b> – eine RCD für alle Steckdosen. UV2: <b>ja</b> – eine RCBO je Steckdose. UV3: <b>nein</b> – keine RCD. UV4: <b>ja</b> – jeder Abgang hat eine eigene RCD.<br><b>2.</b> Erzeuger CEE16 (1) → UV4: CEE16 → Kombidämpfer, Schuko → 2 × Fritteuse + 1 LED-Fluter · Erzeuger CEE16 (2) → UV2: 5 LED-Fluter (1 Steckdose Reserve).` },
    { u: "U4", p: 10, own: true, q: `Eine RCD löst bei Inbetriebnahme aus, Verursacher ist ein Scheinwerfer. Beim Öffnen sieht man eine abisolierte Ader am Gehäuse.<br>1. Vorgehen beim Öffnen (Sicherheit)?<br>2. Fehlerart?<br>3. Weiteres Vorgehen?<br>4. Gerät mit Schutzleiterzeichen (SK I): Messungen nach der Reparatur und Grenzwerte?`,
      sol: `<b>1.</b> Vom Netz trennen (Stecker ziehen), gegen Wiedereinstecken sichern, Spannungsfreiheit feststellen, Kondensatoren entladen lassen; nur durch EFK.<br><b>2.</b> Isolationsfehler → <b>Körperschluss</b> (blanke Ader berührt das Gehäuse).<br><b>3.</b> Gerät kennzeichnen und aussondern, Reparatur durch EFK (Ader neu isolieren/ersetzen, Zugentlastung), Prüfung nach DIN EN 50678 (VDE 0701), dokumentieren.<br><b>4.</b> Schutzleiterwiderstand ≤ 0,3 Ω (bis 5 m, + 0,1 Ω je 7,5 m, max. 1 Ω) · Isolationswiderstand ≥ 1 MΩ · Schutzleiterstrom ≤ 3,5 mA.` },
    { u: "U5", p: 10, own: true, q: `12 LED-Scheinwerfer (je 92 W, einzeln mit C10 abgesichert) hängen an 2 × HAN16 Multicore (6L+6N+PE, 30 m, 2,5 mm²). Hallentemperatur 25 °C, Abstand der Multicores = Durchmesser d.<br>Tabellen: I<sub>r</sub>(2,5 mm²) = 26 A · Temperatur (60 °C-Leitung) bei 25 °C: 1,08 · einlagig mit Abstand d, 2 Leitungen: 0,94 · vieladrig: 10 Adern 0,55 / 14 Adern 0,50.<br>1. Korrekturfaktoren 2. I<sub>B</sub> 3. I<sub>N</sub> 4. I<sub>Z</sub> 5. Beurteilung`,
      sol: `<b>1.</b> f1 = 1,08 · f2 = 0,94 · f3 (12 belastete Adern, interpoliert) = 0,525 (ohne Interpolation 0,50)<br><b>2.</b> I<sub>B</sub> = 92 W / 230 V = <b>0,4 A</b> je Stromkreis<br><b>3.</b> I<sub>N</sub> = <b>10 A</b><br><b>4.</b> I<sub>Z</sub> = 26 A × 1,08 × 0,94 × 0,525 ≈ <b>13,86 A</b><br><b>5.</b> I<sub>B</sub> 0,4 A ≤ I<sub>N</sub> 10 A ≤ I<sub>Z</sub> 13,86 A → <b>richtig dimensioniert</b>. (Vorgehen wie in der IHK-Lösung Sommer 2024 U3.)` }
  ]
},
{
  id: "S2024", term: "Sommer 2024", title: "Modenschau im historischen Saal", lv: "offiziell", max: 60,
  scen: `Modenschau in einem historischen Saal. Unterlagen: Tabellenwerk, Blockschaltbild, 2D-Draufsicht. Laufsteg-Beleuchtung: 12 × LED-Stufenlinse (230 V, cos φ 0,9, 510 W) · 7 × LED-ML-Profiler (230 V, cos φ 0,99, 6 A) · 12 × LED-Rampe (230 V, 230 VA).`,
  tasks: [
    { u: "U1", p: 10, q: `1. Berechnen Sie den Strombedarf der Scheinwerfer.<br>2. Erstellen Sie eine symmetrische Stromverteilung.`,
      sol: `<b>1.</b> Stufenlinse: I = 510 W / (230 V × 0,9) = 2,46 A × 12 = 29,52 A · Profiler: 6 A × 7 = 42 A · Rampe: 230 VA / 230 V = 1 A × 12 = 12 A → <b>Stromsumme 83,52 A</b><br><b>2.</b> Stufenlinsen je 4 pro Phase: 9,84 / 9,84 / 9,84 A · Profiler 2/2/3: 12 / 12 / 18 A · Rampen 6/6/0: 6 / 6 / – → <b>L1 = L2 = L3 = 27,84 A</b>` },
    { u: "U2", p: 10, q: `An Plugbox 4 tritt ein Kurzschluss auf, I<sub>K</sub> = 300 A. Schutz: RCBO C10 A/30 mA (UV3) und LS B32 A/3P (UV1).<br>1. Welche Schutzorgane könnten auslösen?<br>2. Beurteilen Sie die Selektivität.<br>3. Welche Maßnahme in UV1 stellt Selektivität her?`,
      sol: `<b>1.</b> RCBO C10: I<sub>K</sub> = 300 A > 10 × 10 A = 100 A → löst aus · LS B32: 300 A > 5 × 32 A = 160 A → löst ebenfalls aus.<br><b>2.</b> Keine Selektivität – es ist nicht sicher, ob RCBO C10 oder LS B32 zuerst auslöst.<br><b>3.</b> In UV1 LS-Schalter Typ <b>C32</b> statt B32 (10 × 32 A = 320 A > 300 A) oder ein zeitverzögertes MCB.` },
    { u: "U3", p: 10, q: `Vier HAN16-Multicores (12 belastete Adern, 2,5 mm², 20 m) versorgen Plugbox 1–4 und sind als Bündel an der Traverse verlegt. Alle Scheinwerfer einzeln über RCBO C10/30mA. T<sub>U</sub> = 25 °C, Leitungstemperatur 60 °C, I<sub>B</sub> = 6 A, I<sub>N</sub> = 10 A.<br>1. Umrechnungsfaktoren 2. Strombelastbarkeit I<sub>Z</sub> 3. Betriebssicherheit 4. Maßnahme bei gleichem Querschnitt`,
      sol: `<b>1.</b> T<sub>U</sub> 25 °C: f1 = 1,08 · Bündel aus 4 Leitungen: f2 = 0,65 · 12 Adern: f3 = 0,525 (0,5 ohne Interpolation)<br><b>2.</b> I<sub>Z</sub> = 26 A × 1,08 × 0,65 × 0,525 = <b>9,58 A</b><br><b>3.</b> I<sub>B</sub> ≤ I<sub>N</sub> ≤ I<sub>Z</sub>: 6 A &lt; 10 A &gt; 9,58 A → <b>nicht betriebssicher</b><br><b>4.</b> Leitungen nicht bündeln, sondern nebeneinander verlegen: f2 = 0,75 → I<sub>Z</sub> ≈ 11 A > I<sub>N</sub>` },
    { u: "U4", p: 10, q: `Berechnen und beurteilen Sie den Spannungsfall vom Übergabepunkt bis zur Plugbox (mit den Bemessungsströmen der LS): CEE63 20 m 16 mm² (63 A, Drehstrom) · CEE32 4 m 6 mm² (32 A, Drehstrom) · HAN16 20 m 2,5 mm² (10 A, Wechselstrom).`,
      sol: `ΔU<sub>CEE63</sub> = √3 × 20 m × 63 A / (56 × 16) = 2,44 V → 2,44/400 = <b>0,61 %</b><br>ΔU<sub>CEE32</sub> = √3 × 4 m × 32 A / (56 × 6) = 0,66 V → <b>0,165 %</b><br>ΔU<sub>HAN16</sub> = 2 × 20 m × 10 A / (56 × 2,5) = 2,86 V → 2,86/230 = <b>1,24 %</b><br>Gesamt = 0,61 + 0,165 + 1,24 = <b>2,015 % &lt; 3 % → in Ordnung</b>` },
    { u: "U5", p: 10, q: `Potenzialausgleich: Variante A = sternförmig über einen Potenzialverteiler; Variante B = Reihe (1 → 2 → 3 → 4).<br>1. Welche Variante ist sicherer?<br>2. Benennen Sie die Bauteile 1–4.`,
      sol: `<b>1.</b> <b>Variante A</b> (sternförmig): Bei einer unterbrochenen Leitung ist nur eine Konstruktion nicht mehr geerdet. Bei B verlieren alle folgenden Teile den PA.<br><b>2.</b> 1: Traverse 1/2/3 · 2: Traverse 4 · 3: Traverse 5 · 4: Laufsteg.` },
    { u: "U6", p: 10, q: `Gemessen: R<sub>PE</sub> = 0,07 Ω für eine 20 m lange PA-Leitung.<br>1. Drei Kriterien der PA-Leitung 2. Berechnen Sie R<sub>PE</sub> 3. Warum weicht die Messung ab? 4. Ist der PA zulässig?`,
      sol: `<b>1.</b> A = 16 mm² · H07RN-F · grün-gelb · Kupfer<br><b>2.</b> R<sub>PE</sub> = 20 m / (56 × 16 mm²) = <b>0,022 Ω</b><br><b>3.</b> Widerstand der Verbindungsstellen (Übergangswiderstände) – der Messwert ist immer etwas größer.<br><b>4.</b> Zulässig, Richtwert z. B. 0,1 Ω wird nicht überschritten – oder U<sub>B</sub> = 0,07 Ω × 30 mA = 0,0021 V &lt; 50 V AC. (Richtwerte: DGUV-I 203-072 bis 1,0 Ω; IGVW SQP4)` }
  ]
},
{
  id: "W2024", term: "Winter 2024/25", title: "Erntedankfest in der Scheune", lv: "eigen", max: 60,
  scen: `Erntedankfest: Bühne in der Scheune, Biergarten auf der Freifläche. Speisepunkt CEE 16A/400V/5P mit MCB C16. Verteiler UV 3 × 32A/400V: Eingang CEE32, RCD 63A/0,03A; 6 × Schuko mit MCB C16: #3 L1, #4 L2, #5 L3, #6 L1, #7 L2, #8 L3; 2 × HAN16 (#MC1, #MC2) mit 12 × RCBO C10/30mA.<br>Variante 1: Plug-Box 1 (PowerCon) an #5, Plug-Box 2 an #8, je über Schuko→PowerCon. Variante 2: Plug-Boxen über HAN16 an #MC1/#MC2.<br>Scheinwerfer: 4 × MH-Spot 850 W, PF 0,98, IP65 · 4 × MH-Wash 750 W, PF 0,99, IP65 · 4 × Stufenlinse 600 W, PF 0,978, IP20 (alle 230 V).`,
  tasks: [
    { u: "U1", p: 10, own: true, q: `1. Kann der Strombedarf durch den Speisepunkt (CEE16, C16) gedeckt werden?<br>2. Beurteilen Sie den Einfluss des Leistungsfaktors.`,
      sol: `<b>1.</b> I = P / (U × cos φ): Spot 850 / (230 × 0,98) = 3,77 A × 4 = 15,08 A · Wash 750 / (230 × 0,99) = 3,29 A × 4 = 13,18 A · Stufenlinse 600 / (230 × 0,978) = 2,67 A × 4 = 10,67 A → <b>Σ 38,93 A</b><br>Symmetrisch: 38,93 / 3 ≈ <b>12,98 A je Außenleiter &lt; 16 A</b> → gedeckt (nur bei symmetrischer Verteilung!).<br><b>2.</b> cos φ &lt; 1 → Scheinleistung > Wirkleistung → höherer Strom (Blindstromanteil) belastet Leitungen und Schutzorgane. Hier nahe 1 → nur ca. 1–2 % mehr Strom.` },
    { u: "U2", p: 10, own: true, q: `Die Bühne wird vom Speisepunkt CEE16 über den Verteiler UV (Eingang CEE32) versorgt.<br>1. Wie muss der Anschluss am Speisepunkt ausgeführt werden?<br>2. Variante 1: Überlast an den belegten Ausgängen und am Speisepunkt?`,
      sol: `<b>1.</b> Aufwärtsadaptierung CEE16-Stecker auf CEE32-Kupplung (Adapter) – zulässig, da der C16 am Speisepunkt die Leitung schützt (vgl. IHK-Lösung S2021 U5).<br><b>2.</b> Je 6 Scheinwerfer an #5 und #8 → ≈ 19,5 A je Ausgang &gt; 16 A (C16, Schuko max. 16 A) → <b>Überlast an beiden Ausgängen</b>. #5 und #8 liegen beide auf <b>L3</b> → 38,9 A auf L3 &gt; 16 A → <b>Überlast am Speisepunkt</b>.` },
    { u: "U3", p: 10, own: true, q: `An #5 und #8 fließt jeweils I<sub>B</sub> = 24 A (MCB C16).<br>1. Markieren Sie im Kennlinienfeld die Auslösezeit und geben Sie sie an.<br>2. Beurteilen Sie die Betriebssicherheit mit Gleichzeitigkeitsfaktor 0,65.`,
      sol: `<b>1.</b> 24 A / 16 A = <b>1,5 × I<sub>N</sub></b> → thermischer Bereich (Überlast). Im Kennlinienfeld liegt das C-Band bei 1,5 × I<sub>N</sub> etwa zwischen <b>1 und 10 Minuten</b> – der MCB löst nach einigen Minuten aus. Grundsatz: Ab 1,45 × I<sub>N</sub> löst ein LS innerhalb von 1 h sicher aus.<br><b>2.</b> 24 A × 0,65 = <b>15,6 A &lt; 16 A</b> → der MCB löst nicht aus, aber ohne Reserve → Betriebssicherheit nur knapp gegeben; besser Variante 2.` },
    { u: "U4", p: 10, own: true, q: `Es wird Variante 2 gewählt.<br>1. Welchen Vorteil bietet sie für die Produktionssicherheit?<br>2. Zwei Funktionen einer RCBO?`,
      sol: `<b>1.</b> Jeder Scheinwerfer hat einen eigenen Stromkreis mit RCBO C10/30mA → ein Fehler schaltet nur diesen Scheinwerfer ab (Selektivität); Last wird auf L1–L3 verteilt, keine Überlast; ein Ausfall stoppt nicht die ganze Show.<br><b>2.</b> Überstromschutz (Überlast + Kurzschluss, wie MCB) und Fehlerstromschutz (wie RCD 30 mA, Personenschutz).` },
    { u: "U5", p: 10, own: true, q: `Besichtigung nach VDE 0100-600: Geben Sie je zwei Kriterien für Mängelfreiheit an: Leitungen · Leitungsverlegung · Unterverteilung · Potenzialausgleich · Steckverbindungen.`,
      sol: `<b>Leitungen</b>: Mantel unbeschädigt, keine Quetschungen · richtiger Typ (H07RN-F) und Querschnitt, Prüfplakette.<br><b>Verlegung</b>: stolperfrei/abgedeckt, Rettungswege frei · keine Zugbelastung, Trommeln abgerollt.<br><b>UV</b>: Gehäuse unbeschädigt und verschlossen · Schutzorgane richtig bemessen, Stromkreise gekennzeichnet, IP passend.<br><b>PA</b>: alle Traversen angeschlossen · 16 mm², grün-gelb, sichere Verbindung.<br><b>Steckverbindungen</b>: unbeschädigt, vollständig gesteckt/verriegelt · IP für außen (Biergarten), keine Überlastspuren.` },
    { u: "U6", p: 10, own: true, q: `1. Messgenauigkeit ±0,1 × I<sub>ΔN</sub>. Gemessener Auslösestrom an Plug-Box 1: I<sub>a</sub> = 29,4 mA. Beurteilen Sie.<br>2. Der Speisepunkt ist durch eine RCD „FI-D 40-4-03-S/B“ geschützt: I<sub>N</sub> 40 A, I<sub>ΔN</sub> = 0,3 A, Typ B, S. Zulässig für Personenschutz?`,
      sol: `<b>1.</b> ±0,1 × 30 mA = ±3 mA → tatsächlicher Wert 26,4 … 32,4 mA. Der obere Wert liegt über 30 mA → Weil der Auslösestrom auch über 30 mA liegen kann, ist der Personenschutz <b>nicht sicher nachgewiesen</b>. Bewertung: Mangel – Messung wiederholen, bei gleichem Ergebnis RCD tauschen.<br><b>2.</b> <b>Nein</b>: I<sub>ΔN</sub> = 300 mA. Für Personenschutz/Zusatzschutz ist ≤ 30 mA nötig. Eine 300-mA-S-RCD dient dem Brandschutz bzw. als selektive Vorschaltung.` }
  ]
},
{
  id: "S2025", term: "Sommer 2025", title: "Gala-Beleuchtung mit 30 LED-Washlights", lv: "eigen", max: 50,
  scen: `Übergabepunkt CEE 32A/400V/230V/5P, MCB C32 3P. UV1: Eingang CEE 63A/400V; Ausgang 4 × HAN16 (L1,L2,L3,L1,L2,L3) mit 24 × RCBO C10/30mA; HAN GND Erdungssystem C-Pot; Erdungsschraube M8.<br>Washlight-Datenblatt: 100–240 V, max. 400 W · bei 230 V/50 Hz: 228 W, 1,1 A, PF 0,959 · Anlaufstrom (halber Zyklus) 10,7 A · Durchschleifen (MAINS OUT → IN) mit 1,5 mm²: max. 8 Geräte bei 200–240 V · Schuko max. 250 V/16 A.`,
  tasks: [
    { u: "U1", p: 10, own: true, q: `1. Strombedarf der 30 Washlights?<br>2. Deckt der Übergabepunkt den Bedarf?<br>3. Alle 30 werden über einen 3-poligen Hauptschalter gleichzeitig eingeschaltet. Einschaltstrom?<br>4. Löst der MCB C32 des Übergabepunkts aus?`,
      sol: `<b>1.</b> 30 × 1,1 A = <b>33 A</b> → symmetrisch <b>11 A je Außenleiter</b><br><b>2.</b> 11 A &lt; 32 A → gedeckt.<br><b>3.</b> 30 × 10,7 A = <b>321 A</b> → je Außenleiter 10 × 10,7 = <b>107 A</b><br><b>4.</b> C32 löst unverzögert bei 5–10 × I<sub>N</sub> = 160–320 A aus. 107 A ≈ 3,3 × I<sub>N</sub> → nur thermischer Bereich, und der Anlaufstrom dauert nur eine Halbperiode (10 ms) → <b>keine Auslösung</b>.` },
    { u: "U2", p: 10, own: true, q: `UV1 (Eingang CEE63) wird am Übergabepunkt CEE32 angeschlossen.<br>1. Wie wird die Adaptierung ausgeführt?<br>2. Maximale Anzahl verlinkter Scheinwerfer?`,
      sol: `<b>1.</b> Aufwärtsadaptierung: CEE32-Stecker → CEE63-Kupplung (5-polig, geprüfter Adapter). Zulässig, weil der Querschnitt größer wird und der C32 am Übergabepunkt den Schutz übernimmt.<br><b>2.</b> Laut Datenblatt dürfen bei 200–240 V <b>max. 8 Washlights</b> über MAINS OUT/IN verlinkt werden.<br>Prüfung am RCBO C10: 8 × 1,1 A = 8,8 A ≤ 10 A ✔ (Schuko 16 A ✔).<br>→ <b>8 Scheinwerfer je Stromkreis</b>, für 30 Washlights also 4 Stromkreise (z. B. 8 + 8 + 7 + 7).<br>Zusatz für U3: 8 × 10,7 A = 85,6 A Anlaufstrom liegt im magnetischen Bereich des C10 (50–100 A) – deshalb die Scheinwerfer nicht alle gleichzeitig einschalten, sondern gestaffelt.` },
    { u: "U3", p: 10, own: true, q: `Nennen Sie für die Planungsaspekte jeweils eine Bedingung und eine Begründung: 1 Leitungsverlegung · 2 Bemessungsströme RCBO · 3 Leitungsquerschnitt · 4 Einschaltstromstärke · 5 Steckdosenbelastung.`,
      sol: `<b>1</b> Stolperfrei, nicht durch Rettungswege, Zugentlastung an der Traverse → Unfallgefahr vermeiden.<br><b>2</b> I<sub>B</sub> ≤ I<sub>N</sub> ≤ I<sub>Z</sub> → Leitung vor Überlast schützen.<br><b>3</b> Netzleitungen mind. 1,5 mm² (Datenblatt), I<sub>Z</sub> mit Korrekturfaktoren ≥ I<sub>N</sub> → keine Überhitzung.<br><b>4</b> Summe der Anlaufströme je Kreis &lt; 5 × I<sub>N</sub> (C10: 50 A) → keine Fehlauslösung.<br><b>5</b> Schuko/PowerCon max. 16 A, Datenblatt max. 8 Geräte → keine Erwärmung/Brand der Kontakte.` },
    { u: "U4", p: 10, own: true, q: `Der Schutzpotenzialausgleich der Traversen wird über UV1 realisiert.<br>1. Welcher Erdungsanschluss kommt vorzugsweise infrage? Begründen Sie.<br>2. Vier Ausführungsmerkmale des Schutzpotenzialausgleichs.`,
      sol: `<b>1.</b> Das <b>HAN-GND-Erdungssystem (C-Pot)</b>: einpolige, verriegelte Steckverbindung – gegen Öffnen ohne Werkzeug gesichert, schnell zu stecken und zuverlässig. Die M8-Erdungsschraube ist nur die Alternative.<br><b>2.</b> 16 mm² · Kupfer · H07RN-F, grün-gelb · einpolige, verriegelte Steckverbinder · alle leitfähigen Teile anschließen · Errichterprüfung (Niederohmigkeit).` },
    { u: "U5", p: 10, own: true, q: `1. Fünf Punkte der Sichtprüfung.<br>2. Schleifenimpedanz an Plugbox 1, Stromkreise 1–6 (C10, Lim 100 A). SK1–2, 4–6: I<sub>k</sub> 455–480 A, R<sub>iso</sub> > 999 MΩ, I<sub>mess</sub> 24–25 mA. SK3: keine Messung möglich. Display bei SK3: L–PE 123 V, PE–N 115 V, L–N 235 V. Fehler und defektes Bauteil?`,
      sol: `<b>1.</b> Beschädigungen an Leitungen/Gehäusen/Steckern · Plaketten · IP · Rettungswege/Stolpergefahr · Kennzeichnung · PA · Schutzorgane.<br><b>2.</b> Normal: L–PE ≈ 230 V, N–PE ≈ 0 V. Hier liegen L–PE und N–PE je bei ungefähr der halben Spannung → der Schutzleiter „schwebt“ → <b>PE unterbrochen</b>. Da die anderen Kreise derselben Plugbox funktionieren, ist der <b>Schutzkontakt der Steckdose 3 an Plugbox 1</b> (bzw. dessen PE-Anschluss) defekt.` }
  ]
},
{
  id: "W2025", term: "Winter 2025/26", title: "Ärztekongress – Ausstellung mit 6 Messeständen", lv: "offiziell", max: 60,
  scen: `Hotel-Saal 25 m × 23 m mit sechs Messeständen. Bestückung je Stand: 16 × Scheinwerfer Typ 1 (0,2 A, Ableitstrom 0,6 mA) · 16 × Typ 2 (0,8 A, 0,6 mA) · 4 × Typ 3 (800 W, 3 mA), Powerlink In/Out. Übergabepunkte 1 und 2: je CEE 32A/5P; jede UV (Stand) über CEE32 versorgt, Ausgänge „durchgeschliffen ohne Schutzeinrichtung“.`,
  tasks: [
    { u: "U1", p: 10, q: `Die CEE32A-Ausgänge der UV sind mit „Durchschliff“ gekennzeichnet.<br>1. Was bedeutet das sicherheitstechnisch?<br>2. Ein Vorteil? 3. Ein Nachteil? 4. Wo sitzt der LS-Schalter dieser Ausgänge?`,
      sol: `<b>1.</b> Der Eingang der UV ist direkt ohne weitere Schutzmaßnahmen mit dem Ausgang verbunden – in der UV keine RCD und kein MCB für diesen Ausgang.<br><b>2.</b> Überflüssige LS-Schalter vermieden → Kostenersparnis · flexibler Aufbau durch weitere UV · hohe Auslastung der Übergabepunkte.<br><b>3.</b> Genaue Planung nötig · leicht Überlast möglich · Endgeräte dürfen dort nicht direkt betrieben werden (keine RCD).<br><b>4.</b> Die LS-Schalter des <b>Übergabepunkts</b>.` },
    { u: "U2", p: 10, q: `1. Berechnen Sie den gesamten Strombedarf der Stände.<br>2. Decken die Übergabepunkte 1 und 2 den Bedarf? Belegen Sie das durch eine Rechnung.`,
      sol: `<b>1.</b> Pro Stand: I = 16 × (0,2 A + 0,8 A) + 4 × (800 W / 230 V) = <b>29,9 A</b> · sechs Stände: 6 × 29,9 A = <b>179,4 A</b><br><b>2.</b> Je Übergabepunkt: 179,4 / 2 = 89,7 A → je Phase 89,7 / 3 = <b>29,9 A &lt; 32 A</b> → gedeckt. (Alternativ: sechs Wechselstromkreise mit 32 A für sechs Stände à 29,9 A.)` },
    { u: "U3", p: 10, q: `Erstellen Sie eine Leistungsverteilung für Übergabepunkt 1 (versorgt UV 1–3).`,

const LS_KEY = "energie-trainer-v1";
const emptyCustom = () => ({ questions: [], over: {}, hidden: {}, sol: {} });
function normalize(p) {
  p = p && typeof p === "object" ? p : {};
  return { stats: p.stats || {}, exams: p.exams || {}, custom: Object.assign(emptyCustom(), p.custom || {}), pomo: p.pomo || { day: "", n: 0 }, updated: p.updated || 0 };
}
let progress = normalize(null);
let db = null, docRef = null, saveState = "local";
function readLocal() { try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function writeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) { } }
{ const l = readLocal(); if (l) progress = normalize(l); }
const CU = () => progress.custom;

function rebuildQ() {
  Q.length = 0;
  BASE_Q.forEach(q => { if (CU().hidden[q.id]) return; const o = CU().over[q.id]; Q.push(o ? Object.assign({}, q, o, { edited: true }) : q); });
  (CU().questions || []).forEach(q => Q.push(Object.assign({}, q, { custom: true })));

rebuildQ();

let saveTimer = null, saving = false, pendingSave = false;
function scheduleSave() {
  progress.updated = Date.now(); writeLocal();
  if (!docRef) return;
  clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 600);
}
async function flushSave() {
  if (!docRef) return;
  if (saving) { pendingSave = true; return; }
  saving = true;
  try { await docRef.set(JSON.parse(JSON.stringify(progress))); saveState = "cloud"; }
  catch (e) { saveState = "local"; }

}
async function connectStore() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [dbNs, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!dbNs || !user) return;
    const uid = await user.id(); if (!uid) return;
    db = dbNs; docRef = db.collection("data/users/" + uid).doc("progress");
    const snap = await docRef.get();
    if (snap.exists) {
      const d = snap.data() || {};
      if ((d.updated || 0) > (progress.updated || 0)) { progress = normalize(d); writeLocal(); rebuildQ(); }
      else if ((progress.updated || 0) > (d.updated || 0)) { flushSave(); }
    } else if (Object.keys(progress.stats).length || progress.custom.questions.length) { flushSave(); }
    saveState = "cloud"; updateFailBadge(); updateSaveLabel();
    if (current.view !== "session" && current.view !== "exam") render();
  } catch (e) { /* bleibt lokal */ }
}
function updateSaveLabel() { document.querySelectorAll(".saveLabel").forEach(el => el.textContent = saveState === "cloud" ? "Fortschritt wird in deinem Konto gespeichert." : "Fortschritt wird in diesem Browser gespeichert."); }

function record(id, ok) {
  const s = progress.stats[id] || { c: 0, w: 0, s: 0 };
  if (ok) { s.c++; s.s = (s.s || 0) + 1; } else { s.w++; s.s = 0; }

}
const isFail = id => { const s = progress.stats[id]; return !!s && s.w > 0 && (s.s || 0) < 2; };
const failIds = () => Object.keys(progress.stats).filter(id => BY_ID[id] && isFail(id));
function updateFailBadge() { const n = failIds().length; const b = document.getElementById("failBadge"); if (!b) return; b.hidden = n === 0; b.textContent = n; }
function topicStats() {
  const out = {}; for (const k of Object.keys(TOPICS)) out[k] = { c: 0, w: 0, fails: 0, seen: 0 };
  for (const [id, s] of Object.entries(progress.stats)) { const q = BY_ID[id]; if (!q || !out[q.t]) continue; const o = out[q.t]; o.c += s.c; o.w += s.w; o.seen++; if (isFail(id)) o.fails++; }
  return out;
}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const norm = s => String(s).toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/φ/g, "phi").replace(/[\s\-_.()/,]/g, "");

function poolFor(types, topics) { return Q.filter(q => topics.has(String(q.t)) && (!types || types.includes(q.type))); }

function startSession(modeKey, opts = {}) {
  const mode = MODES.find(m => m.key === modeKey);

      items = shuffle(out);

function mountQuestion() {

    const inp = $("#ans"); setTimeout(() => inp.focus({ preventScroll: true }), 30);
    $("#ansForm").addEventListener("submit", e => {
      e.preventDefault(); if (session.answered) return; const v = inp.value.trim(); if (!v) return;
      let ok, sol;

  } else if (q.type === "match") {

    });
  }
}

function finish(ok, solHTML, silent) {
  if (session.answered) return; session.answered = true;
  const q = session.items[session.i];
  record(q.id, ok);
  session.results.push({ id: q.id, ok, t: q.t, type: q.type, q: q.q || q.text, sol: solHTML, ex: exHTML(q) });
  const last = session.i === session.items.length - 1;
  if (silent) { next(); return; }
  if (session.exam) { if (last) session.endAt = Date.now(); setTimeout(next, 250); return; }
  const fb = $("#fb");
  fb.innerHTML = `<div class="feedback ${ok ? "ok" : "bad"}" role="status"><span class="verdict">${ok ? "✓ Richtig" : "✗ Leider falsch"}</span>${solHTML ? `<span class="sol">${solHTML}</span>` : ""}<span class="ex">${exHTML(q)}</span></div><div class="row" style="justify-content:flex-end"><button class="btn primary" id="nextBtn">${last ? "Ergebnis" : "Weiter →"}</button></div>`;
