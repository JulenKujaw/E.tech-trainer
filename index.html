// ---------- Runde ----------
function sessionHTML() {
  const s = session; const n = s.items.length;
  if (s.i >= n) return resultHTML();
  const q = s.items[s.i];
  return `<div class="card" id="qcard">
    <div class="prog"><div class="meta"><span>${esc(s.title)}${s.exam ? ` · <span id="sessTimer">${mmss((Date.now() - s.start) / 1000)}</span>` : ""}</span><span>${s.i + 1} / ${n}</span></div><div class="bar"><div class="fill" style="width:${(s.i) / n * 100}%"></div></div></div>
    <div class="qtopic"><span class="pill type">${TYPE_LABEL[q.type]}</span><span class="pill">${q.t}. ${esc(TOPICS[q.t] || "")}</span>${q.custom ? `<span class="pill">eigene Frage</span>` : ""}</div>
    <div id="qbody"></div>
    <div id="fb"></div>
    <div class="row" style="justify-content:space-between"><button class="btn" data-act="quit">Beenden</button><span></span></div>
  </div>`;
}
function resultHTML() {
  const s = session; const ok = s.results.filter(r => r.ok).length; const n = s.results.length;
  const pct = n ? Math.round(ok / n * 100) : 0;
  const wrong = s.results.filter(r => !r.ok);
  const msg = pct >= 90 ? "Ausgezeichnet – das sitzt." : pct >= 70 ? "Gut. Wiederhole die Fehler, dann passt es." : pct >= 50 ? "Auf dem richtigen Weg, aber noch üben." : "Hier musst du noch lernen. Fang mit den Fehlern an.";
  const dur = s.exam ? ` · Zeit ${mmss((s.endAt || Date.now()) / 1000 - s.start / 1000)}` : "";
  return `<div class="card">
    <span class="eyebrow">Runde beendet · ${esc(s.title)}</span>
    <div class="result-score"><b>${ok}/${n}</b><span class="muted">${pct} % richtig${s.exam ? ` · Note ${noteFor(pct)}` : ""}${dur}</span></div>
    <p>${msg}</p>
    ${s.exam ? `<p class="muted" style="font-size:13px">IHK-Notenschlüssel: ab 92 % = 1 · 81 % = 2 · 67 % = 3 · 50 % = 4 · 30 % = 5</p>` : ""}
    ${wrong.length ? `<div class="section"><h3>Falsch in dieser Runde</h3><div class="list">${wrong.map(r => `<div class="li"><span class="t">${r.t}. ${esc(TOPICS[r.t] || "")} · ${TYPE_LABEL[r.type]}</span><span>${esc(r.q)}</span>${r.sol ? `<span class="sol" style="font-size:14px">${r.sol}</span>` : ""}${s.exam && r.ex ? `<span class="muted" style="font-size:13px">${r.ex}</span>` : ""}</div>`).join("")}</div></div>` : ""}
    <div class="row">${wrong.length ? `<button class="btn primary" data-act="repeat-round">Die ${wrong.length} falschen wiederholen</button>` : ""}<button class="btn" data-act="again">Neue Runde</button><button class="btn" data-act="go-home">Start</button></div>
  </div>`;
}

function mountQuestion() {
  if (!session || session.i >= session.items.length) return;
  const q = session.items[session.i]; const body = $("#qbody"); session.answered = false;
  if (q.type === "mc" || q.type === "tf") {
    const opts = q.type === "tf" ? q.opts : shuffle(q.opts);
    body.innerHTML = `<p class="question">${esc(q.q)}</p><div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${"ABCDEF"[i] || ""}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
    body.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if (session.answered) return; const val = opts[+b.dataset.i]; const ok = val === q.a;
      body.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (!session.exam && opts[+x.dataset.i] === q.a) x.classList.add("correct"); });
      if (!ok && !session.exam) b.classList.add("wrong");
      finish(ok, ok ? "" : `Richtig: <b>${esc(q.a)}</b>`);
    }));
  } else if (q.type === "gap") {
    const parts = q.text.split("___"); const opts = shuffle(q.opts);
    body.innerHTML = `<p class="gaptext">${esc(parts[0])}<span class="blank" id="blank">?</span>${esc(parts[1] || "")}</p><div class="chips">${opts.map((o, i) => `<button class="chip" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
    body.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      if (session.answered) return; const val = opts[+b.dataset.i]; const ok = val === q.a; const bl = $("#blank");
      bl.textContent = val; if (!session.exam) bl.classList.add(ok ? "ok" : "bad");
      body.querySelectorAll(".chip").forEach(x => x.disabled = true);
      finish(ok, ok ? "" : `Richtig: <b>${esc(q.a)}</b>`);
    }));
  } else if (q.type === "type" || q.type === "calc") {
    const isCalc = q.type === "calc";
    body.innerHTML = `<p class="question">${esc(q.q)}</p><form class="answer-row" id="ansForm" autocomplete="off"><input id="ans" ${isCalc ? 'inputmode="decimal" placeholder="Ergebnis"' : 'placeholder="Fachbegriff eintippen"'} aria-label="Antwort">${isCalc ? `<span class="unit">${esc(q.unit)}</span>` : ""}<button class="btn primary" type="submit">Prüfen</button></form>${isCalc ? `<p class="muted" style="font-size:13px">Komma oder Punkt. Toleranz ±2 %.</p>` : ""}`;
    const inp = $("#ans"); setTimeout(() => inp.focus({ preventScroll: true }), 30);
    $("#ansForm").addEventListener("submit", e => {
      e.preventDefault(); if (session.answered) return; const v = inp.value.trim(); if (!v) return;
      let ok, sol;
      if (isCalc) { const x = num(v); ok = x !== null && Math.abs(x - q.a) <= Math.max(Math.abs(q.a) * 0.02, 0.01); sol = `Ergebnis: <b>${de(q.a, q.a < 10 ? 3 : 1)} ${esc(q.unit)}</b>`; }
      else { ok = q.answers.some(a => norm(a) === norm(v)); sol = `Antwort: <b>${esc(q.answers[0])}</b>`; }
      inp.disabled = true; if (!session.exam) inp.style.borderColor = ok ? "var(--good)" : "var(--red)";
      finish(ok, ok && !isCalc ? "" : sol);
    });
  } else if (q.type === "match") {
    const left = q.pairs.map((p, i) => ({ i, txt: p[0] })); const right = shuffle(q.pairs.map((p, i) => ({ i, txt: p[1] })));
    const pairs = {}; let sel = null;
    body.innerHTML = `<p class="question">${esc(q.q)}</p><p class="muted" style="font-size:13px">Links einen Begriff antippen, dann rechts das Passende.</p><div class="match"><div class="col">${left.map(l => `<button class="mitem" data-l="${l.i}"><span class="tagn">${l.i + 1}</span><span>${esc(l.txt)}</span></button>`).join("")}</div><div class="col">${right.map(r => `<button class="mitem" data-r="${r.i}"><span class="tagn">·</span><span>${esc(r.txt)}</span></button>`).join("")}</div></div><div class="row"><button class="btn primary" id="mCheck" disabled>Prüfen</button><button class="btn" id="mReset">Zurücksetzen</button></div>`;
    const paint = () => {
      body.querySelectorAll("[data-l]").forEach(b => { const i = +b.dataset.l; b.classList.toggle("sel", sel === i); b.classList.toggle("paired", pairs[i] !== undefined); });
      body.querySelectorAll("[data-r]").forEach(b => { const r = +b.dataset.r; const owner = Object.keys(pairs).find(k => pairs[k] === r); b.classList.toggle("paired", owner !== undefined); b.querySelector(".tagn").textContent = owner !== undefined ? (+owner + 1) : "·"; });
      $("#mCheck").disabled = Object.keys(pairs).length !== q.pairs.length;
    };
    body.querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => { if (session.answered) return; sel = +b.dataset.l; paint(); }));
    body.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => {
      if (session.answered || sel === null) return; const r = +b.dataset.r;
      Object.keys(pairs).forEach(k => { if (pairs[k] === r) delete pairs[k]; });
      pairs[sel] = r; const nx = left.find(l => pairs[l.i] === undefined); sel = nx ? nx.i : null; paint();
    }));
    $("#mReset").addEventListener("click", () => { if (session.answered) return; Object.keys(pairs).forEach(k => delete pairs[k]); sel = null; paint(); });
    $("#mCheck").addEventListener("click", () => {
      if (session.answered) return; let all = true;
      body.querySelectorAll("[data-l]").forEach(b => { const i = +b.dataset.l; const ok = pairs[i] === i; if (!ok) all = false; b.classList.add(ok ? "ok" : "bad"); b.disabled = true; });
      body.querySelectorAll("[data-r]").forEach(b => { b.disabled = true; });
      $("#mCheck").disabled = true; $("#mReset").disabled = true;
      finish(all, all ? "" : `Richtige Paare:<br>${q.pairs.map(p => `${esc(p[0])} → <b>${esc(p[1])}</b>`).join("<br>")}`);
    });
    paint();
  } else if (q.type === "order") {
    const pool = shuffle(q.items.map((t, i) => ({ i, t }))); const chosen = [];
    const draw = () => {
      body.innerHTML = `<p class="question">${esc(q.q)}</p><p class="muted" style="font-size:13px">Schritte der Reihe nach antippen. Gewählten Schritt antippen, um ihn zu entfernen.</p><div class="order"><div class="slots" id="oSlots">${chosen.length ? chosen.map((c, k) => `<button class="oitem" data-c="${k}"><span class="n">${k + 1}</span><span>${esc(c.t)}</span></button>`).join("") : `<span class="ph">Deine Reihenfolge erscheint hier</span>`}</div><div class="opts">${pool.filter(p => !chosen.includes(p)).map(p => `<button class="oitem" data-p="${p.i}"><span class="n">+</span><span>${esc(p.t)}</span></button>`).join("")}</div></div><div class="row"><button class="btn primary" id="oCheck" ${chosen.length === q.items.length ? "" : "disabled"}>Prüfen</button></div>`;
      body.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => { chosen.push(pool.find(p => p.i === +b.dataset.p)); draw(); }));
      body.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => { chosen.splice(+b.dataset.c, 1); draw(); }));
      const ck = $("#oCheck"); if (ck) ck.addEventListener("click", () => {
        let all = true; body.querySelectorAll("#oSlots .oitem").forEach((b, k) => { const ok = chosen[k].i === k; if (!ok) all = false; b.classList.add(ok ? "ok" : "bad"); b.disabled = true; });
        ck.disabled = true; finish(all, all ? "" : `Richtige Reihenfolge:<br>${q.items.map((t, k) => `${k + 1}. ${esc(t)}`).join("<br>")}`);
      });
    };
    draw();
  } else if (q.type === "flash") {
    body.innerHTML = `<button class="flip" id="flipCard" aria-label="Karte umdrehen"><span class="flip-inner"><span class="face front"><span class="eyebrow">Frage · antippen zum Umdrehen</span><span class="question">${esc(q.q)}</span></span><span class="face back"><span class="eyebrow">Antwort</span><span class="backans">${esc(q.answers[0])}</span><span class="ex" style="font-size:14px">${exHTML(q)}</span></span></span></button><div class="row" id="flashBtns"><span class="muted" style="font-size:13px">Erst überlegen, dann umdrehen.</span></div>`;
    const card = $("#flipCard");
    card.addEventListener("click", () => {
      card.classList.toggle("flipped");
      if (!$("#fYes")) { $("#flashBtns").innerHTML = `<button class="btn" id="fNo">Nicht gewusst</button><button class="btn primary" id="fYes">Gewusst</button>`; $("#fYes").addEventListener("click", () => finish(true, "", true)); $("#fNo").addEventListener("click", () => finish(false, "", true)); }
    });
  }
}

function finish(ok, solHTML, silent) {
  if (session.answered) return; session.answered = true;
  const q = session.items[session.i];
  record(q.id, ok);
  session.results.push({ id: q.id, ok, t: q.t, type: q.type, q: q.q || q.text, sol: solHTML, ex: exHTML(q) });
  const last = session.i === session.items.length - 1;
  if (silent) { next(); return; }
  if (session.exam) { if (last) session.endAt = Date.now(); setTimeout(next, 250); return; }
  const fb = $("#fb");
  fb.innerHTML = `<div class="feedback ${ok ? "ok" : "bad"}" role="status"><span class="verdict">${ok ? "✓ Richtig" : "✗ Leider falsch"}</span>${solHTML ? `<span class="sol">${solHTML}</span>` : ""}<span class="ex">${exHTML(q)}</span></div><div class="row" style="justify-content:flex-end"><button class="btn primary" id="nextBtn">${last ? "Ergebnis" : "Weiter →"}</button></div>`;
  const nb = $("#nextBtn"); nb.addEventListener("click", next); nb.focus({ preventScroll: true });
  fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function next() { session.i++; render(); window.scrollTo({ top: 0 }); }
document.addEventListener("keydown", e => {
  if (current.view !== "session" || !session || !session.answered) return;
  if (e.key === "Enter" && document.getElementById("nextBtn") && document.activeElement && document.activeElement.id !== "ans") { e.preventDefault(); next(); }
});

const POMO_KEY = "etech-pomo";
const POMO_LEN = { work: 25 * 60, brk: 5 * 60 };
let pomo = { mode: "work", running: false, end: 0, left: POMO_LEN.work };
try { const s = JSON.parse(localStorage.getItem(POMO_KEY) || "null"); if (s && s.mode) pomo = s; } catch (e) { }
const todayStr = () => new Date().toISOString().slice(0, 10);
const pomoToday = () => progress.pomo && progress.pomo.day === todayStr() ? progress.pomo.n : 0;
const pomoLabel = () => pomo.mode === "work" ? (pomo.running ? "Lernzeit läuft" : "Lernzeit – bereit") : (pomo.running ? "Pause läuft" : "Pause – bereit");
function pomoSave() { try { localStorage.setItem(POMO_KEY, JSON.stringify(pomo)); } catch (e) { } }
function beep() {
  try { const C = window.AudioContext || window.webkitAudioContext; const ctx = new C(); [0, 0.35, 0.7].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(0.2, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3); }); } catch (e) { }
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { }
}
function pomoSwitch(auto) {
  if (pomo.mode === "work") {
    if (auto) { const d = todayStr(); if (!progress.pomo || progress.pomo.day !== d) progress.pomo = { day: d, n: 0 }; progress.pomo.n++; scheduleSave(); }
    pomo.mode = "brk"; pomo.left = POMO_LEN.brk; pomo.running = auto; pomo.end = Date.now() + pomo.left * 1000;
  } else { pomo.mode = "work"; pomo.left = POMO_LEN.work; pomo.running = false; }
  pomoSave(); pomoUI();
}
function pomoTick() {
  if (pomo.running) { pomo.left = Math.max(0, Math.round((pomo.end - Date.now()) / 1000)); if (pomo.left === 0) { beep(); pomoSwitch(true); return; } }
  pomoUI();
  if (current.view === "exam" && examRun && examRun.mode === "sim" && !examRun.done) { const el = $("#simTimer"); const r = Math.max(0, (examRun.end - Date.now()) / 1000); if (el) el.textContent = mmss(r); if (r <= 0) { examRun.done = true; beep(); render(); } }
  if (current.view === "session" && session && session.exam) { const el = $("#sessTimer"); if (el) el.textContent = mmss((Date.now() - session.start) / 1000); }
}
function pomoUI() {
  const pill = $("#pomoPill"); if (pill) { pill.textContent = `${pomo.mode === "work" ? "Lernen" : "Pause"} ${mmss(pomo.left)}`; pill.classList.toggle("run", pomo.running); pill.classList.toggle("brk", pomo.mode === "brk"); pill.setAttribute("aria-label", `Pomodoro ${pomoLabel()}, ${mmss(pomo.left)}. Antippen zum ${pomo.running ? "Pausieren" : "Starten"}`); }
  const big = $("#pomoBig"); if (big) big.textContent = mmss(pomo.left);
  const st = $("#pomoState"); if (st) st.textContent = pomoLabel();
  const btn = $("#pomoBtn"); if (btn) btn.textContent = pomo.running ? "Pause" : "Start";
  const cnt = $("#pomoCount"); if (cnt) cnt.textContent = pomoToday();
}
function pomoToggle() { if (pomo.running) { pomo.left = Math.max(0, Math.round((pomo.end - Date.now()) / 1000)); pomo.running = false; } else { pomo.end = Date.now() + pomo.left * 1000; pomo.running = true; } pomoSave(); pomoUI(); }
function pomoReset() { pomo = { mode: "work", running: false, end: 0, left: POMO_LEN.work }; pomoSave(); pomoUI(); }
$("#pomoPill").addEventListener("click", pomoToggle);
setInterval(pomoTick, 1000);

// ---------- Hell/Dunkel ----------
const THEME_KEY = "etech-theme";
function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
try { applyTheme(localStorage.getItem(THEME_KEY)); } catch (e) { }
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nt = cur === "dark" ? "light" : "dark"; applyTheme(nt); try { localStorage.setItem(THEME_KEY, nt); } catch (e) { }
});

// ---------- Ereignisse ----------
function bindView() {
  const v = $("#view");
  v.querySelectorAll("[data-topic].chip").forEach(b => b.addEventListener("click", () => { const k = b.dataset.topic; current.topics.has(k) ? current.topics.delete(k) : current.topics.add(k); render(); }));
  v.querySelectorAll("[data-mode].mode").forEach(b => b.addEventListener("click", () => startSession(b.dataset.mode)));
  const ls = $("#lenSel"); if (ls) ls.addEventListener("change", () => { current.len = +ls.value; });
  v.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => act(b.dataset.act, b)));
  v.querySelectorAll("textarea[data-ans]").forEach(t => t.addEventListener("input", () => { if (examRun) examRun.ans[t.dataset.ans] = t.value; }));
  const et = $("#edType"); if (et) et.addEventListener("change", () => { const d = readDraftFromForm(true); d.type = et.value; d.opts = (d.opts || []).slice(); while (d.opts.length < 4) d.opts.push(""); current.edit = d; render(); });
  const es = $("#edSearch"); if (es) es.addEventListener("input", () => { current.edFilter = es.value; clearTimeout(es._t); es._t = setTimeout(() => { render(); const n = $("#edSearch"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 300); });
  const etf = $("#edTopicFilter"); if (etf) etf.addEventListener("change", () => { current.edTopic = etf.value; render(); });
  const imp = $("#importFile"); if (imp) imp.addEventListener("change", () => { if (imp.files[0]) importData(imp.files[0]); });
}
function act(a, b) {
  if (a === "all-topics") { current.topics = new Set(Object.keys(TOPICS)); render(); }
  else if (a === "no-topics") { current.topics = new Set(); render(); }
  else if (a === "go-home") setView("home");
  else if (a === "go-exams") setView("exams");
  else if (a === "repeat-all") startSession("fails", { ids: shuffle(failIds()), title: "Fehler wiederholen" });
  else if (a === "repeat-topic") startSession("fails", { ids: shuffle(failIds().filter(id => String(BY_ID[id].t) === b.dataset.topic)), title: `Fehler · ${TOPICS[b.dataset.topic]}` });
  else if (a === "repeat-round") startSession("fails", { ids: session.results.filter(r => !r.ok).map(r => r.id), title: "Falsche wiederholen" });
  else if (a === "again") startSession(session.mode === "fails" || session.mode === "weak" ? "mix" : session.mode);
  else if (a === "quit") { if (session.results.length) { session.items = session.items.slice(0, session.results.length); session.i = session.items.length; session.endAt = Date.now(); render(); } else setView("home"); }
  else if (a === "practice-weak") { const w = weakTopics().slice(0, 3).map(o => o.k); const ids = shuffle(Q.filter(q => w.includes(String(q.t)))).slice(0, Math.max(current.len, 10)).map(q => q.id); startSession("weak", { ids, title: "Schwache Themen" }); }
  else if (a === "reset-ask") { $("#resetBox").innerHTML = `<span>Sicher? Alle Statistiken und Prüfungsergebnisse werden gelöscht (eigene Fragen bleiben).</span><button class="btn danger" data-act="reset-yes">Ja, löschen</button><button class="btn" data-act="reset-no">Abbrechen</button>`; bindView(); }
  else if (a === "reset-no") render();
  else if (a === "reset-yes") { progress.stats = {}; progress.exams = {}; progress.updated = Date.now(); writeLocal(); if (docRef) flushSave(); updateFailBadge(); render(); }
  // Pomodoro
  else if (a === "pomo-toggle") pomoToggle();
  else if (a === "pomo-reset") pomoReset();
  else if (a === "pomo-skip") { pomoSwitch(false); }
  // Prüfungen
  else if (a === "exam-open") openExam(b.dataset.exam, b.dataset.mode);
  else if (a === "exam-back") { if (examRun && examRun.mode === "sim" && !examRun.done && !confirm("Simulation läuft. Wirklich verlassen?")) return; setView("exams"); }
  else if (a === "exam-show") { examRun.shown[b.dataset.u] = true; rerenderKeep("task-" + b.dataset.u); }
  else if (a === "exam-rate") { examRun.rate[b.dataset.u] = +b.dataset.p; examRun.saved = false; rerenderKeep("task-" + b.dataset.u); }
  else if (a === "exam-submit") { if (confirm("Prüfung jetzt abgeben?")) { examRun.done = true; render(); } }
  else if (a === "exam-save") {
    const e = EXAM_BY_ID[examRun.id]; const max = e.tasks.reduce((s, t) => s + t.p, 0); const pts = e.tasks.reduce((s, t) => s + (examRun.rate[t.u] || 0), 0);
    const r = progress.exams[e.id] || { best: 0, max, n: 0 }; r.max = max; r.best = Math.max(r.best, pts); r.last = pts; r.n = (r.n || 0) + 1; r.at = Date.now(); progress.exams[e.id] = r; scheduleSave(); examRun.saved = true; rerenderKeep();
  }
  else if (a === "sol-edit") { examRun.editing = b.dataset.u; rerenderKeep("task-" + b.dataset.u); }
  else if (a === "sol-cancel") { const u = examRun.editing; examRun.editing = null; rerenderKeep("task-" + u); }
  else if (a === "sol-save") { const e = EXAM_BY_ID[examRun.id]; const t = e.tasks.find(x => x.u === b.dataset.u); const txt = $("#solEdit").value; const changed = txt.trim() !== plain(t.sol).trim(); CU().sol[solKey(e, t)] = { text: changed ? txt : null, ok: $("#solOk").checked }; examRun.editing = null; scheduleSave(); rerenderKeep("task-" + t.u); }
  else if (a === "sol-reset") { const e = EXAM_BY_ID[examRun.id]; const t = e.tasks.find(x => x.u === b.dataset.u); delete CU().sol[solKey(e, t)]; examRun.editing = null; scheduleSave(); rerenderKeep("task-" + t.u); }
  // Editor
  else if (a === "ed-new") { current.edit = blankDraft(); render(); }
  else if (a === "ed-cancel") { current.edit = null; render(); }
  else if (a === "ed-save") saveDraft();
  else if (a === "ed-edit") { const q = CU().questions.find(x => x.id === b.dataset.id); if (q) { current.edit = draftFrom(q, false); render(); window.scrollTo({ top: 0 }); } }
  else if (a === "ed-del") { if (confirm("Diese Frage löschen?")) { CU().questions = CU().questions.filter(x => x.id !== b.dataset.id); rebuildQ(); scheduleSave(); render(); } }
  else if (a === "ed-edit-base") { const q = BY_ID[b.dataset.id] || BASE_BY_ID[b.dataset.id]; current.edit = draftFrom(Object.assign({}, BASE_BY_ID[b.dataset.id], CU().over[b.dataset.id] || {}), true); render(); window.scrollTo({ top: 0 }); }
  else if (a === "ed-reset-base") { delete CU().over[b.dataset.id]; rebuildQ(); scheduleSave(); render(); }
  else if (a === "ed-hide") { const id = b.dataset.id; if (CU().hidden[id]) delete CU().hidden[id]; else CU().hidden[id] = true; rebuildQ(); scheduleSave(); updateFailBadge(); render(); }
  else if (a === "export") exportData();
}
function rerenderKeep(anchorId) {
  const el = anchorId && document.getElementById(anchorId); const top = el ? el.getBoundingClientRect().top : null; const y = window.scrollY;
  render();
  const el2 = anchorId && document.getElementById(anchorId);
  if (el2 && top !== null) window.scrollTo({ top: window.scrollY + el2.getBoundingClientRect().top - top }); else window.scrollTo({ top: y });
}

updateFailBadge(); render(); pomoUI(); connectStore();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }

</script>
