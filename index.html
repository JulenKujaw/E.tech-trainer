<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e151e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>E-Tech Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centred column (max 760px) — header with tabs, then the active view (inicio · sesión · fallos). Detail from the subject: PE green-yellow stripe for progress, CEE blue/red for the two voltage worlds. */
:root {
  --bg: #f1f4f8;
  --surface: #ffffff;
  --surface-2: #e8edf3;
  --ink: #152130;
  --muted: #586678;
  --line: #d4dbe4;
  --accent: #1c5dcc;
  --accent-soft: #e2ebfb;
  --on-accent: #ffffff;
  --red: #c4362c;
  --red-soft: #fbe7e5;
  --good: #1d7f47;
  --good-soft: #e1f3e8;
  --warn: #a96a00;
  --pe-green: #2f9a43;
  --pe-yellow: #e2c200;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151e; --surface: #16202c; --surface-2: #1d2937; --ink: #e4eaf2; --muted: #95a3b4; --line: #2b3847;
    --accent: #6a9cf2; --accent-soft: #1c2c47; --on-accent: #0e151e; --red: #ef7266; --red-soft: #3a1f1d;
    --good: #55c487; --good-soft: #17322a; --warn: #e3a43a; --pe-green: #3fb457; --pe-yellow: #d8bb12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151e; --surface: #16202c; --surface-2: #1d2937; --ink: #e4eaf2; --muted: #95a3b4; --line: #2b3847;
  --accent: #6a9cf2; --accent-soft: #1c2c47; --on-accent: #0e151e; --red: #ef7266; --red-soft: #3a1f1d;
  --good: #55c487; --good-soft: #17322a; --warn: #e3a43a; --pe-green: #3fb457; --pe-yellow: #d8bb12; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 14px 10px; border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.01em; margin: 0; line-height: 1; text-wrap: balance; }
.brand .tag { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
nav.tabs button { border: 0; background: transparent; color: var(--muted); font: 500 14px var(--font-body); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
nav.tabs .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--red); color: #fff; font-size: 12px; line-height: 20px; text-align: center; }
button:focus-visible, input:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; line-height: 1.15; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0; line-height: 1.2; }
p { margin: 0; }
.muted { color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.stat.alert b { color: var(--red); }

.section { display: grid; gap: 12px; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mode {
  text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--radius);
  padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; font: inherit; position: relative; overflow: hidden;
}
.mode:hover:not(:disabled) { border-color: var(--accent); }
.mode:disabled { opacity: 0.45; cursor: default; }
.mode .code { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent); }
.mode strong { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.15; }
.mode small { color: var(--muted); font-size: 13px; line-height: 1.4; }
.mode.wide { grid-column: 1 / -1; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.mode.wide .code, .mode.wide small { color: var(--on-accent); opacity: 0.85; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px;
  font: 500 13px var(--font-body); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 16px;
  font: 600 14px var(--font-body); cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn:disabled { opacity: 0.45; cursor: default; }
.lenpick { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }

/* Session */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.prog { display: grid; gap: 6px; }
.prog .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.prog .fill { height: 100%; background: repeating-linear-gradient(135deg, var(--pe-green) 0 8px, var(--pe-yellow) 8px 16px); transition: width .3s ease; }
.prog .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qtopic { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted); text-transform: uppercase; }
.pill.type { background: var(--accent-soft); color: var(--accent); }
.question { font-size: 18px; font-weight: 500; line-height: 1.45; }
.opts { display: grid; gap: 8px; }
.opt {
  text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px;
  padding: 11px 14px; font: inherit; cursor: pointer; display: flex; gap: 10px; align-items: flex-start;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; min-width: 14px; }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt:disabled { cursor: default; }
.gaptext { font-size: 18px; line-height: 1.9; }
.blank { display: inline-block; min-width: 90px; border-bottom: 2px solid var(--accent); text-align: center; font-weight: 600; padding: 0 6px; color: var(--accent); }
.blank.ok { color: var(--good); border-color: var(--good); }
.blank.bad { color: var(--red); border-color: var(--red); }
.answer-row { display: flex; gap: 8px; flex-wrap: wrap; }
.answer-row input {
  flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px;
  padding: 10px 12px; font: 500 16px var(--font-body);
}
.answer-row .unit { align-self: center; font-family: var(--font-mono); color: var(--muted); }
.formula { font-family: var(--font-mono); font-size: 14px; background: var(--surface-2); border-radius: 6px; padding: 2px 6px; }

.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.match .col { display: grid; gap: 8px; align-content: start; }
.mitem {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 11px; font: inherit;
  text-align: left; cursor: pointer; font-size: 14px; line-height: 1.35; display: flex; gap: 8px; align-items: flex-start;
}
.mitem .tagn { font-family: var(--font-mono); font-size: 11px; min-width: 18px; height: 18px; border-radius: 4px; display: inline-grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.mitem.sel { border-color: var(--accent); background: var(--accent-soft); }
.mitem.paired .tagn { background: var(--ink); color: var(--bg); }
.mitem.ok { border-color: var(--good); background: var(--good-soft); }
.mitem.bad { border-color: var(--red); background: var(--red-soft); }

.order { display: grid; gap: 14px; }
.slots { display: grid; gap: 6px; min-height: 48px; border: 1px dashed var(--line); border-radius: 10px; padding: 8px; }
.slots .ph { color: var(--muted); font-size: 13px; padding: 6px; }
.oitem { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 12px; font: inherit; text-align: left; cursor: pointer; display: flex; gap: 10px; }
.oitem .n { font-family: var(--font-mono); color: var(--accent); min-width: 18px; }
.oitem.ok { border-color: var(--good); background: var(--good-soft); }
.oitem.bad { border-color: var(--red); background: var(--red-soft); }

.flash { border: 1px solid var(--line); border-radius: 12px; padding: 22px; background: var(--surface-2); display: grid; gap: 10px; min-height: 140px; align-content: center; }
.flash .back { border-top: 1px solid var(--line); padding-top: 12px; font-weight: 600; font-size: 18px; }

.feedback { border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; border: 1px solid; }
.feedback.ok { background: var(--good-soft); border-color: var(--good); }
.feedback.bad { background: var(--red-soft); border-color: var(--red); }
.feedback .verdict { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.feedback.ok .verdict { color: var(--good); }
.feedback.bad .verdict { color: var(--red); }
.feedback .sol { font-size: 14px; }
.feedback .ex { font-size: 14px; line-height: 1.55; }
.feedback .ex b { font-weight: 600; }

.result-score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.result-score b { font-family: var(--font-display); font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; }
.list { display: grid; gap: 8px; }
.li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; background: var(--surface); }
.li .t { font-size: 12px; color: var(--muted); }
.topics { display: grid; gap: 10px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 52px; gap: 10px; align-items: center; font-size: 14px; }
.trow .tb { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.trow .tb i { display: block; height: 100%; border-radius: 999px; }
.trow .pct { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 13px; }
.advice { border-left: 3px solid var(--warn); background: var(--surface); border-radius: 0 10px 10px 0; padding: 12px 14px; display: grid; gap: 6px; }
.advice.calm { border-left-color: var(--good); }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.savestate { font-size: 12px; color: var(--muted); }

@media (max-width: 560px) {
  .modes { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat b { font-size: 22px; }
  .match { grid-template-columns: minmax(0, 1fr); }
  .trow { grid-template-columns: minmax(0, 1fr) 70px 44px; }
  .card { padding: 16px; }
  .question, .gaptext { font-size: 17px; }
}
@media (max-width: 640px) {
  header.top { position: static; padding-block: 12px 8px; }
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; border-radius: 0; gap: 6px;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  }
  nav.tabs button { padding: 11px 6px; font-size: 15px; border-radius: 10px; }
  nav.tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
  body { padding-block: 0 calc(88px + env(safe-area-inset-bottom, 0px)); }
  .opt { padding: 14px; min-height: 52px; }
  .chip { padding: 8px 14px; font-size: 14px; }
  .mitem, .oitem { padding: 12px; min-height: 48px; }
  .btn { padding: 12px 18px; font-size: 15px; }
  #nextBtn, #mCheck, #oCheck, #fYes, #flip { flex: 1 1 auto; }
  .answer-row .btn { flex: 1 1 100%; }
  .feedback + .row { position: sticky; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .prog .fill { transition: none; } }

/* --- Erweiterungen: Header-Aktionen, Prüfungen, Karteikarten, Editor --- */
.top-actions { display: flex; gap: 6px; align-items: center; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; height: 34px; min-width: 34px; padding: 0 10px; font: 600 13px var(--font-body); cursor: pointer; font-variant-numeric: tabular-nums; }
.iconbtn.run { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.iconbtn.run.brk { background: var(--good); border-color: var(--good); }
.pomo-big { font-family: var(--font-mono); font-size: 34px; font-weight: 500; font-variant-numeric: tabular-nums; }
.pomo-card { gap: 10px; }
.exam-cta { grid-column: 1 / -1; border-left: 4px solid var(--pe-green); }
.badge-lv { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge-lv.ok { background: var(--good-soft); color: var(--good); }
.badge-lv.own { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.exam-item { gap: 12px; }
.task { gap: 12px; }
.tq { font-size: 16px; line-height: 1.6; }
.scen { gap: 8px; font-size: 15px; line-height: 1.6; background: var(--surface-2); }
.ta, .inp { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 10px 12px; font: 15px/1.5 var(--font-body); }
.ta { resize: vertical; min-height: 84px; }
select.inp { padding: 9px 10px; }
.solution { display: grid; gap: 10px; border-top: 1px dashed var(--line); padding-top: 12px; }
.solbody { font-size: 15px; line-height: 1.65; }
.warn { border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 13px; font-weight: 600; }
.okmark { font-size: 13px; color: var(--good); font-weight: 600; }
.rate { display: grid; gap: 6px; }
.linkbtn { border: 0; background: none; color: var(--accent); font: 600 14px var(--font-body); padding: 4px 0; cursor: pointer; text-align: left; }
.linkbtn.danger { color: var(--red); }
.timerbar { position: sticky; top: 70px; z-index: 4; display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--accent); color: var(--on-accent); padding: 10px 16px; border-radius: 12px; }
.timerbar b { font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.timerbar .btn { background: var(--on-accent); color: var(--accent); border-color: var(--on-accent); }
.li.dim { opacity: 0.55; }
.editor-form { gap: 12px; }
.editor-form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.optset { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; margin: 0; }
.optset legend { font-size: 13px; color: var(--muted); font-weight: 600; padding: 0 4px; }
/* Karteikarte zum Umdrehen */
.flip { border: 0; padding: 0; background: none; width: 100%; perspective: 1200px; cursor: pointer; font: inherit; color: inherit; text-align: left; }
.flip-inner { position: relative; display: grid; transition: transform .5s ease; transform-style: preserve-3d; min-height: 190px; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; display: grid; gap: 10px; align-content: center; padding: 22px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: var(--accent); }
.backans { font-weight: 600; font-size: 18px; white-space: pre-line; }
@media (prefers-reduced-motion: reduce) { .flip-inner { transition: none; } }
@media (max-width: 640px) {
  nav.tabs { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; gap: 2px !important; padding-left: 6px !important; padding-right: 6px !important; }
  nav.tabs button { font-size: 12.5px !important; padding: 10px 2px !important; }
  nav.tabs .badge { margin-left: 2px; min-width: 16px; padding: 0 4px; line-height: 16px; font-size: 11px; }
  .timerbar { top: 6px; }
  .brand .tag { display: none; }
}

</style>
<script>try{var t=localStorage.getItem("etech-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>E-Tech-Trainer</h1><span class="tag">FaVT · Energieversorgung</span></div>
    <div class="top-actions"><button class="iconbtn" id="pomoPill" title="Pomodoro starten/pausieren">Lernen 25:00</button><button class="iconbtn" id="themeBtn" title="Hell/Dunkel umschalten" aria-label="Hell- oder Dunkelmodus umschalten">◐</button></div>
    <nav class="tabs" aria-label="Bereiche">
      <button data-view="home" aria-current="page">Start</button>
      <button data-view="exams">Prüfungen</button>
      <button data-view="fails">Fehler <span class="badge" id="failBadge" hidden>0</span></button>
      <button data-view="progress">Fortschritt</button>
      <button data-view="editor">Editor</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<script>
// ---------- Content ----------
const TOPICS = {
  1: "Grundgrößen", 2: "Spannungsarten", 3: "Netzsysteme", 4: "Reihe & Parallel", 5: "Gefährdungen",
  6: "Schutzmaßnahmen", 7: "Schleifenimpedanz", 8: "Prüfungen", 9: "Leitungsdimensionierung",
  10: "Lastverteilung", 11: "Stern & Dreieck"
};
const TYPE_LABEL = { mc: "Quiz", tf: "Richtig/Falsch", gap: "Lückentext", type: "Begriff", calc: "Rechnen", match: "Zuordnen", order: "Reihenfolge", flash: "Karteikarte" };

const Q = [];
const mc = (id, t, q, opts, a, ex) => Q.push({ id, t, type: "mc", q, opts, a: opts[a], ex });
const tf = (id, t, q, a, ex) => Q.push({ id, t, type: "tf", q, opts: ["Richtig", "Falsch"], a: a ? "Richtig" : "Falsch", ex });
const gap = (id, t, text, opts, a, ex) => Q.push({ id, t, type: "gap", text, opts, a, ex });
const ty = (id, t, q, answers, ex) => Q.push({ id, t, type: "type", q, answers, ex });
const mt = (id, t, q, pairs, ex) => Q.push({ id, t, type: "match", q, pairs, ex });
const od = (id, t, q, items, ex) => Q.push({ id, t, type: "order", q, items, ex });

// 1 Grundgrößen
mc("g1", 1, "Welche Einheit hat der elektrische Widerstand?", ["Volt", "Ampere", "Ohm", "Watt"], 2, "Widerstand R wird in <b>Ohm (Ω)</b> angegeben. Volt = Spannung, Ampere = Strom, Watt = Leistung.");
mc("g2", 1, "Wie wird die Spannung an einem Verbraucher gemessen?", ["In Reihe zum Verbraucher", "Parallel zum Verbraucher", "Nur mit der Stromzange", "Im Schutzleiter"], 1, "Der Spannungsmesser wird <b>parallel</b> angeschlossen, weil die Spannung zwischen zwei Punkten anliegt.");
mc("g3", 1, "Wie misst man den Strom, ohne den Stromkreis aufzutrennen?", ["Mit dem Spannungsprüfer", "Mit der Stromzange", "Mit dem Isolationsmessgerät", "Gar nicht"], 1, "Die <b>Stromzange</b> misst das Magnetfeld um den Leiter. Sonst wird der Strommesser <b>in Reihe</b> geschaltet.");
mc("g4", 1, "Welche Formel für die Leistung ist richtig?", ["P = U / I", "P = U × I", "P = R / I", "P = I / U"], 1, "<span class='formula'>P = U × I = I² × R = U² / R</span>");
mc("g5", 1, "Was misst der Stromzähler?", ["Die Leistung in W", "Die Arbeit in kWh", "Die Spannung in V", "Den Strom in A"], 1, "Der Zähler misst die <b>elektrische Arbeit</b> W = P × t, meist in kWh.");
mc("g6", 1, "Eine Leitung wird doppelt so lang. Was passiert mit ihrem Widerstand?", ["Er halbiert sich", "Er bleibt gleich", "Er verdoppelt sich", "Er vervierfacht sich"], 2, "<span class='formula'>R = l / (κ × A)</span> – R ist proportional zur Länge l.");
mc("g7", 1, "Was passiert mit dem Leitungswiderstand bei größerem Querschnitt?", ["Er steigt", "Er sinkt", "Er bleibt gleich", "Er wird negativ"], 1, "A steht im Nenner: <span class='formula'>R = l / (κ × A)</span>. Dicke Leitung = kleiner Widerstand = weniger Spannungsfall.");
mc("g8", 1, "Was ist der Leitwert G?", ["R × U", "1 / R", "U / I", "I² × R"], 1, "Der Leitwert ist der <b>Kehrwert des Widerstands</b>: G = 1/R, Einheit Siemens (S).");
tf("g9", 1, "Bei Metallen steigt der Widerstand mit der Temperatur.", true, "Richtig. Metalle sind <b>Kaltleiter</b>: warm = höherer Widerstand. Deshalb die ⅔-Regel bei der Schleifenimpedanz.");
tf("g10", 1, "Die technische Stromrichtung geht von Minus nach Plus.", false, "Falsch. Die <b>technische Stromrichtung</b> geht von + nach −. Die Elektronen fließen von − nach +.");
gap("g11", 1, "Das Ohmsche Gesetz lautet U = R × ___.", ["I", "P", "W", "G"], "I", "U = R × I. Merkhilfe: Dreieck mit U oben, R und I unten.");
gap("g12", 1, "Die elektrische Arbeit berechnet man mit W = P × ___.", ["t", "U", "R", "I"], "t", "Arbeit = Leistung × Zeit, z. B. 2 kW × 6 h = 12 kWh.");
gap("g13", 1, "Die Leitfähigkeit von Kupfer beträgt etwa κ = ___ m/(Ω·mm²).", ["56", "35", "230", "0,0178"], "56", "κ(Cu) ≈ 56 m/(Ω·mm²). 0,0178 ist der spezifische Widerstand ρ (der Kehrwert), 35 gilt für Aluminium.");
ty("g14", 1, "Wie heißt die Einheit der elektrischen Leistung?", ["Watt", "W"], "Leistung P in <b>Watt (W)</b>.");
ty("g15", 1, "Welches Formelzeichen hat die Stromstärke?", ["I"], "Stromstärke = <b>I</b>, Einheit Ampere.");
ty("g16", 1, "Messgerät, mit dem man den Strom misst, ohne den Stromkreis aufzutrennen?", ["Stromzange", "Zangenamperemeter", "Zangenstrommesser"], "Die <b>Stromzange</b> wird um einen einzelnen Leiter gelegt.");
ty("g17", 1, "Wie heißt der Kehrwert des Widerstands?", ["Leitwert", "elektrischer Leitwert"], "<b>Leitwert</b> G = 1/R in Siemens.");
mt("g18", 1, "Ordne jeder Größe ihre Einheit zu.", [["Spannung", "Volt"], ["Strom", "Ampere"], ["Widerstand", "Ohm"], ["Leistung", "Watt"], ["Arbeit", "Kilowattstunde"], ["Leitwert", "Siemens"]], "U in V · I in A · R in Ω · P in W · W in kWh · G in S.");

// 2 Spannungsarten
mc("s1", 2, "Welchen Effektivwert hat die Netzspannung (Außenleiter gegen N) in Deutschland?", ["325 V", "230 V", "400 V", "110 V"], 1, "<b>230 V</b> effektiv. 400 V liegen zwischen zwei Außenleitern, 325 V ist der Scheitelwert.");
mc("s2", 2, "Wie groß ist der Scheitelwert der 230-V-Netzspannung?", ["230 V", "≈ 325 V", "400 V", "≈ 163 V"], 1, "<span class='formula'>Û = U × √2 = 230 V × 1,414 ≈ 325 V</span>");
mc("s3", 2, "Wie lange dauert eine Periode bei 50 Hz?", ["2 ms", "20 ms", "50 ms", "1 s"], 1, "<span class='formula'>T = 1 / f = 1 / 50 Hz = 0,02 s = 20 ms</span>");
mc("s4", 2, "Was zeigt ein Multimeter bei Wechselspannung an?", ["Den Scheitelwert", "Den Effektivwert", "Den Spitze-Spitze-Wert", "Den Mittelwert 0 V"], 1, "Multimeter zeigen den <b>Effektivwert</b> – den Wert, der dieselbe Wärme erzeugt wie Gleichspannung.");
mc("s5", 2, "Nach welcher Leistung wird ein Stromerzeuger bemessen?", ["Wirkleistung in W", "Scheinleistung in VA", "Blindleistung in var", "Arbeit in kWh"], 1, "Generatoren und Trafos werden nach der <b>Scheinleistung (kVA)</b> bemessen, weil auch der Blindstrom die Wicklungen belastet.");
mc("s6", 2, "Was bedeutet cos φ = 1?", ["Rein ohmsche Last", "Rein induktive Last", "Keine Leistung", "Kurzschluss"], 0, "Bei rein ohmscher Last (Halogen, Heizlüfter) sind Strom und Spannung in Phase: P = S.");
mc("s7", 2, "Wo liegt die Grenze der Kleinspannung bei Wechselspannung?", ["12 V", "25 V", "50 V", "120 V"], 2, "Kleinspannung: höchstens <b>50 V AC</b> bzw. <b>120 V DC</b>.");
tf("s8", 2, "Akkus und Batterien liefern Gleichspannung.", true, "Richtig. Gleichspannung hat konstanten Wert und feste Polarität.");
tf("s9", 2, "Blindleistung verrichtet nutzbare Arbeit.", false, "Falsch. Blindleistung pendelt zwischen Netz und Gerät. Sie belastet die Leitungen, verrichtet aber keine Arbeit.");
gap("s10", 2, "Effektivwert: U = Û / ___", ["√2", "√3", "2", "π"], "√2", "U = Û / √2 ≈ 0,707 × Û. √3 ist der Verkettungsfaktor im Drehstrom.");
gap("s11", 2, "Die Netzfrequenz in Deutschland beträgt ___ Hz.", ["50", "60", "230", "400"], "50", "50 Hz in Europa, 60 Hz z. B. in den USA.");
gap("s12", 2, "Die Einheit der Scheinleistung ist ___.", ["VA", "W", "var", "kWh"], "VA", "S in VA, P in W, Q in var.");
ty("s13", 2, "Wie heißt der Höchstwert einer Sinusspannung?", ["Scheitelwert", "Amplitude", "Spitzenwert"], "<b>Scheitelwert</b> Û (Amplitude), bei 230 V ≈ 325 V.");
ty("s14", 2, "Wie heißt die Leistung, die zwischen Netz und Gerät hin und her pendelt?", ["Blindleistung"], "<b>Blindleistung</b> Q in var.");
ty("s15", 2, "Wie nennt man das Verhältnis P / S?", ["Leistungsfaktor", "cos phi", "cosphi", "cos φ"], "<b>Leistungsfaktor</b> cos φ = P / S.");

// 3 Netzsysteme
mc("n1", 3, "Welches Netzsystem ist hinter dem Speisepunkt in der Veranstaltungstechnik vorgeschrieben?", ["TN-C", "TN-S", "IT", "TT"], 1, "<b>TN-S</b>: N und PE getrennt, RCD einsetzbar, PE führt keinen Betriebsstrom.");
mc("n2", 3, "Was bedeutet der erste Buchstabe „T“ in TN-S?", ["Die Geräte sind geerdet", "Der Sternpunkt der Quelle ist direkt geerdet", "N und PE sind getrennt", "Es gibt einen Transformator"], 1, "1. Buchstabe = Erdung der <b>Quelle</b> (T = terre = Erde, I = isoliert).");
mc("n3", 3, "Was bedeutet „C“ in TN-C?", ["N und PE sind im PEN-Leiter kombiniert", "Kupferleiter", "LS-Charakteristik C", "Kein Schutzleiter vorhanden"], 0, "C = combiné: N und PE in <b>einem</b> Leiter, dem PEN-Leiter.");
mc("n4", 3, "Warum ist das TN-C-System in mobilen Anlagen verboten?", ["Es ist zu teuer", "Bei PEN-Unterbrechung können Gehäuse Spannung führen, und ein RCD ist nicht möglich", "Es hat zu viele Leiter", "Wegen EMV-Problemen"], 1, "Bricht der PEN, liegt das Gehäuse über den Verbraucher an 230 V. Ein RCD funktioniert nicht, weil N und PE nicht getrennt sind.");
mc("n5", 3, "Welches Netzsystem schaltet beim ersten Fehler nicht ab?", ["TN-S", "TT", "IT", "TN-C-S"], 2, "Im <b>IT-System</b> ist die Quelle nicht geerdet: Der erste Fehler hat keinen Rückweg. Deshalb braucht es eine Isolationsüberwachung.");
mc("n6", 3, "Was ist im TT-System für die Abschaltung praktisch immer nötig?", ["Nur ein LS", "Ein RCD", "Eine Isolationsüberwachung", "Nichts"], 1, "Der Fehlerstrom fließt über das Erdreich und ist klein. Ein LS würde nicht auslösen, ein <b>RCD</b> schon.");
mc("n7", 3, "Wie viele Leiter hat eine Drehstromleitung im TN-S-System?", ["3", "4", "5", "6"], 2, "L1, L2, L3, N und PE = <b>5 Leiter</b>, z. B. H07RN-F 5G6.");
tf("n8", 3, "Nach dem Aufteilungspunkt im TN-C-S-System dürfen N und PE wieder verbunden werden.", false, "Falsch. Nach der Aufteilung werden N und PE <b>nie wieder</b> verbunden, sonst fließt Betriebsstrom über den PE.");
tf("n9", 3, "Ein IT-System braucht eine Isolationsüberwachung.", true, "Richtig. Der erste Fehler wird nur gemeldet, damit er behoben wird, bevor ein zweiter Fehler auftritt.");
gap("n10", 3, "Der kombinierte Leiter aus N und PE heißt ___-Leiter.", ["PEN", "PE", "NPE", "Erd"], "PEN", "PEN = Protective Earth + Neutral.");
gap("n11", 3, "Im ___-System hat jedes Gerät einen eigenen Anlagenerder.", ["TT", "TN-S", "TN-C", "IT"], "TT", "2. Buchstabe T = Körper an eigenem Erder.");
ty("n12", 3, "Wie heißt der grün-gelbe Leiter?", ["Schutzleiter", "PE"], "<b>Schutzleiter (PE)</b>, immer grün-gelb.");
ty("n13", 3, "Netzsystem, in dem N und PE durchgehend getrennt sind?", ["TN-S", "TNS"], "<b>TN-S</b> (S = séparé).");
mt("n14", 3, "Ordne die Netzsysteme ihrer Beschreibung zu.", [["TN-S", "N und PE durchgehend getrennt"], ["TN-C", "N und PE im PEN-Leiter"], ["TN-C-S", "Erst PEN, dann getrennt"], ["TT", "Geräte an eigenem Anlagenerder"], ["IT", "Quelle nicht geerdet"]], "Merke: 1. Buchstabe = Quelle, 2. Buchstabe = Geräte, 3. Buchstabe = S (getrennt) oder C (kombiniert).");

// 4 Reihe & Parallel
mc("r1", 4, "Was ist in einer Reihenschaltung überall gleich?", ["Die Spannung", "Der Strom", "Die Leistung", "Der Widerstand"], 1, "Es gibt nur einen Weg, also fließt überall <b>derselbe Strom</b>. Die Spannung teilt sich auf.");
mc("r2", 4, "Was ist in einer Parallelschaltung überall gleich?", ["Der Strom", "Die Spannung", "Der Widerstand", "Die Leistung"], 1, "Alle Zweige hängen an denselben zwei Punkten: <b>gleiche Spannung</b>. Der Strom teilt sich auf.");
mc("r3", 4, "Wie groß ist der Gesamtwiderstand einer Parallelschaltung?", ["Größer als der größte Einzelwiderstand", "Kleiner als der kleinste Einzelwiderstand", "Die Summe aller Widerstände", "Gleich dem größten Widerstand"], 1, "Jeder zusätzliche Zweig ist ein weiterer Weg für den Strom: Rges wird <b>kleiner als der kleinste</b> Einzelwiderstand.");
mc("r4", 4, "Was besagt die Maschenregel?", ["Die Summe der Teilspannungen ist gleich der Quellenspannung", "Zufließende Ströme = abfließende Ströme", "U = R × I", "P = U × I"], 0, "2. Kirchhoffsches Gesetz: <span class='formula'>Σ U = 0</span>, also Uges = U1 + U2 + …");
mc("r5", 4, "Was besagt die Knotenpunktregel?", ["Die Summe der Spannungen ist null", "Die Summe der zufließenden Ströme ist gleich der Summe der abfließenden", "Der Widerstand ist im Knoten null", "Der Strom ist überall gleich"], 1, "1. Kirchhoffsches Gesetz: <span class='formula'>Σ I zu = Σ I ab</span>. Darauf beruht auch der RCD.");
mc("r6", 4, "Wie sind die Verbraucher an Steckdosen geschaltet?", ["In Reihe", "Parallel", "Im Dreieck", "Gemischt"], 1, "<b>Parallel</b>: Jeder Verbraucher bekommt 230 V und läuft unabhängig von den anderen.");
tf("r7", 4, "Fällt in einer Reihenschaltung ein Verbraucher aus, laufen die anderen weiter.", false, "Falsch. Der einzige Stromweg ist unterbrochen: <b>alle</b> gehen aus (alte Lichterketten).");
gap("r8", 4, "In der Reihenschaltung addieren sich die ___.", ["Spannungen", "Ströme", "Leitwerte", "Frequenzen"], "Spannungen", "U = U1 + U2 + … (Maschenregel). In der Parallelschaltung addieren sich die Ströme.");
gap("r9", 4, "Zwei parallele Widerstände: R = (R1 × R2) / (R1 ___ R2)", ["+", "−", "×", "/"], "+", "Produkt durch Summe: <span class='formula'>R = (R1 × R2) / (R1 + R2)</span>");
ty("r10", 4, "Wie heißt das 2. Kirchhoffsche Gesetz?", ["Maschenregel", "Maschensatz"], "<b>Maschenregel</b>: Σ U = 0.");
ty("r11", 4, "Wie heißt das 1. Kirchhoffsche Gesetz?", ["Knotenpunktregel", "Knotenregel", "Knotensatz", "Knotenpunktsatz"], "<b>Knotenpunktregel</b>: Σ I zu = Σ I ab.");

// 5 Gefährdungen
mc("h1", 5, "Ab welchem Körperstrom (AC, länger als 1 s) besteht die Gefahr von Herzkammerflimmern?", ["0,5 mA", "10 mA", "ca. 50 mA", "3 A"], 2, "Ab etwa <b>50 mA</b> kann das Herz flimmern. 0,5 mA = Wahrnehmbarkeit, 10 mA = Loslassschwelle.");
mc("h2", 5, "Was ist die Loslassschwelle?", ["Der Strom, ab dem man ihn spürt", "Der Strom, ab dem man den Leiter nicht mehr loslassen kann (ca. 10 mA)", "Die Auslöseschwelle des RCD", "Die Grenze für Kleinspannung"], 1, "Ab ca. <b>10 mA</b> verkrampfen die Muskeln – man kann nicht mehr loslassen.");
mc("h3", 5, "Womit stellt man die Spannungsfreiheit fest?", ["Mit dem Phasenprüfer", "Mit einem zweipoligen Spannungsprüfer", "Mit dem Multimeter im Ohm-Bereich", "Mit dem Isolationsmessgerät"], 1, "Nur der <b>zweipolige Spannungsprüfer</b> ist dafür zugelassen. Ein Phasenprüfer (Schraubendreher) ist unzuverlässig.");
mc("h4", 5, "Wer darf eine mobile Anlage errichten und die Verantwortung dafür übernehmen?", ["Ein Laie", "Eine EuP", "Eine Elektrofachkraft", "Jeder mit Erfahrung"], 2, "Nur die <b>Elektrofachkraft (EFK)</b> kann die Gefahren selbst beurteilen und die Verantwortung tragen.");
mc("h5", 5, "Was darf eine elektrotechnisch unterwiesene Person (EuP)?", ["Selbstständig Anlagen errichten", "Einfache Arbeiten unter Leitung und Aufsicht einer EFK", "Gar nichts Elektrisches", "Prüfprotokolle allein unterschreiben"], 1, "Die EuP wird von einer EFK unterwiesen und arbeitet unter deren <b>Leitung und Aufsicht</b>.");
mc("h6", 5, "Wie hoch ist die dauerhaft zulässige Berührungsspannung bei Wechselspannung?", ["25 V", "50 V", "120 V", "230 V"], 1, "<b>50 V AC</b> bzw. 120 V DC.");
mc("h7", 5, "Was ist bei einem Stromunfall zuerst zu tun?", ["Die Person sofort wegziehen", "Eigenschutz: Stromkreis unterbrechen", "Wasser geben", "Abwarten"], 1, "<b>Eigenschutz zuerst</b>: Stecker ziehen, LS oder NOT-AUS. Wer die Person anfasst, wird selbst durchströmt.");
mc("h8", 5, "Wie groß ist der Körperwiderstand ungefähr (Hand–Fuß)?", ["10 Ω", "1000 Ω", "1 MΩ", "50 Ω"], 1, "Etwa <b>1000 Ω</b>. Bei 230 V fließen also rund 230 mA – lebensgefährlich.");
tf("h9", 5, "Nach einem Stromunfall muss die Person immer zum Arzt, auch wenn es ihr gut geht.", true, "Richtig. Herzrhythmusstörungen können noch Stunden später auftreten.");
tf("h10", 5, "Die 5 Sicherheitsregeln werden nach der Arbeit in derselben Reihenfolge aufgehoben.", false, "Falsch. Sie werden in <b>umgekehrter Reihenfolge</b> aufgehoben (5 → 1).");
gap("h11", 5, "Sicherheitsregel 2: Gegen ___ sichern.", ["Wiedereinschalten", "Berühren", "Kurzschluss", "Absturz"], "Wiedereinschalten", "Schloss, Schild „Nicht schalten“, Sicherungen entnehmen.");
gap("h12", 5, "Sicherheitsregel 4: Erden und ___.", ["kurzschließen", "abdecken", "freischalten", "messen"], "kurzschließen", "Erden und kurzschließen – Pflicht bei Hochspannung, in Niederspannung bei Rückspeisegefahr (Generator).");
ty("h13", 5, "Wie lautet die 3. Sicherheitsregel?", ["Spannungsfreiheit feststellen", "Spannungsfreiheit pruefen", "Spannungsfreiheit allpolig feststellen"], "<b>Spannungsfreiheit feststellen</b> – zweipolig, an allen Polen.");
ty("h14", 5, "Abkürzung für die Person, die nur unter Leitung und Aufsicht einer EFK arbeitet?", ["EuP", "elektrotechnisch unterwiesene Person"], "<b>EuP</b> = elektrotechnisch unterwiesene Person.");
ty("h15", 5, "Wie lautet die 1. Sicherheitsregel?", ["Freischalten"], "<b>Freischalten</b> = allpolig trennen.");
od("h16", 5, "Bringe die 5 Sicherheitsregeln in die richtige Reihenfolge.", ["Freischalten", "Gegen Wiedereinschalten sichern", "Spannungsfreiheit feststellen", "Erden und kurzschließen", "Benachbarte, unter Spannung stehende Teile abdecken"], "Eselsbrücke: <b>F</b>reie <b>G</b>eister <b>S</b>prechen <b>E</b>rnst <b>A</b>b.");
od("h17", 5, "Erste Hilfe bei einem Stromunfall: richtige Reihenfolge?", ["Eigenschutz beachten", "Stromkreis unterbrechen", "Notruf 112 absetzen", "Atmung prüfen, ggf. HLW und AED", "Person zum Arzt bringen lassen"], "Erst sich selbst schützen und den Strom abschalten, dann Notruf und Erste Hilfe. Immer ärztlich untersuchen lassen.");
mt("h18", 5, "Ordne den Körperstrom seiner Wirkung zu.", [["0,5 mA", "Wahrnehmbarkeitsschwelle"], ["10 mA", "Loslassschwelle"], ["30 mA", "Auslösung RCD (Zusatzschutz)"], ["50 mA", "Herzkammerflimmern möglich"]], "Wichtig: Der RCD löst bei 30 mA aus – noch bevor Herzkammerflimmern droht.");

// 6 Schutzmaßnahmen
mc("p1", 6, "Welches Symbol steht für Schutzklasse II?", ["Das Erdungszeichen", "Ein doppeltes Quadrat", "Eine Raute mit III", "Ein Blitz"], 1, "<b>Doppeltes Quadrat</b> = doppelte oder verstärkte Isolierung, kein Schutzleiter.");
mc("p2", 6, "Was bedeutet Schutzklasse I?", ["Das Gehäuse ist mit dem Schutzleiter verbunden", "Doppelte Isolierung", "Betrieb mit Kleinspannung", "Wasserdicht"], 0, "SK I: Metallgehäuse am <b>PE</b>. Im Fehlerfall fließt der Strom über den PE und die Sicherung löst aus.");
mc("p3", 6, "Was ist Basisschutz?", ["Schutz gegen direktes Berühren aktiver Teile", "Abschaltung im Fehlerfall", "Zusatzschutz durch RCD", "Potenzialausgleich"], 0, "Basisschutz = Isolierung, Gehäuse, Abdeckung: Aktive Teile sind im Normalbetrieb <b>nicht berührbar</b>.");
mc("p4", 6, "Wie schnell muss in Endstromkreisen bis 32 A im TN-System (230 V) abgeschaltet werden?", ["0,1 s", "0,2 s", "0,4 s", "5 s"], 2, "Höchstens <b>0,4 s</b> (Verteilerstromkreise: 5 s).");
mc("p5", 6, "Wodurch unterscheidet sich SELV von PELV?", ["SELV hat eine höhere Spannung", "SELV hat keine Erdverbindung", "SELV ist nur Gleichspannung", "SELV braucht einen RCD"], 1, "<b>SELV</b> = ohne Erdverbindung, <b>PELV</b> = mit Erdverbindung. Beide max. 50 V AC / 120 V DC.");
mc("p6", 6, "Was gilt nach der Nennstromregel?", ["In ≤ Ib ≤ Iz", "Ib ≤ In ≤ Iz", "Iz ≤ In ≤ Ib", "In = Iz"], 1, "<span class='formula'>Ib ≤ In ≤ Iz</span> – Betriebsstrom ≤ Nennstrom LS ≤ Strombelastbarkeit der Leitung.");
mc("p7", 6, "Was schützt der Leitungsschutzschalter in erster Linie?", ["Das Gerät", "Die Leitung", "Die Person", "Den Generator"], 1, "Der LS schützt die <b>Leitung</b> vor Überhitzung. Personenschutz übernimmt der RCD.");
mc("p8", 6, "Bei welchem Vielfachen von In löst ein B-LS unverzögert aus?", ["1–3 × In", "3–5 × In", "5–10 × In", "10–20 × In"], 1, "B: 3–5 × In · C: 5–10 × In · D: 10–20 × In.");
mc("p9", 6, "Welche Charakteristik wählt man für Geräte mit hohen Einschaltströmen wie Schaltnetzteile?", ["B", "C", "Nur einen RCD", "Keine"], 1, "<b>C</b> verträgt Einschaltspitzen bis 5–10 × In, ohne auszulösen.");
mc("p10", 6, "Was bedeutet Selektivität?", ["Alle Schutzeinrichtungen lösen gleichzeitig aus", "Nur die dem Fehler am nächsten liegende Schutzeinrichtung löst aus", "Der RCD löst immer vor dem LS aus", "Es gibt nur eine Sicherung"], 1, "Nur der Kreis mit dem Fehler geht aus, der Rest der Show läuft weiter.");
mc("p11", 6, "Welcher RCD-Typ erfasst auch glatte Gleichfehlerströme?", ["Typ AC", "Typ A", "Typ F", "Typ B"], 3, "<b>Typ B</b> – nötig bei Frequenzumrichtern, E-Ladegeräten und vielen großen Netzteilen.");
mc("p12", 6, "Welcher Bemessungsdifferenzstrom gilt für den Zusatzschutz?", ["10 mA", "30 mA", "300 mA", "500 mA"], 1, "<b>30 mA</b> – unterhalb der Gefahr von Herzkammerflimmern.");
mc("p13", 6, "Wovor schützt ein RCD NICHT?", ["Vor Fehlerstrom über eine Person zur Erde", "Vor Überlast und Kurzschluss", "Vor Körperschluss mit Fehlerstrom", "Vor Isolationsfehlern zur Erde"], 1, "Der RCD misst nur die Differenz. Gegen <b>Überlast und Kurzschluss</b> hilft nur der LS. Auch wer L und N gleichzeitig berührt, ist nicht geschützt.");
mc("p14", 6, "Was macht ein RCM?", ["Er schaltet bei 30 mA ab", "Er überwacht den Differenzstrom und meldet nur", "Er misst die Spannung", "Er ersetzt den LS"], 1, "Ein <b>RCM</b> warnt, schaltet aber <b>nicht</b> ab.");
mc("p15", 6, "Was ist ein Körperschluss?", ["Ein Außenleiter berührt das leitfähige Gehäuse", "L und N sind direkt verbunden", "Ein Leiter berührt die Erde", "Ein Verbraucher ist überbrückt"], 0, "Körperschluss = aktiver Leiter am <b>Gehäuse</b>. L–N direkt = Kurzschluss, Leiter an Erde = Erdschluss.");
mc("p16", 6, "Warum braucht man einen Potenzialausgleich an Traversen und Bühnen?", ["Wegen des Gewichts", "Damit zwischen gleichzeitig berührbaren Metallteilen keine gefährliche Spannung auftritt", "Für besseres Licht", "Wegen EMV beim Video"], 1, "Alle berührbaren Metallteile werden auf <b>ein Potenzial</b> gebracht.");
mc("p17", 6, "Welcher RCD wird vorgeschaltet, damit Selektivität entsteht?", ["Typ S (selektiv, verzögert)", "Typ AC", "Ein zweiter 30-mA-RCD", "Gar keiner"], 0, "Vorgeschaltet z. B. <b>300 mA Typ S</b>, nachgeschaltet 30 mA.");
tf("p18", 6, "Ein RCD vergleicht den hinfließenden mit dem zurückfließenden Strom.", true, "Richtig. Fehlt eine Differenz (z. B. 30 mA über eine Person), schaltet er ab.");
tf("p19", 6, "Sicherungen sind selektiv, wenn die vorgeschaltete mindestens den 1,6-fachen Nennstrom hat.", true, "Richtig, z. B. 63 A vor 35/40 A.");
tf("p20", 6, "Geräte der Schutzklasse II haben einen Schutzleiter.", false, "Falsch. SK II hat <b>doppelte Isolierung</b> und keinen Schutzleiteranschluss.");
gap("p21", 6, "Nennstromregel: Ib ≤ In ≤ ___", ["Iz", "Ia", "Ik", "I2"], "Iz", "Iz = Strombelastbarkeit der Leitung.");
gap("p22", 6, "Der LS hat einen thermischen Auslöser für ___ und einen magnetischen für Kurzschluss.", ["Überlast", "Erdschluss", "Fehlerstrom", "Spannungsfall"], "Überlast", "Bimetall = Überlast (verzögert), Spule = Kurzschluss (sofort).");
ty("p23", 6, "Abkürzung der Fehlerstrom-Schutzeinrichtung?", ["RCD", "FI", "FI-Schalter"], "<b>RCD</b> (früher FI-Schalter).");
ty("p24", 6, "Wie heißt die Verbindung eines aktiven Leiters mit dem leitfähigen Gehäuse?", ["Körperschluss"], "<b>Körperschluss</b>.");
ty("p25", 6, "Schutzmaßnahme mit einem Trenntransformator?", ["Schutztrennung"], "<b>Schutztrennung</b> – grundsätzlich ein Verbraucher pro Trenntrafo.");
ty("p26", 6, "Kleinspannung ohne Erdverbindung (Abkürzung)?", ["SELV"], "<b>SELV</b> = Safety Extra Low Voltage.");
mt("p27", 6, "Ordne die RCD-Typen zu.", [["Typ AC", "Nur sinusförmiger Wechselfehlerstrom"], ["Typ A", "+ pulsierender Gleichfehlerstrom"], ["Typ F", "+ Mischfrequenzen"], ["Typ B", "+ glatter Gleichfehlerstrom"]], "Jeder Typ kann alles, was der vorige kann, plus etwas mehr. In mobilen Verteilern wird Typ B empfohlen.");
mt("p28", 6, "Ordne die Auslösecharakteristik dem Bereich der sofortigen Auslösung zu.", [["B", "3–5 × In"], ["C", "5–10 × In"], ["D", "10–20 × In"], ["Thermischer Auslöser", "Überlast, verzögert"]], "Je höher der Bereich, desto mehr Einschaltstrom verträgt der LS – aber desto kleiner muss die Schleifenimpedanz sein.");
mt("p29", 6, "Ordne die Fehlerarten zu.", [["Kurzschluss", "L direkt mit N oder anderem L verbunden"], ["Körperschluss", "L berührt das Metallgehäuse"], ["Erdschluss", "L berührt Erde oder geerdetes Teil"], ["Leiterschluss", "Verbindung über einen Verbraucher"]], "Leiterschluss: Das Gerät schaltet sich z. B. von selbst ein, weil der Schalter überbrückt ist.");
mt("p30", 6, "Ordne die Schutzklassen zu.", [["Schutzklasse I", "Gehäuse am Schutzleiter"], ["Schutzklasse II", "Doppelte Isolierung"], ["Schutzklasse III", "Kleinspannung SELV/PELV"]], "SK I: Scheinwerfer, Endstufen · SK II: Laptop-Netzteile · SK III: Akkuleuchten.");

// 7 Schleifenimpedanz
mc("z1", 7, "Was ist die Schleifenimpedanz Zs?", ["Der Widerstand der gesamten Fehlerstromschleife", "Der Isolationswiderstand", "Der Körperwiderstand", "Der Erdungswiderstand"], 0, "Zs = alle Widerstände, die der Fehlerstrom durchläuft: Trafo, Außenleiter, Schutzleiter.");
mc("z2", 7, "Warum darf der gemessene Wert nur etwa 2/3 des rechnerischen Höchstwertes betragen?", ["Wegen der Messgerätetoleranz", "Weil sich die Leitungen im Fehlerfall erwärmen und ihr Widerstand steigt", "Weil die Norm Gleichstrom vorschreibt", "Wegen des RCD"], 1, "Beim Messen sind die Leitungen kalt. Im Fehlerfall werden sie warm, R steigt (<b>Kaltleiter</b>).");
mc("z3", 7, "Was hilft, wenn die Schleifenimpedanz zu groß ist?", ["Eine längere Leitung", "Ein kleinerer Querschnitt", "Größerer Querschnitt, kürzere Leitung, B statt C oder ein RCD", "C statt B verwenden"], 2, "Kleineres Zs durch dickere/kürzere Leitungen, oder eine Schutzeinrichtung, die bei kleinerem Strom auslöst.");
mc("z4", 7, "Wie groß darf der Messwert von Zs bei einem LS C16 (230 V) höchstens sein?", ["0,48 Ω", "0,96 Ω", "1,44 Ω", "2,87 Ω"], 1, "Ia = 10 × 16 A = 160 A → Zs = 230 / 160 = 1,44 Ω → × 2/3 ≈ <b>0,96 Ω</b>.");
mc("z5", 7, "Wann wird die Schleifenimpedanz in der Veranstaltungstechnik gemessen?", ["Nie", "Bei der Übergabe des Speisepunktes und am Ende der eigenen Leitungen", "Nur bei Gewitter", "Nur einmal im Jahr"], 1, "Erst die Netzimpedanz der Spielstätte, dann am entferntesten Punkt der eigenen Verteilung.");
tf("z6", 7, "Je länger die Leitung, desto größer die Schleifenimpedanz.", true, "Richtig. Mehr Länge = mehr Widerstand = kleinerer Kurzschlussstrom.");
gap("z7", 7, "Kurzschlussstrom: Ik = U0 / ___", ["Zs", "Ia", "In", "R"], "Zs", "<span class='formula'>Ik = U0 / Zs</span>, U0 = 230 V.");
ty("z8", 7, "Wie heißt der Strom, der bei einem Kurzschluss fließt?", ["Kurzschlussstrom", "Ik"], "<b>Kurzschlussstrom Ik</b>.");
od("z9", 7, "Bringe den Weg des Fehlerstroms (TN-S) in die richtige Reihenfolge.", ["Transformator / Generator", "Außenleiter L mit LS", "Körperschluss im Gerät", "Schutzleiter PE", "Zurück zum Sternpunkt"], "Die Fehlerschleife: Quelle → L → Gehäuse → PE → Quelle. Alle Widerstände auf dem Weg ergeben Zs.");

mc("q1", 8, "Nach welcher Norm wird eine mobile Anlage vor der Inbetriebnahme geprüft?", ["DIN VDE 0100-600", "DIN VDE 0105-100", "DIN EN 50699", "DGUV V3"], 0, "<b>DIN VDE 0100-600</b> = Erstprüfung. In der Veranstaltungstechnik nach jedem Aufbau.");
mc("q2", 8, "In welcher Reihenfolge wird geprüft?", ["Messen – Erproben – Besichtigen", "Besichtigen – Erproben – Messen", "Erproben – Messen – Besichtigen", "Nur Messen"], 1, "Erst <b>schauen</b>, dann <b>probieren</b>, dann <b>messen</b> – und dokumentieren.");
mc("q3", 8, "Wie groß muss der Isolationswiderstand einer 230/400-V-Anlage mindestens sein?", ["0,5 MΩ", "1 MΩ", "2 MΩ", "10 MΩ"], 1, "Mindestens <b>1 MΩ</b>, gemessen mit 500 V DC.");

mc("q5", 8, "Welcher Richtwert gilt für die Prüfung ortsveränderlicher Geräte (DGUV V3)?", ["1 Monat", "6 Monate", "2 Jahre", "4 Jahre"], 1, "<b>6 Monate</b> (Baustelle 3 Monate). Bei Fehlerquote unter 2 % verlängerbar.");
mc("q6", 8, "Wie oft wird die Prüftaste eines RCD in nichtstationären Anlagen betätigt?", ["Arbeitstäglich", "Monatlich", "Halbjährlich", "Jährlich"], 0, "<b>Arbeitstäglich</b> – in festen Anlagen alle 6 Monate.");
mc("q7", 8, "Wie groß darf der Schutzleiterwiderstand eines Geräts mit bis zu 5 m Leitung sein?", ["0,1 Ω", "0,3 Ω", "1 Ω", "3 Ω"], 1, "<b>0,3 Ω</b> bis 5 m, + 0,1 Ω je weitere 7,5 m, max. 1 Ω.");
mc("q8", 8, "Welchen Isolationswiderstand muss ein Gerät der Schutzklasse II mindestens haben?", ["0,25 MΩ", "1 MΩ", "2 MΩ", "10 MΩ"], 2, "SK I ≥ 1 MΩ · <b>SK II ≥ 2 MΩ</b> · SK III ≥ 0,25 MΩ.");
mc("q9", 8, "Wie groß darf der Schutzleiterstrom eines Geräts der Schutzklasse I höchstens sein?", ["0,5 mA", "3,5 mA", "30 mA", "10 mA"], 1, "<b>3,5 mA</b>. Der Berührungsstrom bei SK II höchstens 0,5 mA.");
mc("q10", 8, "Welche Norm gilt für die Wiederholungsprüfung von Geräten?", ["DIN EN 50699 (VDE 0702)", "DIN EN 50678 (VDE 0701)", "DIN VDE 0100-600", "DIN VDE 0105-100"], 0, "50699 = Wiederholungsprüfung, 50678 = nach Reparatur.");
mc("q11", 8, "Wie lange darf ein normaler RCD bei IΔn höchstens bis zur Auslösung brauchen?", ["40 ms", "300 ms", "0,4 s", "5 s"], 1, "Höchstens <b>300 ms</b> (Typ S: 130–500 ms).");
mc("q12", 8, "Wer legt die Prüffristen fest?", ["Der Hersteller", "Der Unternehmer über die Gefährdungsbeurteilung", "Die IHK", "Der VDE"], 1, "Die DGUV V3 nennt Richtwerte, festgelegt werden sie in der <b>Gefährdungsbeurteilung</b> (BetrSichV).");
tf("q13", 8, "Eine EuP darf mit geeigneten Messgeräten unter Leitung und Aufsicht einer EFK prüfen.", true, "Richtig. Die Verantwortung bleibt bei der EFK.");
gap("q14", 8, "Der Isolationswiderstand einer Anlage muss mindestens ___ MΩ betragen.", ["1", "0,5", "2", "10"], "1", "≥ 1 MΩ bei 500 V DC.");

od("q17", 8, "Bringe den Ablauf der Erstprüfung in die richtige Reihenfolge.", ["Besichtigen", "Erproben", "Messen", "Dokumentieren"], "Erst ohne Spannung schauen, dann Funktionen probieren, dann messen, zum Schluss das Protokoll.");
mt("q18", 8, "Ordne die Norm ihrer Anwendung zu.", [["DIN VDE 0100-600", "Erstprüfung einer Anlage"], ["DIN VDE 0105-100", "Wiederkehrende Prüfung von Anlagen"], ["DIN EN 50678", "Gerät nach Reparatur"], ["DIN EN 50699", "Wiederholungsprüfung von Geräten"], ["DGUV Vorschrift 3", "Unfallverhütungsvorschrift Elektrik"]], "DGUV V3 sagt, <b>dass</b> geprüft wird. Die VDE-Normen sagen, <b>wie</b>.");

mc("l3", 9, "Welcher Spannungsfall wird höchstens empfohlen?", ["1 %", "3 %", "10 %", "15 %"], 1, "<b>3 %</b> vom Speisepunkt bis zum Verbraucher (max. 5 %).");
mc("l4", 9, "Welcher Reduktionsfaktor gilt ungefähr für eine Leitung mit 5 aufgewickelten Lagen?", ["0,8", "0,61", "0,38", "0,1"], 2, "Ca. <b>0,38</b> – die Leitung darf nur noch gut ein Drittel des Stroms führen.");

mc("l7", 9, "Welcher Querschnitt ist für einen CEE 32 A typisch?", ["1,5 mm²", "2,5 mm²", "6 mm²", "35 mm²"], 2, "Typisch <b>6 mm²</b> (kurze Strecken auch 4 mm²).");
mc("l8", 9, "Welche Länge setzt man in die einphasige Spannungsfall-Formel ein?", ["Die doppelte Länge", "Die einfache Leitungslänge – die 2 steht schon in der Formel", "Die halbe Länge", "Die Länge in km"], 1, "<span class='formula'>ΔU = (2 × l × I × cos φ) / (κ × A)</span> – die 2 berücksichtigt Hin- und Rückleiter.");

tf("l10", 9, "Kabeltrommeln müssen vor der Belastung vollständig abgerollt werden.", true, "Richtig. Aufgewickelt kann sich die Leitung nicht abkühlen und überhitzt.");
gap("l11", 9, "ΔU = (2 × l × I × cos φ) / (κ × ___)", ["A", "U", "R", "P"], "A", "A = Querschnitt in mm².");

mt("l15", 9, "Ordne Querschnitt und typische Absicherung zu.", [["2,5 mm²", "16 A"], ["6 mm²", "32 A"], ["16 mm²", "63 A"], ["35 mm²", "125 A"]], "Praxiswerte für H07RN-F, abgerollt, 30 °C. Genaue Werte: DIN VDE 0298-4.");

// 10 Lastverteilung
mc("v1", 10, "Warum verteilt man Lasten symmetrisch auf L1, L2 und L3?", ["Wegen der Optik", "Damit keine Phase überlastet wird, der N entlastet ist und die volle Leistung nutzbar ist", "Weil es billiger ist", "Wegen der Kabelfarben"], 1, "Gleich belastete Phasen = kein Außenleiter überlastet, Ströme heben sich im N auf.");
mc("v2", 10, "Was passiert im Neutralleiter bei vielen LED-Lasten?", ["Der Strom wird null", "Oberschwingungen 3. Ordnung addieren sich, der N kann stärker belastet sein als die Außenleiter", "Die Spannung steigt auf 400 V", "Nichts"], 1, "Deshalb wird der Neutralleiter <b>nie kleiner</b> gewählt als die Außenleiter.");

mc("v5", 10, "Was ist der Gleichzeitigkeitsfaktor?", ["Ein Faktor dafür, dass nicht alle Verbraucher gleichzeitig unter Volllast laufen", "Der cos φ", "Der Reduktionsfaktor der Kabeltrommel", "Die Frequenz"], 0, "Er senkt den berechneten Bedarf, wenn nicht alles gleichzeitig voll läuft (z. B. Endstufen).");
mc("v6", 10, "Warum legt man den Ton auf einen eigenen Außenleiter?", ["Um Störungen durch Dimmer und Licht zu vermeiden", "Weil es Vorschrift ist", "Für mehr Leistung", "Wegen der Kosten"], 0, "Getrennte Phasen reduzieren Brummen und Störgeräusche aus der Lichttechnik.");
tf("v7", 10, "Bei gleicher ohmscher Last auf L1, L2 und L3 ist der Neutralleiterstrom nahezu null.", true, "Richtig. Die drei um 120° verschobenen Ströme heben sich im N auf.");
tf("v8", 10, "Bei LED-Lasten darf der Neutralleiter kleiner gewählt werden.", false, "Falsch. Oberschwingungen addieren sich im N – er kann sogar stärker belastet sein.");
gap("v9", 10, "Strom pro Außenleiter = P pro Außenleiter / ___ V", ["230", "400", "325", "50"], "230", "Jede Phase gegen N hat 230 V.");
od("v10", 10, "Bringe die Schritte der Strombedarfsermittlung in die richtige Reihenfolge.", ["Verbraucherliste mit Leistungen erstellen", "Gleichzeitigkeitsfaktor und cos φ berücksichtigen", "Reserve einplanen (ca. 20 %)", "Strom pro Außenleiter berechnen", "Anschluss wählen (CEE 16/32/63/125 A)"], "Erst sammeln, dann realistisch machen, Reserve dazu, rechnen – und zum Schluss den Anschluss wählen.");
ty("v11", 10, "Wie nennt man eine ungleiche Belastung der drei Außenleiter?", ["Schieflast", "unsymmetrische Last", "Unsymmetrie"], "<b>Schieflast</b> – schadet vor allem Stromerzeugern.");

mc("d3", 11, "Wie groß ist der Leiterstrom in der Dreieckschaltung?", ["I = IStr", "I = √3 × IStr", "I = IStr / √3", "I = 3 × IStr"], 1, "Im Dreieck teilen sich zwei Stränge einen Außenleiter: <span class='formula'>I = √3 × IStr</span>");

mc("d5", 11, "Wozu dient der Stern-Dreieck-Anlauf?", ["Den Anlaufstrom zu verringern", "Die Drehrichtung zu ändern", "Die Frequenz zu ändern", "Den Neutralleiter zu sparen"], 0, "Im Stern anlaufen (ca. 1/3 des Stroms), dann auf Dreieck umschalten.");
mc("d6", 11, "Was passiert bei Unterbrechung des Neutralleiters in einer Sternschaltung mit ungleicher Last?", ["Nichts", "Der Sternpunkt verschiebt sich, manche Geräte bekommen fast 400 V", "Alle Geräte gehen aus", "Der RCD löst immer aus"], 1, "<b>Sternpunktverschiebung</b> – Geräte können zerstört werden. Den N nie einzeln absichern.");

// ---------- Calculation generators ----------
const pick = a => a[Math.floor(Math.random() * a.length)];
const de = (x, d = 2) => Number(x).toLocaleString("de-DE", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const CALC = [
  { id: "c_ohm", t: 1, gen() { const R = pick([23, 46, 26.5, 57.5, 115]); const I = 230 / R; return { q: `Ein Heizlüfter mit R = ${de(R)} Ω wird an 230 V betrieben. Wie groß ist der Strom?`, a: I, unit: "A", ex: `<span class='formula'>I = U / R = 230 V / ${de(R)} Ω = ${de(I)} A</span>` }; } },
  { id: "c_power", t: 1, gen() { const n = pick([4, 6, 8, 10, 12]); const P = pick([300, 500, 575, 650]); const I = n * P / 230; return { q: `${n} Scheinwerfer mit je ${P} W hängen an einem 230-V-Stromkreis. Wie groß ist der Gesamtstrom?`, a: I, unit: "A", ex: `<span class='formula'>P = ${n} × ${P} W = ${n * P} W → I = P / U = ${n * P} W / 230 V = ${de(I)} A</span>` }; } },
  { id: "c_energy", t: 1, gen() { const P = pick([1.5, 2, 3, 4.5, 6]); const h = pick([3, 4, 5, 8]); return { q: `Eine Lichtanlage nimmt ${de(P)} kW auf und läuft ${h} Stunden. Wie viel Energie wird verbraucht?`, a: P * h, unit: "kWh", ex: `<span class='formula'>W = P × t = ${de(P)} kW × ${h} h = ${de(P * h)} kWh</span>` }; } },
  { id: "c_ueff", t: 2, gen() { const U = pick([12, 24, 48, 230, 400]); const Uh = U * Math.SQRT2; return { q: `Das Oszilloskop zeigt einen Scheitelwert von ${de(Uh, 1)} V. Welchen Effektivwert zeigt das Multimeter?`, a: U, unit: "V", ex: `<span class='formula'>U = Û / √2 = ${de(Uh, 1)} V / 1,414 ≈ ${de(U)} V</span>` }; } },

  { id: "c_series", t: 4, gen() { const R1 = pick([4, 6, 10, 20]); const R2 = pick([8, 12, 30, 40]); const U = pick([12, 24, 48]); const I = U / (R1 + R2); return { q: `R1 = ${R1} Ω und R2 = ${R2} Ω sind in Reihe an ${U} V geschaltet. Wie groß ist der Strom?`, a: I, unit: "A", ex: `<span class='formula'>Rges = ${R1} + ${R2} = ${R1 + R2} Ω → I = ${U} V / ${R1 + R2} Ω = ${de(I)} A</span>. Der Strom ist überall gleich.` }; } },
  { id: "c_parallel", t: 4, gen() { const R1 = pick([6, 12, 20, 30, 60]); const R2 = pick([3, 6, 12, 20, 40]); const R = R1 * R2 / (R1 + R2); return { q: `R1 = ${R1} Ω und R2 = ${R2} Ω sind parallel geschaltet. Wie groß ist der Ersatzwiderstand?`, a: R, unit: "Ω", ex: `<span class='formula'>R = (R1 × R2) / (R1 + R2) = (${R1} × ${R2}) / (${R1} + ${R2}) = ${de(R)} Ω</span> – kleiner als der kleinste Einzelwiderstand.` }; } },
  { id: "c_knoten", t: 4, gen() { const a = pick([3, 4, 5, 6]), b = pick([2, 5, 7, 8]), c = pick([1, 3, 4, 6]); return { q: `Ein Unterverteiler hat drei Abgänge mit ${a} A, ${b} A und ${c} A. Welcher Strom fließt in der Zuleitung?`, a: a + b + c, unit: "A", ex: `Knotenpunktregel: <span class='formula'>I = ${a} + ${b} + ${c} = ${a + b + c} A</span>` }; } },
  { id: "c_body", t: 5, gen() { const U = pick([50, 120, 230, 400]); const I = U / 1000 * 1000; return { q: `Eine Person (Körperwiderstand 1000 Ω) berührt ${U} V. Wie groß ist der Körperstrom in mA?`, a: I, unit: "mA", ex: `<span class='formula'>I = U / R = ${U} V / 1000 Ω = ${de(U / 1000, 3)} A = ${de(I)} mA</span>${I >= 50 ? " – Lebensgefahr (ab ca. 50 mA)." : "."}` }; } },
  { id: "c_ik", t: 7, gen() { const Z = pick([0.4, 0.6, 0.8, 1.15, 1.5, 2.3]); return { q: `Gemessene Schleifenimpedanz Zs = ${de(Z)} Ω bei U0 = 230 V. Wie groß ist der Kurzschlussstrom Ik?`, a: 230 / Z, unit: "A", ex: `<span class='formula'>Ik = U0 / Zs = 230 V / ${de(Z)} Ω = ${de(230 / Z, 0)} A</span>` }; } },
  { id: "c_zsmax", t: 7, gen() { const ch = pick(["B", "C"]); const In = pick([16, 20, 32]); const k = ch === "B" ? 5 : 10; const Z = 230 / (k * In); return { q: `Wie groß darf die Schleifenimpedanz für einen LS ${ch}${In} rechnerisch höchstens sein (U0 = 230 V)?`, a: Z, unit: "Ω", ex: `${ch}: sofortige Auslösung bei ${k} × In = ${k * In} A. <span class='formula'>Zs ≤ 230 V / ${k * In} A = ${de(Z)} Ω</span>. Gemessen höchstens ⅔ davon ≈ ${de(Z * 2 / 3)} Ω.` }; } },
  { id: "c_du", t: 9, gen() { const l = pick([20, 30, 40, 50]); const I = pick([10, 16]); const A = pick([1.5, 2.5, 4]); const dU = 2 * l * I / (56 * A); const pct = dU / 230 * 100; return { q: `${l} m H07RN-F 3G${de(A)}, 230 V, I = ${I} A, cos φ = 1. Wie groß ist der Spannungsfall in Prozent?`, a: pct, unit: "%", ex: `<span class='formula'>ΔU = (2 × ${l} × ${I}) / (56 × ${de(A)}) = ${de(dU)} V</span> → <span class='formula'>${de(dU)} / 230 × 100 = ${de(pct)} %</span> ${pct > 3 ? "→ über 3 %: Querschnitt erhöhen." : "→ unter 3 %: in Ordnung."}` }; } },
  { id: "c_amin", t: 9, gen() { const l = pick([40, 50, 60, 80]); const I = pick([16, 20]); const dU = 6.9; const A = 2 * l * I / (56 * dU); return { q: `Welcher Querschnitt ist rechnerisch mindestens nötig? ${l} m, 230 V, ${I} A, cos φ = 1, max. 3 % (6,9 V).`, a: A, unit: "mm²", ex: `<span class='formula'>A = (2 × ${l} × ${I}) / (56 × 6,9) = ${de(A)} mm²</span> → nächster Normquerschnitt: ${A <= 1.5 ? "1,5" : A <= 2.5 ? "2,5" : A <= 4 ? "4" : A <= 6 ? "6" : A <= 10 ? "10" : "16"} mm².` }; } },
  { id: "c_drum", t: 9, gen() { const Iz = pick([20, 25, 32]); const f = pick([[1, 0.8], [2, 0.61], [3, 0.49], [5, 0.38]]); return { q: `Eine Leitung darf abgerollt ${Iz} A führen. Sie liegt mit ${f[0]} ${f[0] === 1 ? "Lage" : "Lagen"} auf der Trommel (Faktor ${de(f[1])}). Welcher Strom ist noch zulässig?`, a: Iz * f[1], unit: "A", ex: `<span class='formula'>Iz = ${Iz} A × ${de(f[1])} = ${de(Iz * f[1], 1)} A</span> – deshalb Trommeln immer ganz abrollen.` }; } },
  { id: "c_phase", t: 10, gen() { const P = pick([9000, 13800, 16500, 20700]); const I = P / 3 / 230; return { q: `Eine Gesamtlast von ${de(P, 0)} W wird symmetrisch auf L1, L2 und L3 verteilt. Wie groß ist der Strom pro Außenleiter?`, a: I, unit: "A", ex: `<span class='formula'>${de(P, 0)} W / 3 = ${de(P / 3, 0)} W pro Phase → I = ${de(P / 3, 0)} W / 230 V = ${de(I, 1)} A</span> ${I <= 16 ? "→ CEE 16 A reicht." : I <= 32 ? "→ CEE 32 A nötig." : "→ CEE 63 A nötig."}` }; } },
  { id: "c_star", t: 11, gen() { const R = pick([23, 46, 92]); const P = 3 * 230 * 230 / R; return { q: `Drei Heizwiderstände mit je ${R} Ω sind im Stern an 400 V geschaltet. Wie groß ist die Gesamtleistung?`, a: P, unit: "W", ex: `<span class='formula'>UStr = 230 V → IStr = 230 / ${R} = ${de(230 / R)} A → P = 3 × 230 V × ${de(230 / R)} A = ${de(P, 0)} W</span>` }; } },
  { id: "c_delta", t: 11, gen() { const R = pick([46, 92, 115]); const Is = 400 / R; const P = 3 * 400 * Is; return { q: `Drei Widerstände mit je ${R} Ω sind im Dreieck an 400 V geschaltet. Wie groß ist der Leiterstrom?`, a: Math.sqrt(3) * Is, unit: "A", ex: `<span class='formula'>IStr = 400 V / ${R} Ω = ${de(Is)} A → I = √3 × IStr = ${de(Math.sqrt(3) * Is)} A</span> (P ≈ ${de(P, 0)} W).` }; } }

mc("x1", 6, "Welchen Querschnitt muss eine Schutzpotenzialausgleichsleitung in der Veranstaltungstechnik mindestens haben?", ["4 mm²", "6 mm²", "10 mm²", "16 mm²"], 3, "Mindestens <b>16 mm² Kupfer</b>, H07RN-F, grün-gelb (IHK S2021 U6, S2024 U6, W2025 U5).");

mc("x3", 6, "Was bedeutet „Durchschliff“ an einem CEE-Ausgang einer Unterverteilung?", ["Der Ausgang hat eine eigene RCD", "Eingang und Ausgang sind direkt verbunden – ohne RCD und MCB in der UV", "Der Ausgang ist nur für 230 V", "Der Ausgang ist abgeschaltet"], 1, "Durchgeschliffen = ohne Schutzeinrichtung. Der LS des <b>Übergabepunkts</b> schützt diesen Ausgang (IHK W2025 U1).");
mc("x4", 6, "Warum ist bei vielen Scheinwerfern eine RCD je Phase bzw. RCBO je Stromkreis besser als eine gemeinsame RCD?", ["Es ist billiger", "Die Ableitströme verteilen sich, die Summe löst die RCD nicht aus", "Weil die RCD sonst zu langsam ist", "Wegen des Spannungsfalls"], 1, "Beispiel W2025: 32 × 0,6 mA + 4 × 3 mA = 31,2 mA > 30 mA an <b>einer</b> RCD → Auslösung. Verteilt auf drei RCDs kein Problem.");
mc("x5", 6, "Eine RCD hat IΔn = 0,3 A, Typ B, S. Ist sie für den Personenschutz zugelassen?", ["Ja, Typ B ist immer zugelassen", "Nein – für Personenschutz ist IΔn ≤ 30 mA nötig", "Ja, wegen S = selektiv", "Nur im Freien"], 1, "300 mA = Brandschutz/selektive Vorschaltung. Personen- bzw. Zusatzschutz: <b>≤ 30 mA</b>.");
mc("x6", 3, "Ein ungeerdeter Stromerzeuger versorgt mehrere Verbraucher. Was fordert die DGUV-I 203-032?", ["Nichts, ungeerdet ist immer sicher", "Jedes Verbrauchsmittel bis auf eines bekommt eine RCD ≤ 30 mA", "Eine gemeinsame RCD 300 mA", "Nur einen Erder"], 1, "RCD für das zweite und jedes weitere Verbrauchsmittel – im Erzeuger oder in einem Verteiler mit einer RCD je Steckdose (IHK W2022).");
mc("x7", 9, "Darf eine CEE16-Einspeisung über einen Adapter auf einen CEE32-Eingang gehen?", ["Nein, nie", "Ja – Aufwärtsadaptierung: größerer Querschnitt, der 16-A-Schutz davor schützt", "Nur mit zusätzlicher 32-A-Sicherung", "Nur bei 230 V"], 1, "Aufwärtsadaptierung = Querschnitt wird größer → <b>keine zusätzliche Absicherung</b> (IHK S2021 U5). Abwärts (CEE32 → CEE16) braucht eine Absicherung!");
mc("x8", 7, "Ein Kurzschluss erzeugt Ik = 300 A. Welcher LS löst sicher <b>nicht</b> unverzögert aus?", ["B32 (5 × 32 = 160 A)", "C10 (10 × 10 = 100 A)", "C32 (10 × 32 = 320 A)", "B16 (5 × 16 = 80 A)"], 2, "Unverzögert sicher ab B: 5 × In, C: 10 × In. C32 → 320 A > 300 A → keine sichere Sofortauslösung. So erreicht man Selektivität (IHK S2024 U2).");
mc("x9", 8, "Gemessene Auslöseströme einer 30-mA-RCD: Welcher Wert ist in Ordnung?", ["11 mA", "24 mA", "45 mA", "60 mA"], 1, "Eine RCD muss zwischen <b>0,5 × und 1 × IΔn</b> auslösen, also 15–30 mA (IHK W2021 U5).");
mc("x10", 8, "Bei einer Schleifenimpedanzmessung zeigt das Gerät L–PE 123 V, N–PE 115 V, L–N 235 V. Was liegt vor?", ["Alles in Ordnung", "N-Leiter vertauscht", "Schutzleiter unterbrochen", "Kurzschluss"], 2, "L–PE müsste ~230 V und N–PE ~0 V sein. Beide etwa halb → PE „schwebt“ → <b>PE unterbrochen</b>.");
mc("x11", 8, "Was gehört zur Inbetriebnahme eines Übergabepunkts mit Einzeladern (Powerlock)?", ["Zuerst L1 stecken", "Reihenfolge PE → N → L1–L3, Trennen umgekehrt, lastfrei", "Unter Last stecken", "N zuletzt stecken"], 1, "Erst PE, dann N, dann die Außenleiter – nur lastfrei. Beim Trennen umgekehrt.");
mc("x12", 10, "Ein Stromerzeuger soll dauerhaft 7,5 kW liefern. Typ I: Dauer 4,8 kW / max. 5,3 kW · Typ II: Dauer 8,0 kW / max. 8,8 kW. Welcher passt?", ["Typ I", "Typ II", "Beide", "Keiner"], 1, "Immer die <b>Dauerleistung</b> ansetzen: 8,0 kW ≥ 7,5 kW → Typ II (IHK W2022 U1).");
