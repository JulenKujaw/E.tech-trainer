<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e151e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="E-Tech">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>E-Tech Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centred column (max 760px) — header with tabs, then the active view (inicio · sesión · fallos). Detail from the subject: PE green-yellow stripe for progress, CEE blue/red for the two voltage worlds. */
:root {
  --bg: #f1f4f8;
  --surface: #ffffff;
  --surface-2: #e8edf3;
  --ink: #152130;
  --muted: #586678;
  --line: #d4dbe4;
  --accent: #1c5dcc;
  --accent-soft: #e2ebfb;
  --on-accent: #ffffff;
  --red: #c4362c;
  --red-soft: #fbe7e5;
  --good: #1d7f47;
  --good-soft: #e1f3e8;
  --warn: #a96a00;
  --pe-green: #2f9a43;
  --pe-yellow: #e2c200;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151e; --surface: #16202c; --surface-2: #1d2937; --ink: #e4eaf2; --muted: #95a3b4; --line: #2b3847;
    --accent: #6a9cf2; --accent-soft: #1c2c47; --on-accent: #0e151e; --red: #ef7266; --red-soft: #3a1f1d;
    --good: #55c487; --good-soft: #17322a; --warn: #e3a43a; --pe-green: #3fb457; --pe-yellow: #d8bb12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151e; --surface: #16202c; --surface-2: #1d2937; --ink: #e4eaf2; --muted: #95a3b4; --line: #2b3847;
  --accent: #6a9cf2; --accent-soft: #1c2c47; --on-accent: #0e151e; --red: #ef7266; --red-soft: #3a1f1d;
  --good: #55c487; --good-soft: #17322a; --warn: #e3a43a; --pe-green: #3fb457; --pe-yellow: #d8bb12; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 14px 10px; border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.01em; margin: 0; line-height: 1; text-wrap: balance; }
.brand .tag { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
nav.tabs button { border: 0; background: transparent; color: var(--muted); font: 500 14px var(--font-body); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
nav.tabs .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--red); color: #fff; font-size: 12px; line-height: 20px; text-align: center; }
button:focus-visible, input:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; line-height: 1.15; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0; line-height: 1.2; }
p { margin: 0; }
.muted { color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.stat.alert b { color: var(--red); }

.section { display: grid; gap: 12px; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mode {
  text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--radius);
  padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; font: inherit; position: relative; overflow: hidden;
}
.mode:hover:not(:disabled) { border-color: var(--accent); }
.mode:disabled { opacity: 0.45; cursor: default; }
.mode .code { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent); }
.mode strong { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.15; }
.mode small { color: var(--muted); font-size: 13px; line-height: 1.4; }
.mode.wide { grid-column: 1 / -1; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.mode.wide .code, .mode.wide small { color: var(--on-accent); opacity: 0.85; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px;
  font: 500 13px var(--font-body); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 16px;
  font: 600 14px var(--font-body); cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn:disabled { opacity: 0.45; cursor: default; }
.lenpick { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }

/* Session */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.prog { display: grid; gap: 6px; }
.prog .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.prog .fill { height: 100%; background: repeating-linear-gradient(135deg, var(--pe-green) 0 8px, var(--pe-yellow) 8px 16px); transition: width .3s ease; }
.prog .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qtopic { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted); text-transform: uppercase; }
.pill.type { background: var(--accent-soft); color: var(--accent); }
.question { font-size: 18px; font-weight: 500; line-height: 1.45; }
.opts { display: grid; gap: 8px; }
.opt {
  text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px;
  padding: 11px 14px; font: inherit; cursor: pointer; display: flex; gap: 10px; align-items: flex-start;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; min-width: 14px; }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt:disabled { cursor: default; }
.gaptext { font-size: 18px; line-height: 1.9; }
.blank { display: inline-block; min-width: 90px; border-bottom: 2px solid var(--accent); text-align: center; font-weight: 600; padding: 0 6px; color: var(--accent); }
.blank.ok { color: var(--good); border-color: var(--good); }
.blank.bad { color: var(--red); border-color: var(--red); }
.answer-row { display: flex; gap: 8px; flex-wrap: wrap; }
.answer-row input {
  flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px;
  padding: 10px 12px; font: 500 16px var(--font-body);
}
.answer-row .unit { align-self: center; font-family: var(--font-mono); color: var(--muted); }
.formula { font-family: var(--font-mono); font-size: 14px; background: var(--surface-2); border-radius: 6px; padding: 2px 6px; }

.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.match .col { display: grid; gap: 8px; align-content: start; }
.mitem {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 11px; font: inherit;
  text-align: left; cursor: pointer; font-size: 14px; line-height: 1.35; display: flex; gap: 8px; align-items: flex-start;
}
.mitem .tagn { font-family: var(--font-mono); font-size: 11px; min-width: 18px; height: 18px; border-radius: 4px; display: inline-grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.mitem.sel { border-color: var(--accent); background: var(--accent-soft); }
.mitem.paired .tagn { background: var(--ink); color: var(--bg); }
.mitem.ok { border-color: var(--good); background: var(--good-soft); }
.mitem.bad { border-color: var(--red); background: var(--red-soft); }

.order { display: grid; gap: 14px; }
.slots { display: grid; gap: 6px; min-height: 48px; border: 1px dashed var(--line); border-radius: 10px; padding: 8px; }
.slots .ph { color: var(--muted); font-size: 13px; padding: 6px; }
.oitem { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 12px; font: inherit; text-align: left; cursor: pointer; display: flex; gap: 10px; }
.oitem .n { font-family: var(--font-mono); color: var(--accent); min-width: 18px; }
.oitem.ok { border-color: var(--good); background: var(--good-soft); }
.oitem.bad { border-color: var(--red); background: var(--red-soft); }

.flash { border: 1px solid var(--line); border-radius: 12px; padding: 22px; background: var(--surface-2); display: grid; gap: 10px; min-height: 140px; align-content: center; }
.flash .back { border-top: 1px solid var(--line); padding-top: 12px; font-weight: 600; font-size: 18px; }

.feedback { border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; border: 1px solid; }
.feedback.ok { background: var(--good-soft); border-color: var(--good); }
.feedback.bad { background: var(--red-soft); border-color: var(--red); }
.feedback .verdict { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.feedback.ok .verdict { color: var(--good); }
.feedback.bad .verdict { color: var(--red); }
.feedback .sol { font-size: 14px; }
.feedback .ex { font-size: 14px; line-height: 1.55; }
.feedback .ex b { font-weight: 600; }

.result-score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.result-score b { font-family: var(--font-display); font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; }
.list { display: grid; gap: 8px; }
.li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; background: var(--surface); }
.li .t { font-size: 12px; color: var(--muted); }
.topics { display: grid; gap: 10px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 52px; gap: 10px; align-items: center; font-size: 14px; }
.trow .tb { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.trow .tb i { display: block; height: 100%; border-radius: 999px; }
.trow .pct { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 13px; }
.advice { border-left: 3px solid var(--warn); background: var(--surface); border-radius: 0 10px 10px 0; padding: 12px 14px; display: grid; gap: 6px; }
.advice.calm { border-left-color: var(--good); }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.savestate { font-size: 12px; color: var(--muted); }

@media (max-width: 560px) {
  .modes { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat b { font-size: 22px; }
  .match { grid-template-columns: minmax(0, 1fr); }
  .trow { grid-template-columns: minmax(0, 1fr) 70px 44px; }
  .card { padding: 16px; }
  .question, .gaptext { font-size: 17px; }
}
@media (max-width: 640px) {
  header.top { position: static; padding-block: 12px 8px; }
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; border-radius: 0; gap: 6px;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  }
  nav.tabs button { padding: 11px 6px; font-size: 15px; border-radius: 10px; }
  nav.tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
  body { padding-block: 0 calc(88px + env(safe-area-inset-bottom, 0px)); }
  .opt { padding: 14px; min-height: 52px; }
  .chip { padding: 8px 14px; font-size: 14px; }
  .mitem, .oitem { padding: 12px; min-height: 48px; }
  .btn { padding: 12px 18px; font-size: 15px; }
  #nextBtn, #mCheck, #oCheck, #fYes, #flip { flex: 1 1 auto; }
  .answer-row .btn { flex: 1 1 100%; }
  .feedback + .row { position: sticky; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .prog .fill { transition: none; } }

/* --- Erweiterungen: Header-Aktionen, Prüfungen, Karteikarten, Editor --- */
.top-actions { display: flex; gap: 6px; align-items: center; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; height: 34px; min-width: 34px; padding: 0 10px; font: 600 13px var(--font-body); cursor: pointer; font-variant-numeric: tabular-nums; }
.iconbtn.run { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.iconbtn.run.brk { background: var(--good); border-color: var(--good); }
.pomo-big { font-family: var(--font-mono); font-size: 34px; font-weight: 500; font-variant-numeric: tabular-nums; }
.pomo-card { gap: 10px; }
.exam-cta { grid-column: 1 / -1; border-left: 4px solid var(--pe-green); }
.badge-lv { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge-lv.ok { background: var(--good-soft); color: var(--good); }
.badge-lv.own { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.exam-item { gap: 12px; }
.task { gap: 12px; }
.tq { font-size: 16px; line-height: 1.6; }
.scen { gap: 8px; font-size: 15px; line-height: 1.6; background: var(--surface-2); }
.ta, .inp { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 10px 12px; font: 15px/1.5 var(--font-body); }
.ta { resize: vertical; min-height: 84px; }
select.inp { padding: 9px 10px; }
.solution { display: grid; gap: 10px; border-top: 1px dashed var(--line); padding-top: 12px; }
.solbody { font-size: 15px; line-height: 1.65; }
.warn { border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 13px; font-weight: 600; }
.okmark { font-size: 13px; color: var(--good); font-weight: 600; }
.rate { display: grid; gap: 6px; }
.linkbtn { border: 0; background: none; color: var(--accent); font: 600 14px var(--font-body); padding: 4px 0; cursor: pointer; text-align: left; }
.linkbtn.danger { color: var(--red); }
.timerbar { position: sticky; top: 70px; z-index: 4; display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--accent); color: var(--on-accent); padding: 10px 16px; border-radius: 12px; }
.timerbar b { font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.timerbar .btn { background: var(--on-accent); color: var(--accent); border-color: var(--on-accent); }
.li.dim { opacity: 0.55; }
.editor-form { gap: 12px; }
.editor-form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.optset { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; margin: 0; }
.optset legend { font-size: 13px; color: var(--muted); font-weight: 600; padding: 0 4px; }
/* Karteikarte zum Umdrehen */
.flip { border: 0; padding: 0; background: none; width: 100%; perspective: 1200px; cursor: pointer; font: inherit; color: inherit; text-align: left; }
.flip-inner { position: relative; display: grid; transition: transform .5s ease; transform-style: preserve-3d; min-height: 190px; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; display: grid; gap: 10px; align-content: center; padding: 22px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: var(--accent); }
.backans { font-weight: 600; font-size: 18px; white-space: pre-line; }
@media (prefers-reduced-motion: reduce) { .flip-inner { transition: none; } }
@media (max-width: 640px) {
  nav.tabs { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; gap: 2px !important; padding-left: 6px !important; padding-right: 6px !important; }
  nav.tabs button { font-size: 12.5px !important; padding: 10px 2px !important; }
  nav.tabs .badge { margin-left: 2px; min-width: 16px; padding: 0 4px; line-height: 16px; font-size: 11px; }
  .timerbar { top: 6px; }
  .brand .tag { display: none; }
}
/* Lernen */
.learn-cta { border-left-color: var(--accent); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 600 13px var(--font-body); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.lfig { margin: 0; display: grid; gap: 6px; }
.lfig img { width: 100%; height: auto; border-radius: 12px; background: #fff; border: 1px solid var(--line); padding: 6px; }
.lfig figcaption { font-size: 13px; color: var(--muted); }
.lern { display: block; font-size: 15px; line-height: 1.65; overflow-wrap: anywhere; }
.lern > * + * { margin-top: 12px; }
.lern h4 { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin: 20px 0 4px; }
.lern p { margin: 0; }
.lern ul, .lern ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.lern table { display: block; width: 100%; overflow-x: auto; border-collapse: collapse; font-size: 14px; }
.lern th, .lern td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; min-width: 90px; }
.lern th { background: var(--surface-2); }
.lern em { color: var(--muted); }
.tabs .sh { display: none; }
@media (max-width: 640px) {
  nav.tabs { grid-template-columns: repeat(6, minmax(0, 1fr)) !important; }
  nav.tabs button { font-size: 12px !important; }
  .tabs .lg { display: none; } .tabs .sh { display: inline; }
}

</style>
<script>try{var t=localStorage.getItem("etech-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>

<script>
const LERN = {"de": {"1": "<p><em>Buch: 7.2 Grundbegriffe der Elektrotechnik (S. 191–204).</em></p>\n<p>Mit fünf Grundgrößen und zwei Formeln (Ohmsches Gesetz und Leistungsformel) lassen sich fast alle Rechenaufgaben der Prüfung lösen.</p>\n<table>\n\n<thead>\n<tr>\n<th>Größe</th>\n<th>Formelzeichen</th>\n<th>Einheit</th>\n<th>Erklärung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Spannung</strong></td>\n<td>U</td>\n<td>Volt (V)</td>\n<td>Potenzialunterschied zwischen zwei Punkten; „Druck“, der die Elektronen antreibt</td>\n</tr>\n<tr>\n<td><strong>Strom (Stromstärke)</strong></td>\n<td>I</td>\n<td>Ampere (A)</td>\n<td>Ladungsmenge, die pro Sekunde durch einen Leiter fließt</td>\n</tr>\n<tr>\n<td><strong>Widerstand</strong></td>\n<td>R</td>\n<td>Ohm (Ω)</td>\n<td>Hemmung des Stromflusses durch das Material</td>\n</tr>\n<tr>\n<td><strong>Leistung</strong></td>\n<td>P</td>\n<td>Watt (W)</td>\n<td>Pro Sekunde umgesetzte Energie</td>\n</tr>\n<tr>\n<td><strong>Arbeit (Energie)</strong></td>\n<td>W</td>\n<td>Wattsekunde (Ws), kWh</td>\n<td>Leistung × Zeit; das, was der Zähler misst</td>\n</tr>\n</tbody>\n</table>\n<h4>a) Spannung</h4>\n<ul>\n<li><p>Strom fließt nur, wenn Spannung anliegt <strong>und</strong> der Stromkreis geschlossen ist.</p></li>\n<li><p>Messung mit dem <strong>Spannungsmesser parallel</strong> zum Verbraucher.</p></li>\n<li><p>Typische Werte in der Veranstaltungstechnik: 230 V (Außenleiter–N), 400 V (Außenleiter–Außenleiter), 12/24 V (LED, SELV).</p></li>\n</ul>\n<h4>b) Strom</h4>\n<ul>\n<li><p><strong>Technische Stromrichtung</strong>: von + nach −; die Elektronen fließen entgegengesetzt (<strong>Elektronenstromrichtung</strong>).</p></li>\n<li><p>Messung mit dem <strong>Strommesser in Reihe</strong> oder ohne Auftrennen des Stromkreises mit der <strong>Stromzange</strong>.</p></li>\n<li><p>Der Strom erwärmt die Leitungen und löst die Schutzeinrichtungen aus.</p></li>\n</ul>\n<h4>c) Widerstand</h4>\n<p>Der Widerstand einer Leitung steigt mit der Länge und sinkt mit dem Querschnitt:</p>\n<p><strong>R = l / (κ × A) = (ρ × l) / A</strong></p>\n<p>l = Leitungslänge in m, A = Querschnitt in mm², κ = <strong>elektrische Leitfähigkeit</strong> (Kupfer ≈ 56 m/(Ω·mm²)), ρ = <strong>spezifischer Widerstand</strong> (Kupfer ≈ 0,0178 Ω·mm²/m). <strong>Leitwert</strong> G = 1/R in Siemens (S). Bei Metallen steigt der Widerstand mit der Temperatur.</p>\n<h4>d) Leistung</h4>\n<p><strong>P = U × I = I² × R = U² / R</strong></p>\n<p>Bei Wechselstrom mit induktiven Lasten gilt P = U × I × cos φ (siehe Punkt 2).</p>\n<h4>e) Arbeit</h4>\n<p><strong>W = P × t</strong></p>\n<p>Beispiel: 8 LED-Scheinwerfer mit je 250 W laufen 6 h → W = 2 kW × 6 h = 12 kWh.</p>\n<h4>f) Ohmsches Gesetz</h4>\n<p><strong>U = R × I · I = U / R · R = U / I</strong></p>\n<p>Merkhilfe: Im Dreieck steht U oben, R und I unten; die gesuchte Größe abdecken.</p>\n<p>Beispiel: Heizlüfter mit R = 26,5 Ω an 230 V → I = 230 V / 26,5 Ω ≈ 8,7 A → P = 230 V × 8,7 A ≈ 2000 W.</p>", "2": "<p><em>Buch: 7.2.1 Elektrische Spannung und 7.7 Wechselstromtechnik (S. 191, 238–247).</em></p>\n<p>Gleichspannung hat einen konstanten Wert und eine feste Polarität; Wechselspannung ändert 50-mal pro Sekunde ihre Richtung. Das Netz liefert Wechselspannung, die meiste Elektronik (LED, Prozessoren) arbeitet intern mit Gleichspannung.</p>\n<table>\n\n<thead>\n<tr>\n<th></th>\n<th><strong>Gleichspannung (DC)</strong></th>\n<th><strong>Wechselspannung (AC)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Verhalten</td>\n<td>Wert und Polarität konstant</td>\n<td>Wert und Polarität ändern sich periodisch (Sinus)</td>\n</tr>\n<tr>\n<td>Kennzeichen</td>\n<td>= oder DC</td>\n<td>~ oder AC</td>\n</tr>\n<tr>\n<td>Quellen</td>\n<td>Batterie, Akku, <strong>Netzteil</strong>, Solarmodul</td>\n<td>Öffentliches Netz, <strong>Stromerzeuger</strong>, Transformator</td>\n</tr>\n<tr>\n<td>Veranstaltungstechnik</td>\n<td>Akkus von Funkmikrofonen, LED-Strips 12/24 V, Netzteile der LED-Scheinwerfer</td>\n<td>Gesamte Energieverteilung: 230 V / 400 V, 50 Hz</td>\n</tr>\n<tr>\n<td>Grenze Kleinspannung</td>\n<td>120 V DC</td>\n<td>50 V AC</td>\n</tr>\n</tbody>\n</table>\n<p>Zusätzlich gibt es die <strong>Mischspannung</strong>: Gleichspannung mit überlagertem Wechselanteil (z. B. hinter einem Gleichrichter). Wichtig für die RCD-Typen (Punkt 6g).</p>\n<h4>Kenngrößen der Wechselspannung</h4>\n<table>\n\n<thead>\n<tr>\n<th>Größe</th>\n<th>Bedeutung</th>\n<th>Netz in Deutschland</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Frequenz</strong> f</td>\n<td>Schwingungen pro Sekunde (Hz)</td>\n<td>50 Hz</td>\n</tr>\n<tr>\n<td><strong>Periodendauer</strong> T = 1/f</td>\n<td>Dauer einer Schwingung</td>\n<td>20 ms</td>\n</tr>\n<tr>\n<td><strong>Scheitelwert</strong> Û</td>\n<td>Höchstwert der Sinusschwingung</td>\n<td>≈ 325 V</td>\n</tr>\n<tr>\n<td><strong>Effektivwert</strong> U</td>\n<td>Wert, der dieselbe Wärme erzeugt wie eine gleich große Gleichspannung; zeigt das Multimeter an</td>\n<td>230 V</td>\n</tr>\n</tbody>\n</table>\n<p><strong>U = Û / √2 ≈ 0,707 × Û</strong></p>\n<h4>Leistung bei Wechselstrom</h4>\n<p>Bei Spulen (Motoren, Transformatoren, Vorschaltgeräte) oder Kondensatoren ist der Strom gegenüber der Spannung um den Winkel φ phasenverschoben:</p>\n<ul>\n<li><p><strong>Wirkleistung</strong> P in W: verrichtet die nutzbare Arbeit (Licht, Wärme, Schall).</p></li>\n<li><p><strong>Blindleistung</strong> Q in var: pendelt zwischen Netz und Gerät, belastet die Leitungen, verrichtet aber keine Arbeit.</p></li>\n<li><p><strong>Scheinleistung</strong> S in VA: Gesamtleistung; danach werden Stromerzeuger und Transformatoren bemessen (kVA).</p></li>\n<li><p><strong>Leistungsfaktor</strong> cos φ = P / S. Rein ohmsche Last (Halogen, Heizlüfter): cos φ = 1.</p></li>\n</ul>\n<p><strong>Einphasig: P = U × I × cos φ · Dreiphasig: P = √3 × U × I × cos φ</strong></p>", "3": "<p><em>Buch: 7.8.6 Netzsysteme (S. 253).</em></p>\n<p>Die Bezeichnung des Netzsystems gibt an, wie Stromquelle und Geräte geerdet sind. In der Veranstaltungstechnik wird hinter dem Speisepunkt immer ein <strong>TN-S-System</strong> aufgebaut.</p>\n<h4>Bedeutung der Buchstaben</h4>\n<table>\n\n<thead>\n<tr>\n<th>Buchstabe</th>\n<th>Stelle</th>\n<th>Bedeutung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>T</strong> (terre)</td>\n<td>1.</td>\n<td>Sternpunkt der Stromquelle (Transformator/Generator) ist direkt geerdet</td>\n</tr>\n<tr>\n<td><strong>I</strong> (isolé)</td>\n<td>1.</td>\n<td>Stromquelle ist gegen Erde isoliert (oder über hohe Impedanz geerdet)</td>\n</tr>\n<tr>\n<td><strong>T</strong></td>\n<td>2.</td>\n<td><strong>Körper</strong> der Betriebsmittel haben einen eigenen <strong>Erder</strong></td>\n</tr>\n<tr>\n<td><strong>N</strong></td>\n<td>2.</td>\n<td>Körper sind über einen Leiter mit dem geerdeten Sternpunkt verbunden</td>\n</tr>\n<tr>\n<td><strong>S</strong> (séparé)</td>\n<td>3.</td>\n<td>Neutralleiter (N) und Schutzleiter (PE) sind getrennt geführt</td>\n</tr>\n<tr>\n<td><strong>C</strong> (combiné)</td>\n<td>3.</td>\n<td>N und PE sind in einem Leiter zusammengefasst: <strong>PEN-Leiter</strong></td>\n</tr>\n</tbody>\n</table>\n<h4>Die Systeme im Vergleich</h4>\n<table>\n\n<thead>\n<tr>\n<th>System</th>\n<th>Aufbau</th>\n<th>Abschaltung im Fehlerfall</th>\n<th>Veranstaltungstechnik</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>TN-S</strong></td>\n<td>5 Leiter: L1, L2, L3, N, PE durchgehend getrennt</td>\n<td>Hoher Fehlerstrom über PE → LS/Sicherung löst aus; RCD einsetzbar</td>\n<td><strong>Vorgeschrieben</strong> in mobilen Anlagen hinter dem Speisepunkt</td>\n</tr>\n<tr>\n<td><strong>TN-C</strong></td>\n<td>4 Leiter: L1, L2, L3, PEN</td>\n<td>Wie TN-S, aber <strong>kein RCD möglich</strong> (N und PE nicht trennbar)</td>\n<td><strong>Verboten</strong> bei flexiblen Leitungen; bei PEN-Unterbrechung liegen die Gehäuse an Spannung</td>\n</tr>\n<tr>\n<td><strong>TN-C-S</strong></td>\n<td>Bis zum Aufteilungspunkt PEN, danach N und PE getrennt</td>\n<td>Wie TN-S nach der Aufteilung</td>\n<td>Üblich in Gebäuden; nach der Aufteilung N und PE <strong>nie</strong> wieder verbinden</td>\n</tr>\n<tr>\n<td><strong>TT</strong></td>\n<td>Quelle geerdet; Körper an eigenem Anlagenerder</td>\n<td>Kleiner Fehlerstrom (Erdungswiderstand) → <strong>RCD erforderlich</strong></td>\n<td>Manche Spielstätten, ländliche Netze; Stromerzeuger mit eigenem Erder</td>\n</tr>\n<tr>\n<td><strong>IT</strong></td>\n<td>Quelle gegen Erde isoliert; Körper geerdet</td>\n<td><strong>Erster Fehler führt nicht zur Abschaltung</strong>, erst der zweite</td>\n<td>Wo ein Ausfall kritisch wäre (OP-Säle); <strong>Isolationsüberwachung</strong> erforderlich</td>\n</tr>\n</tbody>\n</table>\n<h4>Das sollte man in der Prüfung sagen können</h4>\n<ul>\n<li><p><strong>Warum TN-S in der Veranstaltungstechnik</strong>: Der PE führt keinen Betriebsstrom, RCDs sind einsetzbar, und bei einer Unterbrechung des N bleibt die Schutzfunktion des PE erhalten.</p></li>\n<li><p><strong>Gefahr beim TN-C-System</strong>: Wird der PEN-Leiter unterbrochen (beschädigte Leitung, lockerer Kontakt), können alle angeschlossenen Gehäuse 230 V führen.</p></li>\n<li><p>Das Netzsystem der Spielstätte wird bei der <strong>Übergabe des Speisepunktes</strong> erfragt und durch Messung überprüft.</p></li>\n</ul>", "4": "<p><em>Buch: 7.3 Grundschaltungen der Elektrotechnik (S. 205–215).</em></p>\n<p>In der Reihenschaltung ist der Strom überall gleich und die Spannung teilt sich auf; in der Parallelschaltung ist die Spannung überall gleich und der Strom teilt sich auf. Die beiden Kirchhoffschen Gesetze erklären das.</p>\n<table>\n\n<thead>\n<tr>\n<th></th>\n<th><strong>Reihenschaltung</strong></th>\n<th><strong>Parallelschaltung</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Strom</td>\n<td>Überall gleich: I = I1 = I2 = …</td>\n<td>Addiert sich: I = I1 + I2 + …</td>\n</tr>\n<tr>\n<td>Spannung</td>\n<td>Teilt sich auf: U = U1 + U2 + …</td>\n<td>Überall gleich: U = U1 = U2 = …</td>\n</tr>\n<tr>\n<td>Gesamtwiderstand</td>\n<td>R = R1 + R2 + … (größer als der größte Einzelwiderstand)</td>\n<td>1/R = 1/R1 + 1/R2 + … (kleiner als der kleinste Einzelwiderstand)</td>\n</tr>\n<tr>\n<td>Leistung</td>\n<td>P = P1 + P2 + …</td>\n<td>P = P1 + P2 + …</td>\n</tr>\n<tr>\n<td>Fällt ein Bauteil aus</td>\n<td>Gesamter Stromkreis unterbrochen</td>\n<td>Die anderen arbeiten weiter</td>\n</tr>\n<tr>\n<td>Beispiel Veranstaltungstechnik</td>\n<td><strong>Vorwiderstand</strong> einer LED, Sicherung in Reihe zum Verbraucher</td>\n<td>Alle Verbraucher an Steckdosen und Mehrfachsteckdosen</td>\n</tr>\n</tbody>\n</table>\n<p>Abkürzung für zwei parallele Widerstände:</p>\n<p><strong>Rges = (R1 × R2) / (R1 + R2)</strong></p>\n<h4>a) Maschenregel (2. Kirchhoffsches Gesetz)</h4>\n<p>In einem geschlossenen Stromkreis (<strong>Masche</strong>) ist die Summe aller Spannungen null: Die Quellenspannung ist gleich der Summe der Teilspannungen an den Verbrauchern.</p>\n<p><strong>Σ U = 0 → Uges = U1 + U2 + …</strong></p>\n<p>Praxisbezug: der <strong>Spannungsfall</strong> auf der Leitung. Fällt auf der Leitung 7 V ab, kommen am Scheinwerfer nur noch 223 V an. Ebenso der <strong>Spannungsteiler</strong>: U1 / U2 = R1 / R2.</p>\n<h4>b) Knotenpunktregel (1. Kirchhoffsches Gesetz)</h4>\n<p>In einem <strong>Knotenpunkt</strong> ist die Summe der zufließenden Ströme gleich der Summe der abfließenden Ströme.</p>\n<p><strong>Σ I (zufließend) = Σ I (abfließend)</strong></p>\n<p>Praxisbezug: Ein Unterverteiler mit drei Abgängen zu 5 A, 7 A und 4 A nimmt 16 A aus der Zuleitung auf. Auch der <strong>RCD</strong> beruht darauf: Sind zu- und abfließender Strom nicht gleich, fließt ein Teil über einen anderen Weg ab (Person oder PE).</p>\n<h4>Gemischte Schaltung (Beispiel)</h4>\n<p>R1 = 10 Ω in Reihe mit einer Parallelschaltung aus R2 = 20 Ω und R3 = 30 Ω, an 230 V:</p>\n<ol type=\"1\">\n<li><p>Parallelschaltung: R23 = (20 × 30) / (20 + 30) = 12 Ω.</p></li>\n<li><p>Gesamtwiderstand: R = 10 + 12 = 22 Ω → I = 230 V / 22 Ω ≈ 10,5 A.</p></li>\n<li><p>U1 = 10 Ω × 10,5 A = 105 V; U23 = 230 V − 105 V = 125 V (Maschenregel).</p></li>\n<li><p>I2 = 125 V / 20 Ω = 6,25 A; I3 = 125 V / 30 Ω ≈ 4,17 A; Summe ≈ 10,4 A (Knotenpunktregel, Rundung).</p></li>\n</ol>", "5": "<p><em>Buch: 7.1 Gefahren im Umgang mit dem elektrischen Strom (S. 186–190).</em></p>\n<p>Gefährlich ist der Strom, der durch den Körper fließt (<strong>Körperstrom</strong>). Er hängt ab von der Berührungsspannung, dem Körperwiderstand (≈ 1000 Ω), dem Stromweg und der Einwirkdauer. Bei 230 V: 230 V / 1000 Ω = 230 mA – lebensgefährlich.</p>\n<table>\n\n<thead>\n<tr>\n<th>Körperstrom (AC 50 Hz)</th>\n<th>Wirkung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ca. 0,5 mA</td>\n<td><strong>Wahrnehmbarkeitsschwelle</strong></td>\n</tr>\n<tr>\n<td>ca. 10 mA</td>\n<td><strong>Loslassschwelle</strong>: Leiter kann nicht mehr losgelassen werden</td>\n</tr>\n<tr>\n<td>ca. 30 mA</td>\n<td>Muskelverkrampfung, Atembeschwerden → deshalb RCD mit 30 mA</td>\n</tr>\n<tr>\n<td>ab ca. 50 mA (&gt; 1 s)</td>\n<td><strong>Herzkammerflimmern</strong> möglich: Lebensgefahr</td>\n</tr>\n<tr>\n<td>&gt; 3 A</td>\n<td>Herzstillstand, innere Verbrennungen</td>\n</tr>\n</tbody>\n</table>\n<p>Weitere Gefahren: <strong>Lichtbogen</strong> (Verbrennungen, Augenschäden), Zersetzung des Blutes (Nierenschäden, auch Tage später), Sturz durch Schreckreaktion. Dauerhaft zulässige <strong>Berührungsspannung</strong>: <strong>50 V AC / 120 V DC</strong>.</p>\n<h4>a) Maßnahmen: die 5 Sicherheitsregeln (DIN VDE 0105-100)</h4>\n<p>Vor Arbeiten an elektrischen Anlagen, <strong>immer in dieser Reihenfolge</strong>:</p>\n<ol type=\"1\">\n<li><p><strong>Freischalten</strong> – allpolig trennen.</p></li>\n<li><p><strong>Gegen Wiedereinschalten sichern</strong> – Schloss, Schild „Nicht schalten“, Sicherungen entnehmen.</p></li>\n<li><p><strong>Spannungsfreiheit feststellen</strong> – mit <strong>zweipoligem Spannungsprüfer</strong>, an allen Polen (nie mit Phasenprüfer).</p></li>\n<li><p><strong>Erden und kurzschließen</strong> – in Hochspannungsanlagen Pflicht; in Niederspannung, wenn Rückspeisung möglich ist (z. B. Stromerzeuger).</p></li>\n<li><p><strong>Benachbarte, unter Spannung stehende Teile abdecken oder abschranken</strong>.</p></li>\n</ol>\n<p>Nach Abschluss der Arbeiten werden die Regeln <strong>in umgekehrter Reihenfolge</strong> aufgehoben. Wieder einschalten darf nur, wer freigeschaltet hat, und erst, wenn niemand mehr gefährdet ist.</p>\n<p>Eselsbrücke: <strong>F</strong>reie <strong>G</strong>eister <strong>S</strong>prechen <strong>E</strong>rnst <strong>A</strong>b → Freischalten, Gegen Wiedereinschalten sichern, Spannungsfreiheit feststellen, Erden und kurzschließen, Abdecken.</p>\n<h4>b) Qualifikationen für Arbeiten (DGUV V3, VDE 1000-10)</h4>\n<table>\n\n<thead>\n<tr>\n<th>Person</th>\n<th>Definition</th>\n<th>Darf</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Elektrofachkraft (EFK)</strong></td>\n<td>Fachliche Ausbildung, Kenntnisse, Erfahrung und Kenntnis der Normen; kann Gefahren selbst erkennen</td>\n<td>Anlagen errichten, ändern, instand setzen und prüfen; Fachverantwortung übernehmen</td>\n</tr>\n<tr>\n<td><strong>EFK für festgelegte Tätigkeiten</strong></td>\n<td>Ausbildung beschränkt auf bestimmte, gleichartige Tätigkeiten</td>\n<td>Nur diese festgelegten Tätigkeiten (z. B. Anschluss mobiler Verteiler)</td>\n</tr>\n<tr>\n<td><strong>Elektrotechnisch unterwiesene Person (EuP)</strong></td>\n<td>Von einer EFK über die übertragenen Aufgaben und deren Gefahren unterrichtet</td>\n<td>Einfache Arbeiten unter <strong>Leitung und Aufsicht</strong> einer EFK (z. B. Leitungen verlegen, Prüfen mit automatischem Prüfgerät)</td>\n</tr>\n<tr>\n<td><strong>Elektrotechnischer Laie</strong></td>\n<td>Keine elektrotechnische Ausbildung</td>\n<td>Nur gebrauchsfertige Geräte benutzen</td>\n</tr>\n</tbody>\n</table>\n<p>Bei jeder Veranstaltung gibt es eine <strong>verantwortliche Elektrofachkraft</strong>, die für die mobile Anlage verantwortlich ist und deren Übergabe unterschreibt.</p>\n<h4>Erste Hilfe bei Stromunfällen</h4>\n<ol type=\"1\">\n<li><p><strong>Eigenschutz</strong>: Verunfallten nicht berühren, solange er noch Kontakt hat.</p></li>\n<li><p>Stromkreis unterbrechen (Stecker, LS, NOT-AUS).</p></li>\n<li><p><strong>Notruf 112</strong> absetzen, Ersthelfer holen.</p></li>\n<li><p>Keine Atmung: <strong>Herz-Lungen-Wiederbelebung</strong> (30:2) und <strong>AED</strong>.</p></li>\n<li><p>Immer zum Arzt, auch wenn es der Person gut geht: Herzrhythmusstörungen können Stunden später auftreten.</p></li>\n</ol>", "6": "<p><em>Buch: 7.9 Schutzmaßnahmen (S. 255–267) und 7.8.3 Schutzpotenzialausgleich (S. 249). Norm: DIN VDE 0100-410.</em></p>\n<p>Jede Schutzmaßnahme gegen elektrischen Schlag besteht aus <strong>Basisschutz</strong> + <strong>Fehlerschutz</strong>; für Steckdosen bis 32 A kommt der <strong>Zusatzschutz</strong> durch RCD mit 30 mA hinzu.</p>\n<h4>a) Schutzklassen</h4>\n<table>\n\n<thead>\n<tr>\n<th>Schutzklasse</th>\n<th>Prinzip</th>\n<th>Schutzleiter</th>\n<th>Beispiel</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>I</strong></td>\n<td>Metallgehäuse mit PE verbunden; im Fehlerfall löst die Schutzeinrichtung aus</td>\n<td>Ja</td>\n<td>Scheinwerfer, Endstufen, Dimmer, Verteiler</td>\n</tr>\n<tr>\n<td><strong>II</strong></td>\n<td><strong>Doppelte oder verstärkte Isolierung</strong>; Symbol: doppeltes Quadrat</td>\n<td>Nein</td>\n<td>Laptop-Netzteile, Elektrowerkzeuge</td>\n</tr>\n<tr>\n<td><strong>III</strong></td>\n<td>Betrieb mit <strong>Kleinspannung</strong> (SELV/PELV)</td>\n<td>Nein</td>\n<td>12-V-Leuchten, Akkugeräte</td>\n</tr>\n</tbody>\n</table>\n<h4>b) Basisschutz / Fehlerschutz</h4>\n<table>\n\n<thead>\n<tr>\n<th></th>\n<th><strong>Basisschutz</strong> (Schutz gegen direktes Berühren)</th>\n<th><strong>Fehlerschutz</strong> (Schutz bei indirektem Berühren)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ziel</td>\n<td><strong>Aktive Teile</strong> sind im Normalbetrieb nicht berührbar</td>\n<td>Ein <strong>Körperschluss</strong> gefährdet niemanden</td>\n</tr>\n<tr>\n<td>Mittel</td>\n<td>Basisisolierung, Gehäuse, Abdeckungen, Hindernisse, Abstand</td>\n<td><strong>Automatische Abschaltung</strong> (PE + LS/Sicherung/RCD), doppelte Isolierung, Schutztrennung</td>\n</tr>\n<tr>\n<td>Beispiel</td>\n<td>Isolierung der Leitung, Deckel der Steckdose</td>\n<td>Gehäuse des Scheinwerfers am PE → im Fehlerfall Abschaltung in ≤ 0,4 s</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Schutztrennung</strong>: Ein <strong>Trenntransformator</strong> trennt den Stromkreis galvanisch vom Netz; das Berühren eines einzelnen Leiters schließt keinen Stromkreis. Grundsätzlich nur ein Verbraucher pro Trenntransformator.</p>\n<h4>c) SELV / PELV</h4>\n<p>Höchstens <strong>50 V AC / 120 V DC</strong> aus einer sicheren Stromquelle (Sicherheitstransformator, Batterie). In feuchten Bereichen gelten niedrigere Grenzwerte (25 V AC / 60 V DC).</p>\n<ul>\n<li><p><strong>SELV</strong> (Safety Extra Low Voltage): Stromkreis <strong>ohne</strong> Erdverbindung.</p></li>\n<li><p><strong>PELV</strong> (Protective Extra Low Voltage): Stromkreis <strong>mit</strong> Erdverbindung (z. B. aus Funktionsgründen).</p></li>\n<li><p>In beiden Fällen muss der Kleinspannungsstromkreis sicher vom Netzstromkreis getrennt sein.</p></li>\n</ul>\n<h4>d) Potenzialausgleich</h4>\n<p>Alle gleichzeitig berührbaren leitfähigen Teile (Traversen, Bühnenpodeste, Tribünen, Rohrleitungen, Metallzelte) werden mit einem Potenzialausgleichsleiter (grün-gelb, meist 6–16 mm² Cu) mit dem PE verbunden.</p>\n<ul>\n<li><p><strong>Ziel</strong>: Zwischen zwei gleichzeitig berührbaren Metallteilen darf keine gefährliche Spannung auftreten.</p></li>\n<li><p><strong>Schutzpotenzialausgleich</strong>: am Einspeisepunkt bzw. Hauptverteiler an der <strong>Potenzialausgleichsschiene</strong>.</p></li>\n<li><p><strong>Zusätzlicher Potenzialausgleich</strong>: direkt an der Konstruktion (Traverse, Bühne).</p></li>\n<li><p>Wird durch die Durchgängigkeitsmessung geprüft (Punkt 8).</p></li>\n</ul>\n<h4>e) Nennstromregel</h4>\n<p>Die Schutzeinrichtung schützt die <strong>Leitung</strong>, nicht das Gerät. Dazu gilt:</p>\n<p><strong>Ib ≤ In ≤ Iz und I2 ≤ 1,45 × Iz</strong></p>\n<table>\n\n<thead>\n<tr>\n<th>Zeichen</th>\n<th>Bedeutung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Ib</strong> (Betriebsstrom)</td>\n<td>Strom, den die Verbraucher benötigen</td>\n</tr>\n<tr>\n<td><strong>In</strong> (Nennstrom)</td>\n<td>Bemessungsstrom des LS bzw. der Sicherung</td>\n</tr>\n<tr>\n<td><strong>Iz</strong> (Strombelastbarkeit)</td>\n<td>Strom, den die Leitung dauerhaft führen darf (Punkt 9)</td>\n</tr>\n<tr>\n<td><strong>I2</strong> (Auslösestrom)</td>\n<td>Strom, bei dem die Schutzeinrichtung in der konventionellen Zeit sicher auslöst; beim LS ist I2 = 1,45 × In, daher genügt In ≤ Iz</td>\n</tr>\n</tbody>\n</table>\n<p>Beispiel: Betriebsstrom 12 A, Leitung mit Iz = 20 A → LS 16 A: 12 ≤ 16 ≤ 20 ✔.</p>\n<h4>f) Auslösecharakteristik / Selektivität</h4>\n<p>Ein <strong>Leitungsschutzschalter (LS)</strong> hat zwei Auslöser: den <strong>thermischen</strong> Auslöser (Bimetall, bei <strong>Überlast</strong>, verzögert) und den <strong>elektromagnetischen</strong> Auslöser (Spule, bei <strong>Kurzschluss</strong>, unverzögert &lt; 0,1 s). Die Charakteristik gibt an, ab welchem Vielfachen von In der magnetische Auslöser anspricht:</p>\n<table>\n\n<thead>\n<tr>\n<th>Charakteristik</th>\n<th>Unverzögerte Auslösung</th>\n<th>Einsatz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>B</strong></td>\n<td>3–5 × In</td>\n<td>Steckdosen, Beleuchtung, ohmsche Lasten; Standard im Wohnbereich</td>\n</tr>\n<tr>\n<td><strong>C</strong></td>\n<td>5–10 × In</td>\n<td>Lasten mit Einschaltstromspitzen: Schaltnetzteile, Motoren, <strong>viele Geräte der Veranstaltungstechnik</strong></td>\n</tr>\n<tr>\n<td><strong>D</strong></td>\n<td>10–20 × In</td>\n<td>Große Transformatoren, Motoren mit schwerem Anlauf</td>\n</tr>\n</tbody>\n</table>\n<p>Je träger der LS (C, D), desto niedriger muss die <strong>Schleifenimpedanz</strong> sein, damit er rechtzeitig auslöst (Punkt 7).</p>\n<p><strong>Selektivität</strong>: Im Fehlerfall soll nur die Schutzeinrichtung auslösen, die <strong>dem Fehler am nächsten</strong> liegt. Der Rest der Anlage läuft weiter – ein defekter Scheinwerfer darf nicht die ganze Bühne abschalten.</p>\n<ul>\n<li><p>Sicherungen: selektiv, wenn die vorgeschaltete Sicherung mindestens den <strong>1,6-fachen</strong> Nennstrom der nachgeschalteten hat (z. B. 63 A vor 35/40 A).</p></li>\n<li><p>LS: vorgeschaltet höherer Nennstrom und/oder trägere Charakteristik.</p></li>\n<li><p>RCD: vorgeschaltet ein <strong>selektiver RCD (Typ S)</strong> mit Verzögerung und höherem Bemessungsdifferenzstrom (z. B. 300 mA S), nachgeschaltet 30 mA.</p></li>\n</ul>\n<h4>g) Fehlerstromarten</h4>\n<p><strong>Fehlerarten</strong>, die man benennen können muss:</p>\n<table>\n\n<thead>\n<tr>\n<th>Fehlerart</th>\n<th>Was passiert</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Kurzschluss</strong></td>\n<td>Direkte Verbindung zwischen aktiven Leitern (L–N oder L–L) → sehr hoher Strom → magnetischer Auslöser des LS spricht an</td>\n</tr>\n<tr>\n<td><strong>Körperschluss</strong></td>\n<td>Aktiver Leiter berührt das leitfähige Gehäuse → Fehlerstrom über PE → automatische Abschaltung</td>\n</tr>\n<tr>\n<td><strong>Erdschluss</strong></td>\n<td>Aktiver Leiter berührt Erde oder ein geerdetes Teil</td>\n</tr>\n<tr>\n<td><strong>Leiterschluss</strong></td>\n<td>Verbindung zwischen aktiven Leitern über einen Verbraucher (Gerät schaltet sich selbst ein, z. B. überbrückter Schalter)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Fehlerstromformen</strong> und die passenden <strong>RCD-Typen</strong>:</p>\n<table>\n\n<thead>\n<tr>\n<th>RCD-Typ</th>\n<th>Erfasst</th>\n<th>Einsatz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Typ AC</strong></td>\n<td>Nur sinusförmigen Wechselfehlerstrom</td>\n<td>Kaum noch verwendet; in der Veranstaltungstechnik nicht ausreichend</td>\n</tr>\n<tr>\n<td><strong>Typ A</strong></td>\n<td>AC + pulsierenden Gleichfehlerstrom</td>\n<td>Standard in Deutschland</td>\n</tr>\n<tr>\n<td><strong>Typ F</strong></td>\n<td>Wie A + Mischfrequenzen</td>\n<td>Einphasige Frequenzumrichter</td>\n</tr>\n<tr>\n<td><strong>Typ B</strong></td>\n<td>Wie F + <strong>glatten Gleichfehlerstrom</strong></td>\n<td>Dreiphasige Frequenzumrichter, E-Auto-Ladegeräte, viele große Netzteile; empfohlen für mobile Verteiler</td>\n</tr>\n</tbody>\n</table>\n<p>Wichtig: Der RCD schützt <strong>nicht</strong> vor Überlast und Kurzschluss und auch nicht, wenn jemand L und N gleichzeitig berührt. Ein <strong>RCM</strong> überwacht und meldet nur, er schaltet nicht ab.</p>", "7": "<p><em>Buch: 7.9.2 Basisschutz, Fehlerschutz und automatische Abschaltung (S. 256) und 7.10.1 Prüfung nach DIN VDE 0100-600 (S. 269).</em></p>\n<p>Die <strong>Schleifenimpedanz Zs</strong> ist der Gesamtwiderstand des Weges, den der Fehlerstrom nimmt. Sie muss so klein sein, dass bei einem Körperschluss ein ausreichend großer Strom fließt und die Schutzeinrichtung rechtzeitig abschaltet.</p>\n<h4>Die Fehlerschleife im TN-S-System</h4>\n<p>Transformator/Generator → Außenleiter L → Gerät mit Körperschluss → Schutzleiter PE → zurück zum Sternpunkt des Transformators.</p>\n<p>Alles auf diesem Weg zählt mit: Transformatorwicklung, Netzleitungen, Leitungen der Spielstätte und <strong>die eigenen Leitungen der Veranstaltung</strong>. Je länger und dünner die Leitung, desto größer Zs.</p>\n<h4>Abschaltbedingung</h4>\n<p><strong>Zs × Ia ≤ U0 → Zs ≤ U0 / Ia · Ik = U0 / Zs</strong></p>\n<ul>\n<li><p>U0 = Spannung Außenleiter gegen Erde (230 V).</p></li>\n<li><p>Ia = Strom, der die Abschaltung in der geforderten Zeit bewirkt (<strong>0,4 s</strong> in Endstromkreisen ≤ 32 A im TN-System; 5 s in Verteilerstromkreisen). Beim LS wird die obere Grenze der magnetischen Auslösung angesetzt.</p></li>\n<li><p>Ik = <strong>Kurzschlussstrom</strong>, der im Fehlerfall fließt.</p></li>\n</ul>\n<h4>Maximale Schleifenimpedanz (U0 = 230 V)</h4>\n<table>\n\n<thead>\n<tr>\n<th>Schutzeinrichtung</th>\n<th>Ia</th>\n<th>Zs max. rechnerisch</th>\n<th>Zs max. gemessen (⅔-Regel)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>LS B16</td>\n<td>5 × 16 = 80 A</td>\n<td>2,87 Ω</td>\n<td>1,92 Ω</td>\n</tr>\n<tr>\n<td>LS C16</td>\n<td>10 × 16 = 160 A</td>\n<td>1,44 Ω</td>\n<td>0,96 Ω</td>\n</tr>\n<tr>\n<td>LS B32</td>\n<td>5 × 32 = 160 A</td>\n<td>1,44 Ω</td>\n<td>0,96 Ω</td>\n</tr>\n<tr>\n<td>LS C32</td>\n<td>10 × 32 = 320 A</td>\n<td>0,72 Ω</td>\n<td>0,48 Ω</td>\n</tr>\n<tr>\n<td>RCD 30 mA</td>\n<td>0,03 A</td>\n<td>7667 Ω</td>\n<td>– (fast immer erfüllt)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>⅔-Regel</strong>: Bei der Messung sind die Leitungen kalt; im Fehlerfall erwärmen sie sich und ihr Widerstand steigt. Deshalb darf der Messwert nur etwa <strong>2/3</strong> des rechnerischen Höchstwertes betragen.</p>\n<h4>Messung</h4>\n<ul>\n<li><p>Mit einem <strong>Installationstester</strong> (z. B. Benning, Gossen Metrawatt, Fluke) an der Steckdose bzw. am entferntesten Punkt jedes Stromkreises.</p></li>\n<li><p>Das Gerät misst Zs und zeigt Ik an; mit der Tabelle wird geprüft, ob die Schutzeinrichtung rechtzeitig auslöst.</p></li>\n<li><p>Gemessen wird bei der <strong>Übergabe des Speisepunktes</strong> (Netzimpedanz der Spielstätte) und anschließend am Ende der eigenen Leitungen.</p></li>\n</ul>\n<h4>Was tun, wenn Zs zu groß ist?</h4>\n<ul>\n<li><p>Kürzere Leitungen oder größeren Querschnitt verwenden.</p></li>\n<li><p>LS mit B- statt C-Charakteristik oder kleinerem Nennstrom einsetzen.</p></li>\n<li><p>Einen <strong>RCD</strong> vorsehen (die Abschaltbedingung mit 30 mA ist fast immer erfüllt).</p></li>\n</ul>\n<p>Beispiel: Gemessen Zs = 1,2 Ω in einem Stromkreis mit C16 → Ik = 230 V / 1,2 Ω ≈ 192 A. Rechnerisch ausreichend (≥ 160 A), aber 1,2 Ω &gt; 0,96 Ω (⅔-Regel) → nicht sicher erfüllt. Lösung: B16 (max. 1,92 Ω) oder RCD.</p>", "8": "<p><em>Buch: 7.10 Prüfung elektrischer Anlagen und Geräte (S. 268–281).</em></p>\n<p>Die <strong>DGUV Vorschrift 3</strong> verpflichtet den Unternehmer, elektrische Anlagen und Betriebsmittel in ordnungsgemäßem Zustand zu halten und sie vor der ersten Inbetriebnahme, nach Instandsetzung und regelmäßig prüfen zu lassen. <strong>Wie</strong> geprüft wird, regeln die VDE-Normen.</p>\n<table>\n\n<thead>\n<tr>\n<th>Prüfung</th>\n<th>Norm</th>\n<th>Wann</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Erstprüfung von Anlagen</td>\n<td><strong>DIN VDE 0100-600</strong></td>\n<td>Vor der ersten Inbetriebnahme; in der Veranstaltungstechnik nach jedem Aufbau</td>\n</tr>\n<tr>\n<td>Wiederkehrende Prüfung von Anlagen</td>\n<td><strong>DIN VDE 0105-100</strong></td>\n<td>Regelmäßig</td>\n</tr>\n<tr>\n<td>Geräte nach Instandsetzung/Änderung</td>\n<td><strong>DIN EN 50678 (VDE 0701)</strong></td>\n<td>Nach Reparatur oder Änderung eines Gerätes</td>\n</tr>\n<tr>\n<td>Wiederholungsprüfung von Geräten</td>\n<td><strong>DIN EN 50699 (VDE 0702)</strong></td>\n<td>Regelmäßig</td>\n</tr>\n</tbody>\n</table>\n<p>Hinweis: Die frühere gemeinsame Norm „DIN VDE 0701-0702“ wurde 2021 durch die beiden europäischen Normen oben ersetzt.</p>\n<h4>Ablauf: Besichtigen → Erproben → Messen</h4>\n<ol type=\"1\">\n<li><p><strong>Besichtigen</strong> (spannungsfrei): Schäden an Leitungen, Steckverbindern und Gehäusen; richtige Schutzeinrichtungen; IP-Schutzart; Kennzeichnung; Potenzialausgleich angeschlossen; Dokumentation.</p></li>\n<li><p><strong>Erproben</strong>: Prüftaste des RCD, NOT-AUS, Schalter, <strong>Drehfeld</strong>.</p></li>\n<li><p><strong>Messen</strong> (Anlagen, DIN VDE 0100-600):</p>\n<ul>\n<li><p><strong>Durchgängigkeit des Schutzleiters</strong> und des Potenzialausgleichs.</p></li>\n<li><p><strong>Isolationswiderstand</strong> mit 500 V DC: ≥ <strong>1 MΩ</strong>.</p></li>\n<li><p><strong>Schleifenimpedanz</strong> / Kurzschlussstrom (Punkt 7).</p></li>\n<li><p><strong>RCD</strong>: Auslösestrom und <strong>Auslösezeit</strong> (bei IΔn: max. 300 ms; Typ S: 130–500 ms) sowie Berührungsspannung ≤ 50 V.</p></li>\n<li><p><strong>Drehfeld</strong> (rechtsdrehend) und ggf. Erdungswiderstand.</p></li>\n</ul></li>\n<li><p><strong>Dokumentieren</strong>: <strong>Prüfprotokoll</strong> und in der Veranstaltungstechnik die <strong>Errichterbescheinigung</strong>, unterschrieben von der verantwortlichen EFK.</p></li>\n</ol>\n<h4>Grenzwerte der Geräteprüfung (DIN EN 50678/50699)</h4>\n<table>\n\n<thead>\n<tr>\n<th>Messung</th>\n<th>Grenzwert</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Schutzleiterwiderstand</strong> (SK I)</td>\n<td>≤ 0,3 Ω bis 5 m Leitungslänge, + 0,1 Ω je weitere 7,5 m, max. 1 Ω</td>\n</tr>\n<tr>\n<td><strong>Isolationswiderstand</strong></td>\n<td>SK I ≥ 1 MΩ · SK II ≥ 2 MΩ · SK III ≥ 0,25 MΩ</td>\n</tr>\n<tr>\n<td><strong>Schutzleiterstrom</strong> (SK I)</td>\n<td>≤ 3,5 mA</td>\n</tr>\n<tr>\n<td><strong>Berührungsstrom</strong> (SK II)</td>\n<td>≤ 0,5 mA</td>\n</tr>\n</tbody>\n</table>\n<p>Bestandene Geräte erhalten eine <strong>Prüfplakette</strong> mit dem nächsten Prÿtermin. Durchgefallene Geräte werden aus dem Verkehr gezogen und als defekt gekennzeichnet.</p>\n<h4>Prüffristen (Richtwerte DGUV V3, festgelegt über die Gefährdungsbeurteilung)</h4>\n<table>\n\n<thead>\n<tr>\n<th>Was</th>\n<th>Richtwert</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Ortsveränderliche Betriebsmittel</strong></td>\n<td>6 Monate; auf Baustellen 3 Monate; Verlängerung möglich bei Fehlerquote &lt; 2 %</td>\n</tr>\n<tr>\n<td><strong>Nichtstationäre Anlagen</strong></td>\n<td>1 Jahr; in der Veranstaltungstechnik zusätzlich nach jedem Aufbau</td>\n</tr>\n<tr>\n<td>Stationäre Anlagen</td>\n<td>4 Jahre</td>\n</tr>\n<tr>\n<td>RCD in nichtstationären Anlagen: Prüftaste</td>\n<td>Arbeitstäglich</td>\n</tr>\n<tr>\n<td>RCD in stationären Anlagen: Prüftaste</td>\n<td>Alle 6 Monate</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Wer prüft</strong>: eine Elektrofachkraft; eine EuP nur mit geeigneten Mess- und Prüfgeräten und unter <strong>Leitung und Aufsicht</strong> einer EFK.</p>", "9": "<p><em>Buch: 7.8.2 Leitungsauswahl (S. 249) und 7.2.3 Elektrischer Widerstand (S. 198). Normen: DIN VDE 0298-4, DIN VDE 0100-520.</em></p>\n<p>Eine Leitung ist richtig dimensioniert, wenn sie <strong>drei</strong> Bedingungen erfüllt: Sie führt den Strom ohne unzulässige Erwärmung (<strong>Strombelastbarkeit</strong>), sie ist durch die passende Schutzeinrichtung geschützt (<strong>Nennstromregel</strong>, Punkt 6e) und der <strong>Spannungsfall</strong> bleibt klein. Außerdem muss die Abschaltbedingung erfüllt sein (<strong>Schleifenimpedanz</strong>, Punkt 7).</p>\n<h4>Leitungstyp</h4>\n<table>\n\n<thead>\n<tr>\n<th>Leitung</th>\n<th>Einsatz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>H07RN-F</strong></td>\n<td>Standard in der Veranstaltungstechnik: Gummischlauchleitung, für hohe mechanische Beanspruchung, im Freien, ölbeständig</td>\n</tr>\n<tr>\n<td>H05RN-F</td>\n<td>Leichte Gummischlauchleitung, geringe mechanische Beanspruchung</td>\n</tr>\n<tr>\n<td>H05VV-F</td>\n<td>PVC-Schlauchleitung, nur innen und ohne mechanische Beanspruchung; für Veranstaltungen ungeeignet</td>\n</tr>\n</tbody>\n</table>\n<p>Kurzzeichen: H = harmonisierte Norm, 07 = 450/750 V, R = Gummiisolierung, N = Mantel aus Polychloropren, F = feindrähtig (flexibel). Beispiel <strong>5G2,5</strong>: 5 Adern, G = mit grün-gelbem Schutzleiter, 2,5 mm².</p>\n<h4>a) Strombelastbarkeit (Iz)</h4>\n<p>Der Strom, den eine Leitung dauerhaft führen darf, ohne die zulässige Betriebstemperatur der Isolierung (60 °C bei Gummi) zu überschreiten. Sie hängt ab von:</p>\n<ul>\n<li><p><strong>Querschnitt</strong> und Leitermaterial (Kupfer).</p></li>\n<li><p><strong>Verlegeart</strong>: frei in Luft, im Kanal, im Erdreich.</p></li>\n<li><p><strong>Umgebungstemperatur</strong> (Tabellen gelten für 30 °C; höhere Temperatur → geringere Belastbarkeit).</p></li>\n<li><p><strong>Häufung</strong> (mehrere Leitungen nebeneinander erwärmen sich gegenseitig).</p></li>\n<li><p><strong>Aufgewickelte Leitungen</strong> (Kabeltrommel): in der Veranstaltungstechnik die wichtigste Reduzierung!</p></li>\n</ul>\n<p>Übliche Praxiswerte in der Veranstaltungstechnik (H07RN-F, frei in Luft, 30 °C, abgerollt; genaue Werte in DIN VDE 0298-4 und im Buch):</p>\n<table>\n\n<thead>\n<tr>\n<th>Querschnitt</th>\n<th>Typische Absicherung</th>\n<th>Typischer Steckverbinder</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1,5 mm²</td>\n<td>16 A</td>\n<td>Schuko (kurze Leitungen)</td>\n</tr>\n<tr>\n<td>2,5 mm²</td>\n<td>16 A</td>\n<td>Schuko, CEE 16 A</td>\n</tr>\n<tr>\n<td>4 mm²</td>\n<td>25 A</td>\n<td>CEE 32 A (kurze Strecken)</td>\n</tr>\n<tr>\n<td>6 mm²</td>\n<td>32 A</td>\n<td>CEE 32 A</td>\n</tr>\n<tr>\n<td>16 mm²</td>\n<td>63 A</td>\n<td>CEE 63 A</td>\n</tr>\n<tr>\n<td>35 mm²</td>\n<td>125 A</td>\n<td>CEE 125 A</td>\n</tr>\n<tr>\n<td>95–150 mm² (einadrig)</td>\n<td>bis 400 A</td>\n<td>Powerlock</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Reduktionsfaktoren für aufgewickelte Leitungen</strong> (ca.): 1 Lage 0,80 · 2 Lagen 0,61 · 3 Lagen 0,49 · 4 Lagen 0,42 · 5 Lagen 0,38. Deshalb Kabeltrommeln und Verlängerungen <strong>immer vollständig abrollen</strong>.</p>\n<p>Berechnung: Iz = Iz (Tabelle) × f1 (Temperatur) × f2 (Häufung) × f3 (Aufwicklung).</p>\n<h4>b) Spannungsfall</h4>\n<p>Jede Leitung hat einen Widerstand, an dem ein Teil der Spannung abfällt. Ein zu großer Spannungsfall führt zu Fehlfunktionen, Neustarts oder Erwärmung der Geräte.</p>\n<p><strong>Einphasig: ΔU = (2 × l × I × cos φ) / (κ × A)</strong></p>\n<p><strong>Dreiphasig: ΔU = (√3 × l × I × cos φ) / (κ × A)</strong></p>\n<p><strong>Δu = (ΔU / U) × 100 %</strong></p>\n<ul>\n<li><p>l = <strong>einfache</strong> Leitungslänge in m (die 2 in der einphasigen Formel berücksichtigt Hin- und Rückleiter).</p></li>\n<li><p>κ (Cu) = 56 m/(Ω·mm²); A in mm²; einphasig U = 230 V, dreiphasig U = 400 V.</p></li>\n<li><p>Empfohlener Grenzwert: <strong>3 %</strong> vom Speisepunkt bis zum Verbraucher (höchstens 5 %).</p></li>\n</ul>\n<p>Zur Berechnung des Mindestquerschnitts wird nach A umgestellt:</p>\n<p><strong>A = (2 × l × I × cos φ) / (κ × ΔU)</strong></p>\n<p>Beispiel: 60 m einphasig, 16 A, cos φ = 1, max. 3 % (6,9 V) → A = (2 × 60 × 16) / (56 × 6,9) ≈ 4,97 mm² → gewählt wird <strong>6 mm²</strong> (nächster Normquerschnitt).</p>", "10": "<p><em>Buch: 7.7.3 Drehstrom (S. 244), 7.8.1 Netzverteilungspläne (S. 248) und 8.8.3 Lastverteilungen (S. 318).</em></p>\n<p>Vor der Veranstaltung wird ermittelt, wie viel Leistung benötigt wird, der passende Anschluss gewählt und die Verbraucher <strong>möglichst gleichmäßig</strong> auf L1, L2 und L3 verteilt.</p>\n<h4>Vorgehen bei der Strombedarfsermittlung</h4>\n<ol type=\"1\">\n<li><p><strong>Verbraucherliste</strong> mit Nennleistung erstellen (Typenschild oder Datenblatt).</p></li>\n<li><p>Leistungen nach Gewerken summieren (Licht, Ton, Video, Catering …).</p></li>\n<li><p><strong>Gleichzeitigkeitsfaktor</strong> berücksichtigen, wenn nicht alle Geräte gleichzeitig unter Volllast laufen (z. B. nehmen Endstufen ihre Nennleistung selten dauerhaft auf).</p></li>\n<li><p><strong>cos φ</strong> (Scheinleistung) und <strong>Einschaltströme</strong> (Anlaufspitzen von Netzteilen und Motoren) beachten.</p></li>\n<li><p><strong>Reserve</strong> einplanen (ca. 20 %).</p></li>\n<li><p>Strom pro Außenleiter berechnen und Anschluss wählen: CEE 16 A, 32 A, 63 A, 125 A oder Powerlock.</p></li>\n</ol>\n<p><strong>I (pro Außenleiter) = P (pro Außenleiter) / 230 V · I = P (gesamt) / (√3 × 400 V × cos φ)</strong></p>\n<p>Richtwerte der Anschlussleistung (cos φ = 1): CEE 16 A ≈ 11 kW · CEE 32 A ≈ 22 kW · CEE 63 A ≈ 43 kW · CEE 125 A ≈ 86 kW.</p>\n<h4>Warum symmetrisch verteilen?</h4>\n<ul>\n<li><p><strong>Kein Außenleiter wird überlastet</strong>, während andere kaum belastet sind.</p></li>\n<li><p>Die volle Anschlussleistung kann genutzt werden.</p></li>\n<li><p>Der <strong>Neutralleiter</strong> wird entlastet: Bei gleicher Belastung aller drei Außenleiter heben sich die Ströme im N auf, der Neutralleiterstrom ist nahezu null.</p></li>\n<li><p>Stromerzeuger vertragen keine starke <strong>Schieflast</strong>.</p></li>\n</ul>\n<p><strong>Achtung bei LED und Schaltnetzteilen</strong>: Sie erzeugen Oberschwingungen 3. Ordnung, die sich im Neutralleiter <strong>addieren</strong>. Bei viel LED-Last kann der N stärker belastet sein als die Außenleiter; sein Querschnitt wird daher nie reduziert.</p>\n<h4>Beispiel: Verteilung an einem CEE 32 A</h4>\n<p>Verbraucher: 12 LED-Profiler zu 200 W, 8 Moving Heads zu 600 W, 4 Endstufen zu 1500 W, 1 LED-Wand mit 3000 W, FOH/Regie 1500 W → gesamt <strong>17 700 W</strong>, Ziel ≈ 5900 W pro Außenleiter.</p>\n<table>\n\n<thead>\n<tr>\n<th>Außenleiter</th>\n<th>Verbraucher</th>\n<th>Leistung</th>\n<th>Strom (230 V)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>L1</td>\n<td>8 Moving Heads + 6 Profiler</td>\n<td>6000 W</td>\n<td>26,1 A</td>\n</tr>\n<tr>\n<td>L2</td>\n<td>4 Endstufen (Ton)</td>\n<td>6000 W</td>\n<td>26,1 A</td>\n</tr>\n<tr>\n<td>L3</td>\n<td>LED-Wand + 6 Profiler + FOH</td>\n<td>5700 W</td>\n<td>24,8 A</td>\n</tr>\n</tbody>\n</table>\n<p>Ergebnis: Alle drei Außenleiter ≤ 32 A ✔; der Neutralleiter führt bei ohmscher Last nur ≈ 1,3 A. Zusätzlich liegt der <strong>Ton auf einem eigenen Außenleiter</strong>, getrennt vom Licht, um Störungen zu vermeiden.</p>\n<p>Ohne Verteilung (alles auf L1) wären es 17 700 W / 230 V ≈ 77 A auf einem Außenleiter: Der 32-A-LS würde sofort auslösen, obwohl der Anschluss insgesamt genug Leistung hat.</p>", "11": "<p><em>Buch: 7.7.3 Dreiphasenwechselstrom (Drehstrom) (S. 244–247).</em></p>\n<p>Im Drehstromnetz können drei Lasten im <strong>Stern (Y)</strong> oder im <strong>Dreieck (Δ)</strong> geschaltet werden. Im Stern liegen an jeder Last 230 V, im Dreieck 400 V. Bei gleichen Lasten nimmt die Dreieckschaltung die <strong>dreifache</strong> Leistung auf.</p>\n<h4>Begriffe</h4>\n<ul>\n<li><p><strong>Außenleiter</strong> L1, L2, L3: drei um 120° phasenverschobene Spannungen.</p></li>\n<li><p><strong>Außenleiterspannung</strong> U (zwischen zwei Außenleitern): 400 V.</p></li>\n<li><p><strong>Strangspannung</strong> UStr (an jeder Last bzw. jedem <strong>Strang</strong>).</p></li>\n<li><p><strong>Leiterstrom</strong> I (in der Zuleitung) und <strong>Strangstrom</strong> IStr (in jeder Last).</p></li>\n<li><p><strong>Verkettungsfaktor</strong>: √3 ≈ 1,73.</p></li>\n</ul>\n<table>\n\n<thead>\n<tr>\n<th></th>\n<th><strong>Sternschaltung (Y)</strong></th>\n<th><strong>Dreieckschaltung (Δ)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Anschluss</td>\n<td>Jede Last zwischen Außenleiter und Sternpunkt (N)</td>\n<td>Jede Last zwischen zwei Außenleitern</td>\n</tr>\n<tr>\n<td>Strangspannung</td>\n<td>UStr = U / √3 = <strong>230 V</strong></td>\n<td>UStr = U = <strong>400 V</strong></td>\n</tr>\n<tr>\n<td>Strom</td>\n<td>I = IStr</td>\n<td>I = √3 × IStr</td>\n</tr>\n<tr>\n<td>Neutralleiter</td>\n<td>Möglich (bei ungleicher Last notwendig)</td>\n<td>Kein Neutralleiter</td>\n</tr>\n<tr>\n<td>Leistung</td>\n<td>P = √3 × U × I × cos φ</td>\n<td>P = √3 × U × I × cos φ (bei gleichen Lasten dreifach gegenüber Stern)</td>\n</tr>\n<tr>\n<td>Veranstaltungstechnik</td>\n<td><strong>Normalfall</strong>: 230-V-Verteilung aus einem 400-V-CEE-Anschluss auf Schuko/CEE blau</td>\n<td>Motoren (<strong>Kettenzüge</strong>), Drehstrom-Heizgeräte</td>\n</tr>\n</tbody>\n</table>\n<p><strong>P = √3 × U × I × cos φ = 3 × UStr × IStr × cos φ</strong></p>\n<h4>Beispiel mit drei Widerständen zu 46 Ω</h4>\n<ul>\n<li><p><strong>Stern</strong>: UStr = 230 V → I = 230 V / 46 Ω = 5 A → P = 3 × 230 V × 5 A = <strong>3450 W</strong>.</p></li>\n<li><p><strong>Dreieck</strong>: UStr = 400 V → IStr = 400 V / 46 Ω ≈ 8,7 A → I = 1,73 × 8,7 A ≈ 15 A → P = 3 × 400 V × 8,7 A ≈ <strong>10 400 W</strong> (≈ 3 × 3450 W).</p></li>\n</ul>\n<h4>Stern-Dreieck-Anlauf</h4>\n<p>Große Motoren werden im Stern angelassen (geringerer Anlaufstrom, ca. 1/3) und danach auf Dreieck umgeschaltet, um mit voller Leistung zu arbeiten.</p>\n<h4>Was passiert bei Unterbrechung des Neutralleiters im Stern?</h4>\n<p>Bei ungleicher Last verschiebt sich der Sternpunkt: Einige Lasten erhalten weniger als 230 V, andere <strong>bis fast 400 V</strong> → Geräte werden zerstört. Deshalb wird der Neutralleiter nie einzeln abgesichert oder abgeschaltet, und seine Verbindungen müssen zuverlässig sein.</p>\n<p>Die <strong>Grundschaltungen</strong> (Reihen-, Parallel- und gemischte Schaltung) sind in Punkt 4 erklärt.</p>"}, "es": {"1": "<p><em>Libro: 7.2 Grundbegriffe der Elektrotechnik (págs. 191–204).</em></p>\n<p>Con cinco magnitudes y dos fórmulas (Ohm y potencia) se resuelven casi todos los cálculos del examen.</p>\n<table>\n\n<thead>\n<tr>\n<th>Größe</th>\n<th>Formelzeichen</th>\n<th>Einheit</th>\n<th>Explicación</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Spannung</strong></td>\n<td>U</td>\n<td>Volt (V)</td>\n<td>Diferencia de potencial entre dos puntos; la «presión» que empuja los electrones</td>\n</tr>\n<tr>\n<td><strong>Strom (Stromstärke)</strong></td>\n<td>I</td>\n<td>Ampere (A)</td>\n<td>Carga eléctrica que pasa por un conductor por segundo</td>\n</tr>\n<tr>\n<td><strong>Widerstand</strong></td>\n<td>R</td>\n<td>Ohm (Ω)</td>\n<td>Oposición del material al paso de la corriente</td>\n</tr>\n<tr>\n<td><strong>Leistung</strong></td>\n<td>P</td>\n<td>Watt (W)</td>\n<td>Energía transformada por segundo</td>\n</tr>\n<tr>\n<td><strong>Arbeit (Energie)</strong></td>\n<td>W</td>\n<td>Wattsekunde (Ws), kWh</td>\n<td>Potencia × tiempo; lo que mide el contador</td>\n</tr>\n</tbody>\n</table>\n<h4>a) Spannung</h4>\n<ul>\n<li><p>Solo hay corriente si hay tensión <strong>y</strong> un circuito cerrado.</p></li>\n<li><p>Se mide <strong>parallel</strong> al consumidor con el <strong>Spannungsmesser</strong> (voltímetro).</p></li>\n<li><p>Valores típicos en eventos: 230 V (fase–neutro), 400 V (fase–fase), 12/24 V (LED, SELV).</p></li>\n</ul>\n<h4>b) Strom</h4>\n<ul>\n<li><p><strong>Technische Stromrichtung</strong>: de + a −. Los electrones se mueven al revés.</p></li>\n<li><p>Se mide <strong>in Reihe</strong> con el <strong>Strommesser</strong> o, sin abrir el circuito, con la <strong>Stromzange</strong> (pinza amperimétrica).</p></li>\n<li><p>La corriente es lo que calienta los cables y lo que hace saltar las protecciones.</p></li>\n</ul>\n<h4>c) Widerstand</h4>\n<p>La resistencia de un cable aumenta con la longitud y disminuye con la sección:</p>\n<p><strong>R = l / (κ × A) = (ρ × l) / A</strong></p>\n<p>l = longitud (m), A = sección (mm²), κ = <strong>elektrische Leitfähigkeit</strong> (cobre ≈ 56 m/(Ω·mm²)), ρ = <strong>spezifischer Widerstand</strong> (cobre ≈ 0,0178 Ω·mm²/m). <strong>Leitwert</strong> G = 1/R (Siemens). En los metales, R aumenta con la temperatura.</p>\n<h4>d) Leistung</h4>\n<p><strong>P = U × I = I² × R = U² / R</strong></p>\n<p>En corriente alterna con cargas inductivas: P = U × I × cos φ (ver punto 2).</p>\n<h4>e) Arbeit</h4>\n<p><strong>W = P × t</strong></p>\n<p>Ejemplo: 8 focos LED de 250 W durante 6 h → W = 2 kW × 6 h = 12 kWh.</p>\n<h4>f) Ohmsches Gesetz</h4>\n<p><strong>U = R × I · I = U / R · R = U / I</strong></p>\n<p>Truco: tapa en el triángulo U arriba, R e I abajo, la magnitud que buscas.</p>\n<p>Ejemplo: un calefactor con R = 26,5 Ω a 230 V → I = 230 / 26,5 ≈ 8,7 A → P = 230 × 8,7 ≈ 2000 W.</p>", "2": "<p><em>Libro: 7.2.1 Elektrische Spannung y 7.7 Wechselstromtechnik (págs. 191, 238–247).</em></p>\n<p>La tensión continua mantiene valor y polaridad; la alterna cambia de sentido 50 veces por segundo. La red eléctrica es alterna; la mayoría de la electrónica (LED, procesadores) funciona internamente con continua.</p>\n<table>\n\n<thead>\n<tr>\n<th></th>\n<th><strong>Gleichspannung (DC)</strong></th>\n<th><strong>Wechselspannung (AC)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Comportamiento</td>\n<td>Valor y polaridad constantes</td>\n<td>Cambia de valor y de polaridad periódicamente (senoide)</td>\n</tr>\n<tr>\n<td>Símbolo</td>\n<td>= o DC</td>\n<td>~ o AC</td>\n</tr>\n<tr>\n<td>Fuentes</td>\n<td>Batería, acumulador, fuente de alimentación (<strong>Netzteil</strong>), panel solar</td>\n<td>Red pública, generador (<strong>Stromerzeuger</strong>), transformador</td>\n</tr>\n<tr>\n<td>En eventos</td>\n<td>Pilas de micrófonos inalámbricos, tiras LED 12/24 V, fuentes de los focos LED</td>\n<td>Toda la distribución: 230 V / 400 V, 50 Hz</td>\n</tr>\n<tr>\n<td>Límite de Kleinspannung</td>\n<td>120 V DC</td>\n<td>50 V AC</td>\n</tr>\n</tbody>\n</table>\n<p>Además existe la <strong>Mischspannung</strong>: continua con una parte alterna superpuesta (p. ej., tras un rectificador). Importante para los tipos de RCD (punto 6g).</p>\n<h4>Kenngrößen der Wechselspannung</h4>\n<table>\n\n<thead>\n<tr>\n<th>Größe</th>\n<th>Bedeutung</th>\n<th>Red alemana</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Frequenz</strong> f</td>\n<td>Ciclos por segundo (Hz)</td>\n<td>50 Hz</td>\n</tr>\n<tr>\n<td><strong>Periodendauer</strong> T = 1/f</td>\n<td>Duración de un ciclo</td>\n<td>20 ms</td>\n</tr>\n<tr>\n<td><strong>Scheitelwert</strong> Û</td>\n<td>Valor máximo de la senoide</td>\n<td>≈ 325 V</td>\n</tr>\n<tr>\n<td><strong>Effektivwert</strong> U</td>\n<td>Valor equivalente en calor a una DC; el que indica el multímetro</td>\n<td>230 V</td>\n</tr>\n</tbody>\n</table>\n<p><strong>U = Û / √2 ≈ 0,707 × Û</strong></p>\n<h4>Leistung bei Wechselstrom</h4>\n<p>Con bobinas (motores, transformadores, balastos) o condensadores, la corriente se desfasa de la tensión un ángulo φ:</p>\n<ul>\n<li><p><strong>Wirkleistung</strong> P en W: la que hace trabajo útil (luz, calor, sonido).</p></li>\n<li><p><strong>Blindleistung</strong> Q en var: oscila entre red y aparato, carga los cables pero no hace trabajo.</p></li>\n<li><p><strong>Scheinleistung</strong> S en VA: la total; con ella se dimensionan generadores y transformadores (kVA).</p></li>\n<li><p><strong>Leistungsfaktor</strong> cos φ = P / S. Carga resistiva pura (halógeno, calefactor): cos φ = 1.</p></li>\n</ul>\n<p><strong>Monofásica: P = U × I × cos φ · Trifásica: P = √3 × U × I × cos φ</strong></p>", "3": "<p><em>Libro: 7.8.6 Netzsysteme (pág. 253).</em></p>\n<p>El nombre del sistema dice cómo están conectados a tierra la fuente y los equipos. En eventos, a partir del Speisepunkt se trabaja siempre en <strong>TN-S</strong>.</p>\n<h4>Cómo leer las letras</h4>\n<table>\n\n<thead>\n<tr>\n<th>Letra</th>\n<th>Posición</th>\n<th>Significado</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>T</strong> (terre)</td>\n<td>1.ª</td>\n<td>El punto neutro de la fuente (transformador/generador) está puesto directamente a tierra</td>\n</tr>\n<tr>\n<td><strong>I</strong> (isolé)</td>\n<td>1.ª</td>\n<td>La fuente está aislada de tierra (o a través de una impedancia alta)</td>\n</tr>\n<tr>\n<td><strong>T</strong></td>\n<td>2.ª</td>\n<td>Las masas (<strong>Körper</strong>) de los equipos tienen su propia toma de tierra (<strong>Erder</strong>)</td>\n</tr>\n<tr>\n<td><strong>N</strong></td>\n<td>2.ª</td>\n<td>Las masas están unidas al punto neutro de la fuente mediante un conductor</td>\n</tr>\n<tr>\n<td><strong>S</strong> (séparé)</td>\n<td>3.ª</td>\n<td>Neutro (N) y conductor de protección (PE) van separados</td>\n</tr>\n<tr>\n<td><strong>C</strong> (combiné)</td>\n<td>3.ª</td>\n<td>N y PE van juntos en un solo conductor: <strong>PEN</strong></td>\n</tr>\n</tbody>\n</table>\n<h4>Comparación de los sistemas</h4>\n<table>\n\n<thead>\n<tr>\n<th>System</th>\n<th>Aufbau</th>\n<th>Abschaltung im Fehlerfall</th>\n<th>Eventtechnik</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>TN-S</strong></td>\n<td>5 conductores: L1, L2, L3, N, PE separados en todo el recorrido</td>\n<td>Corriente de fallo alta por el PE → dispara LS/fusible; RCD posible</td>\n<td><strong>Obligatorio</strong> en instalaciones móviles detrás del Speisepunkt</td>\n</tr>\n<tr>\n<td><strong>TN-C</strong></td>\n<td>4 conductores: L1, L2, L3, PEN</td>\n<td>Igual, pero <strong>sin RCD posible</strong> (no se puede separar N de PE)</td>\n<td><strong>Prohibido</strong> en cables flexibles y en eventos; si el PEN se rompe, las carcasas quedan en tensión</td>\n</tr>\n<tr>\n<td><strong>TN-C-S</strong></td>\n<td>PEN hasta un punto de separación, después N y PE separados</td>\n<td>Como TN-S tras la separación</td>\n<td>Típico en edificios; tras la separación, N y PE <strong>nunca</strong> se vuelven a unir</td>\n</tr>\n<tr>\n<td><strong>TT</strong></td>\n<td>Fuente a tierra; las masas a un electrodo propio</td>\n<td>Corriente de fallo pequeña (resistencia de tierra) → <strong>necesita RCD</strong></td>\n<td>Algunos locales o redes rurales; generadores con electrodo propio</td>\n</tr>\n<tr>\n<td><strong>IT</strong></td>\n<td>Fuente aislada de tierra; masas a tierra</td>\n<td>El <strong>primer fallo no desconecta</strong> (no hay retorno); el segundo sí</td>\n<td>Donde un corte sería crítico (quirófanos); necesita <strong>Isolationsüberwachung</strong> (IMD)</td>\n</tr>\n</tbody>\n</table>\n<h4>Lo que debes saber decir en el examen</h4>\n<ul>\n<li><p><strong>Por qué TN-S en eventos</strong>: el PE no lleva corriente de servicio y permite usar RCD; si se rompe el N, el PE sigue protegiendo.</p></li>\n<li><p><strong>Peligro del TN-C</strong>: si se interrumpe el PEN (cable dañado, conector suelto), todas las carcasas conectadas pueden quedar a 230 V.</p></li>\n<li><p>Se identifica el sistema del local en la <strong>Übergabe des Speisepunktes</strong>, preguntando al técnico del recinto y midiendo.</p></li>\n</ul>", "4": "<p><em>Libro: 7.3 Grundschaltungen der Elektrotechnik (págs. 205–215).</em></p>\n<p>En serie la corriente es igual y la tensión se reparte; en paralelo la tensión es igual y la corriente se reparte. Las dos reglas de Kirchhoff lo explican.</p>\n<table>\n\n<thead>\n<tr>\n<th></th>\n<th><strong>Reihenschaltung</strong></th>\n<th><strong>Parallelschaltung</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Strom</td>\n<td>Igual en todos: I = I1 = I2 = …</td>\n<td>Se suma: I = I1 + I2 + …</td>\n</tr>\n<tr>\n<td>Spannung</td>\n<td>Se reparte: U = U1 + U2 + …</td>\n<td>Igual en todos: U = U1 = U2 = …</td>\n</tr>\n<tr>\n<td>Gesamtwiderstand</td>\n<td>R = R1 + R2 + … (mayor que la mayor)</td>\n<td>1/R = 1/R1 + 1/R2 + … (menor que la menor)</td>\n</tr>\n<tr>\n<td>Leistung</td>\n<td>P = P1 + P2 + …</td>\n<td>P = P1 + P2 + …</td>\n</tr>\n<tr>\n<td>Si falla un elemento</td>\n<td>Se interrumpe todo el circuito</td>\n<td>Los demás siguen funcionando</td>\n</tr>\n<tr>\n<td>Ejemplo en eventos</td>\n<td>Resistencia en serie de un LED (<strong>Vorwiderstand</strong>), fusible en serie con el consumidor</td>\n<td>Todos los consumidores en enchufes y regletas</td>\n</tr>\n</tbody>\n</table>\n<p>Atajo para dos resistencias en paralelo:</p>\n<p><strong>Rges = (R1 × R2) / (R1 + R2)</strong></p>\n<h4>a) Maschenregel (2. Kirchhoffsches Gesetz)</h4>\n<p>En un circuito cerrado (<strong>Masche</strong>), la suma de las tensiones es cero: la tensión de la fuente es igual a la suma de las caídas de tensión en los consumidores.</p>\n<p><strong>Σ U = 0 → Uges = U1 + U2 + …</strong></p>\n<p>Aplicación directa: el <strong>Spannungsfall</strong> del cable. Si el cable «se come» 7 V, al foco solo le llegan 223 V. También el <strong>Spannungsteiler</strong>: U1 / U2 = R1 / R2.</p>\n<h4>b) Knotenpunktregel (1. Kirchhoffsches Gesetz)</h4>\n<p>En un nudo (<strong>Knoten</strong>), la suma de las corrientes que entran es igual a la suma de las que salen.</p>\n<p><strong>Σ I (entrantes) = Σ I (salientes)</strong></p>\n<p>Aplicación directa: un distribuidor con tres salidas de 5 A, 7 A y 4 A toma 16 A de la alimentación. También explica el <strong>RCD</strong>: si lo que entra no es igual a lo que sale, falta corriente que se va por otro camino (persona o PE).</p>\n<h4>Gemischte Schaltung (ejemplo)</h4>\n<p>R1 = 10 Ω en serie con un paralelo de R2 = 20 Ω y R3 = 30 Ω, a 230 V:</p>\n<ol type=\"1\">\n<li><p>Paralelo: R23 = (20 × 30) / (20 + 30) = 12 Ω.</p></li>\n<li><p>Total: R = 10 + 12 = 22 Ω → I = 230 / 22 ≈ 10,5 A.</p></li>\n<li><p>U1 = 10 × 10,5 = 105 V; U23 = 230 − 105 = 125 V (Maschenregel).</p></li>\n<li><p>I2 = 125 / 20 = 6,25 A; I3 = 125 / 30 ≈ 4,17 A; suma ≈ 10,4 A (Knotenregel, redondeo).</p></li>\n</ol>", "5": "<p><em>Libro: 7.1 Gefahren im Umgang mit dem elektrischen Strom (págs. 186–190).</em></p>\n<p>Lo peligroso es la corriente que atraviesa el cuerpo (<strong>Körperstrom</strong>). Depende de la tensión de contacto, de la resistencia del cuerpo (≈ 1000 Ω), del recorrido y de la duración. Con 230 V: 230 V / 1000 Ω = 230 mA, mortal.</p>\n<table>\n\n<thead>\n<tr>\n<th>Körperstrom (AC 50 Hz)</th>\n<th>Wirkung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ca. 0,5 mA</td>\n<td><strong>Wahrnehmbarkeitsschwelle</strong>: se empieza a notar</td>\n</tr>\n<tr>\n<td>ca. 10 mA</td>\n<td><strong>Loslassschwelle</strong>: ya no puedes soltar el conductor</td>\n</tr>\n<tr>\n<td>ca. 30 mA</td>\n<td>Calambres musculares, dificultad para respirar → por eso RCD de 30 mA</td>\n</tr>\n<tr>\n<td>ab ca. 50 mA (&gt; 1 s)</td>\n<td><strong>Herzkammerflimmern</strong>: peligro de muerte</td>\n</tr>\n<tr>\n<td>&gt; 3 A</td>\n<td>Paro cardíaco, quemaduras internas</td>\n</tr>\n</tbody>\n</table>\n<p>Otros peligros: <strong>Lichtbogen</strong> (arco eléctrico: quemaduras, ojos), electrólisis de la sangre (daños renales días después), caídas por el susto. <strong>Berührungsspannung</strong> máxima permitida de forma permanente: <strong>50 V AC / 120 V DC</strong>.</p>\n<h4>a) Maßnahmen: die 5 Sicherheitsregeln (DIN VDE 0105-100)</h4>\n<p>Antes de trabajar en partes de una instalación, <strong>siempre en este orden</strong>:</p>\n<ol type=\"1\">\n<li><p><strong>Freischalten</strong> – desconectar por todos los polos.</p></li>\n<li><p><strong>Gegen Wiedereinschalten sichern</strong> – candado, cartel «Nicht schalten», quitar fusibles.</p></li>\n<li><p><strong>Spannungsfreiheit feststellen</strong> – con un <strong>zweipoliger Spannungsprüfer</strong>, en todos los polos (nunca con buscapolos).</p></li>\n<li><p><strong>Erden und kurzschließen</strong> – obligatorio en alta tensión; en baja tensión solo si hay riesgo de retorno de tensión (p. ej., generador).</p></li>\n<li><p><strong>Benachbarte, unter Spannung stehende Teile abdecken oder abschranken</strong>.</p></li>\n</ol>\n<p>Al terminar se anulan <strong>en orden inverso</strong>, y solo vuelve a conectar quien desconectó, cuando todos estén fuera de peligro.</p>\n<p>Regla mnemotécnica: <strong>F</strong>reie <strong>G</strong>eister <strong>S</strong>prechen <strong>E</strong>rnst <strong>A</strong>b → Freischalten, Gegen Wiedereinschalten, Spannungsfreiheit, Erden, Abdecken.</p>\n<h4>b) Qualifikationen für Arbeiten (DGUV V3, VDE 1000-10)</h4>\n<table>\n\n<thead>\n<tr>\n<th>Person</th>\n<th>Definición</th>\n<th>Puede</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Elektrofachkraft (EFK)</strong></td>\n<td>Formación eléctrica, conocimientos, experiencia y conocimiento de las normas; reconoce los peligros por sí misma</td>\n<td>Montar, modificar, reparar y probar instalaciones; asumir la responsabilidad técnica</td>\n</tr>\n<tr>\n<td><strong>EFK für festgelegte Tätigkeiten</strong></td>\n<td>Formación limitada a tareas concretas y repetitivas</td>\n<td>Solo esas tareas (p. ej., conectar distribuidores móviles)</td>\n</tr>\n<tr>\n<td><strong>Elektrotechnisch unterwiesene Person (EuP)</strong></td>\n<td>Instruida por una EFK sobre las tareas encomendadas y sus peligros</td>\n<td>Tareas sencillas bajo <strong>Leitung und Aufsicht</strong> de una EFK (p. ej., tender cables, pruebas con medidor automático)</td>\n</tr>\n<tr>\n<td><strong>Elektrotechnischer Laie</strong></td>\n<td>Sin formación eléctrica</td>\n<td>Solo usar equip
